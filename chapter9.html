<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .stat-box.orange { background: #fffaf0; } .stat-box.orange .num { color: #7b341e; }
  .stat-box.purple { background: #faf5ff; } .stat-box.purple .num { color: #44337a; }

  .palette-btn { width: 100%; aspect-ratio: 1; border: 1px solid #cbd5e0; border-radius: 6px; background: #f7fafc; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .palette-btn:hover { transform: scale(1.05); }

  .palette-btn.not-answered { background: #e53e3e; color: #fff; border-color: #c53030; }
  .palette-btn.marked { background: #805ad5; color: #fff; border-color: #6b46c1; }
  .palette-btn.answered-marked { background: #805ad5; color: #fff; border: 3px solid #38a169; }
  .palette-btn.current { outline: 3px solid #4299e1; outline-offset: 1px; }
  .quiz-area { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
  .quiz-header h2 { color: #2b6cb0; font-size: 18px; }
  .q-counter { background: #4299e1; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }
  .question-box { flex: 1; margin-bottom: 15px; }
  .q-text { font-weight: 600; margin-bottom: 15px; font-size: 16px; line-height: 1.7; }
  .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
  .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }
  .option:hover { border-color: #90cdf4; background: #ebf8ff; }

  .option.wrong-ans { border-color: #e53e3e; background: #fed7d7; }
  .option.disabled { pointer-events: none; opacity: 0.8; }
  .feedback { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
  .feedback.wrong-fb { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }
  .feedback .exp { margin-top: 6px; font-style: italic; color: #4a5568; }
  .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
  .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
  .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
  .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
  .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
  .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
  .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
  .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
  .result-item .label { font-size: 12px; color: #4a5568; }
  .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
  .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
  .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
  .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
  .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
  .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  @media (max-width: 850px) {
    .main-container { flex-direction: column; height: auto; }
    .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
    .sidebar.open { transform: translateY(0); }
    .mobile-palette-toggle { display: block; }
    .quiz-area { min-height: 500px; }
  }
</style>
</head>

<script>
const questions = [
  { q: "Which of the following statements is incorrect?", opts: ["All the elements present in a sample of earth's crust are also present in a sample of living tissue", "Relative abundance of carbon and hydrogen with respect to other elements is higher in any living organisms than in earth's crust", "Living organisms have more nitrogen and oxygen per unit mass than in animate object (e.g. earth crust)", "Living organisms have more Ca, Mg, Na in them than in animate object"], ans: 3, exp: "Living organisms have more Ca, Mg, Na in them than in animate object." },
  { q: "One of the following is almost not found in living organism —", opts: ["Si", "Mg", "Ca", "S"], ans: 0, exp: "Si." },
  { q: "Lipid come under acid insoluble fraction during analysis of chemical composition of tissues. Why?", opts: ["It has low molecular weight", "It has high molecular weight", "It is polymer", "On grinding, the biomembranes are broken into pieces and form insoluble vesicles"], ans: 3, exp: "On grinding, the biomembranes are broken into pieces and form insoluble vesicles." },
  { q: "The inorganic compounds like sulphate, phosphate, etc., are found in —", opts: ["Acid soluble pool", "Acid insoluble fraction", "Both acid soluble pool and acid insoluble fraction", "Not found in cellular pool"], ans: 0, exp: "Acid soluble pool." },
  { q: "All of the following statements are correct except —", opts: ["Elemental analysis gives elemental composition of living tissues", "Analysis for compound gives an idea of the kind of organic and inorganic constituents present in living tissues", "In plant ash contains carbon in maximum amount", "Both a and b"], ans: 2, exp: "In plant ash contains carbon in maximum amount." },
  { q: "The four elements called 'Big-four' which make up 95% of all elements found in a living system are —", opts: ["C, H, O, N", "C, H, O, P", "C, H, O, S", "C, N, O, P"], ans: 0, exp: "C, H, O, N." },
  { q: "The correct order of chemical composition of living tissues / cells in term of % of the total cellular mass is —", opts: ["Nucleic acid > Proteins > H₂O > Carbohydrate > Ions > Lipid", "H₂O > Proteins > Nucleic acid > Carbohydrate > Lipid > Ions", "H₂O > Proteins > Carbohydrate > Nucleic acid > Lipid > Ions", "Lipid > Ions > Carbohydrate > H₂O > Proteins > Nucleic acid"], ans: 2, exp: "H₂O > Proteins > Carbohydrate > Nucleic acid > Lipid > Ions." },
  { q: "The sum total composition of acid soluble and acid insoluble fraction represent the entire empirical composition of —", opts: ["Dead cells", "Gene pool", "Cellular pool", "Gene library"], ans: 2, exp: "Cellular pool." },
  { q: "Biomolecules are —", opts: ["Inorganic materials", "Organic materials", "All the carbon compounds obtained from living tissues", "Only DNA, RNA"], ans: 2, exp: "All the carbon compounds obtained from living tissues." },
  { q: "An amino acid is a/an —", opts: ["Substituted methane", "Substituted ethane", "Any acid having amino group", "Derivative of indoleacetic acid"], ans: 0, exp: "Substituted methane." },
  { q: "In order to produce amino acids from methane how many substituents should occupy the valency positions of the carbon —", opts: ["1", "3", "2", "4"], ans: 1, exp: "3." },
  { q: "Protein amino acids are called —", opts: ["α-amino acids", "β-amino acids", "γ-amino acids", "δ-amino acids"], ans: 0, exp: "α-amino acids." },
  { q: "The number of amino and carboxyl groups in an amino acid is never —", opts: ["1 and 1", "2 and 1", "3 and 1", "1 and 2"], ans: 3, exp: "1 and 2." },
  { q: "The physical and the chemical properties of amino acids are essentially of the —", opts: ["Only amino group", "Only the carboxyl group", "Only the R functional group", "Amino, carboxyl and R groups"], ans: 2, exp: "Only the R functional group." },
  { q: "Which of the group in amino acids makes them unique —", opts: ["R group", "NH₂ group", "COOH group", "All"], ans: 0, exp: "R group." },
  { q: "There are many types of amino acids on the basis of —", opts: ["NH₂ group", "COOH group", "R group", "All"], ans: 2, exp: "R group." },
  { q: "Based upon the number of NH₂ and COOH amino acids are —", opts: ["3 types", "2 types", "4 types", "20 types"], ans: 0, exp: "3 types." },
  { q: "Which one is correct?", opts: ["Acidic Amino Acids - Glutamic acid", "Basic Amino Acids - Lysine", "Neutral Amino Acid - Valine", "All"], ans: 3, exp: "All." },
  { q: "The aromatic amino acid(s) is (are) —", opts: ["Tyrosine", "Phenylalanine", "tryptophan", "All"], ans: 3, exp: "All." },
  { q: "The charged molecule which is electrically neutral is known as —", opts: ["Amide", "Aminoacid", "Zwitterion", "Polar amino acid"], ans: 2, exp: "Zwitterion." },
  { q: "Types of amino acids universally used in protein synthesis are —", opts: ["20", "80", "64", "61"], ans: 0, exp: "20." },
  { q: "Which of the following statements is false?", opts: ["In solutions of different pH, the structure of amino acid changes", "Protein is a homopolymer", "Non-essential amino acids are synthesised by animals", "Dietary proteins are source of essential amino acids"], ans: 1, exp: "Protein is a homopolymer." },
  { q: "Which one is the most abundant organic biomolecule in a cell?", opts: ["Water", "Protein", "DNA", "mRNA"], ans: 1, exp: "Protein." },
  { q: "All are proteins except —", opts: ["Receptors + Insulin", "Antibody + Trypsin", "GLUT-4 + Collagen", "CoQ"], ans: 3, exp: "CoQ." },
  { q: "Match correctly between Column I and Column II: Column I: A. Collagen, B. Trypsin, C. Insulin, D. Antibody, E. Receptor, F. GLUT-4; Column II: I. Glucose transport, II. Binding with some chemical like for small taste and hormones, III. Hormones, IV. Enzyme, V. Intercellular ground substance, VI. Fight infectious agents", opts: ["A-V, B-IV, C-III, D-VI, E-II, F-I", "A-II, B-III, C-IV, D-V, E-VI, F-I", "A-VI, B-II, C-I, D-V, E-IV, F-III", "A-I, B-IV, C-III, D-VI, E-II, F-V"], ans: 0, exp: "A-V, B-IV, C-III, D-VI, E-II, F-I." },
  { q: "In animal world the most abundant protein is _____ while in the whole biosphere the most abundant protein is _____", opts: ["Antibody, Collagen", "Collagen, RuBisCo", "RuBisCo, Collagen", "Collagen, Oxidase"], ans: 1, exp: "Collagen, RuBisCo." },
  { q: "— C — N — is found in all except: (with H attached to N)", opts: ["Polypeptides", "Enzymes", "Amino acid", "Protein"], ans: 2, exp: "Amino acid." },
  { q: "Primary structure of protein is due to —", opts: ["Peptide bonds", "Hydrogen bonds", "-S-S bridge", "Ionic bonds"], ans: 0, exp: "Peptide bonds." },
  { q: "Formation of protein / formation peptide bonds is a type of —", opts: ["Hydration analysis", "Dehydration analysis", "Hydration synthesis", "Dehydration synthesis"], ans: 3, exp: "Dehydration synthesis." },
  { q: "Which one of the following biomolecules will be different in different animals?", opts: ["Lipids", "Vitamins", "Carbohydrates", "Proteins"], ans: 3, exp: "Proteins." },
  { q: "In some places a protein molecule may be folded back on itself. This is called ______ structure and folds or coils are held together in place by ______", opts: ["2°, H-bonds", "2°, Peptide bond", "3°, H-bonds", "1°, Peptide bond"], ans: 0, exp: "2°, H-bonds." },
  { q: "A protein has how many terminal amino acids and are called _____?", opts: ["2; N-terminal amino acid and C-terminal amino acid", "3; N-terminal amino acid, C-terminal amino acid, R-terminal amino acid", "1; C-terminal amino acid", "4; N-terminal amino acids"], ans: 0, exp: "2; N-terminal amino acid and C-terminal amino acid." },
  { q: "All proteins —", opts: ["Are enzymes", "Are homopolymer", "Consists of one or more polypeptide chains", "Have a linear or flat shape"], ans: 2, exp: "Consists of one or more polypeptide chains." },
  { q: "The primary structure of a protein is determined by its —", opts: ["Disulfide brides", "α-helix structure", "Order of amino acids", "3D-structure"], ans: 2, exp: "Order of amino acids." },
  { q: "The quaternary structure of a protein —", opts: ["Consists of 4 subunits - hence the name quaternary", "Is unrelated to the function of the protein", "Both a and b", "Depends on the 1° structure of subunits"], ans: 3, exp: "Depends on the 1° structure of subunits." },
  { q: "Major classes of biologically significant large molecules include which of the following?", opts: ["Proteins", "Nucleic acids", "Carbohydrates and Lipid", "All"], ans: 3, exp: "All." },
  { q: "Amino acids can be classified by the —", opts: ["number of peptide bonds", "Number of disulfide bridges they can form", "Number of carbon-carbon double", "Characteristics of their side chains"], ans: 3, exp: "Characteristics of their side chains." },
  { q: "The shape of folded protein is often determined by —", opts: ["Its tertiary structure", "The sequence of its amino acids", "The number of peptide bonds", "The Chargaffs rule"], ans: 1, exp: "The sequence of its amino acids." },
  { q: "The 20 different common amino acids have different —", opts: ["R-groups", "Acid groups", "Peptide bonds", "1° structure"], ans: 0, exp: "R-groups." },
  { q: "A β-pleated sheet organization in a polypeptide chain is an example of —", opts: ["1° structure", "2° structure", "3° structure", "4° structure"], ans: 1, exp: "2° structure." },
  { q: "Polysaccharides, polypeptides, and polynucleotides have in common that they all —", opts: ["contain amino acids", "Are formed in condensation reactions", "Contain nitrogen", "Come out in acid soluble pool"], ans: 1, exp: "Are formed in condensation reactions." },
  { q: "The ____ structure of a protein relates to how separate polypeptides assemble together —", opts: ["1°", "2°", "3°", "4°"], ans: 3, exp: "4°." },
  { q: "Which of the following statements concerning polymers is not true?", opts: ["Polymers are synthesised from monomers during condensation", "Polymers are synthesised from monomers by addition of water", "Polymers consist of atleast two types of monomers", "b and c"], ans: 3, exp: "b and c." },
  { q: "An α helix is the example of which level of protein structure?", opts: ["1°", "2°", "3°", "4°"], ans: 1, exp: "2°." },
  { q: "Adult human haemoglobin consists of —", opts: ["2 subunits (α, α)", "2 subunits (β, β)", "4 subunits (2α, 2β)", "3 subunits (2α, 1β)"], ans: 2, exp: "4 subunits (2α, 2β)." },
  { q: "The overall three dimensional shape of polypeptide is called the —", opts: ["1° structure", "2° structure", "3° structure", "4° structure"], ans: 2, exp: "3° structure." },
  { q: "Which of the following is incorrect?", opts: ["Quaternary structure refers to the spatial relations between individual polypeptide chains in a multichained protein", "The tertiary structure is absolutely necessary for many biological activities of protein", "Biologists describe the protein structures at 3 levels only", "Protein structure is correlated with protein function"], ans: 2, exp: "Biologists describe the protein structures at 3 levels only." },
  { q: "Primary protein structure determines which of the following additional levels of protein organization?", opts: ["2°", "3°", "2°, 3°, 4°", "4°"], ans: 2, exp: "2°, 3°, 4°." },
  { q: "Which is the highest structural organization found in all enzymes?", opts: ["2°", "3°", "1°", "4°"], ans: 1, exp: "3°." },
  { q: "Plants produce an enormous diversity of substances that have no apparent roles in growth and development processes are classified under the heading of —", opts: ["Primary metabolites", "Secondary metabolites", "Necessary metabolites", "Tertiary metabolites"], ans: 1, exp: "Secondary metabolites." },
  { q: "Which one is secondary metabolite —", opts: ["Amino acid", "Lipid", "Alkaloid", "Protein"], ans: 2, exp: "Alkaloid." },
  { q: "Which of the following statements is false?", opts: ["The study of plant secondary metabolites has many practical application", "Some secondary metabolites have ecological importance", "The types of secondary metabolites in animal cells are more than that in plant cells", "Secondary metabolites are found in fungi, microbes and plants"], ans: 2, exp: "The types of secondary metabolites in animal cells are more than that in plant cells." },
  { q: "Go through the following statements: A. Primary metabolites are biochemicals formed as intermediates and products of normal vital metabolic pathways of organisms. B. Plant tissues produce only secondary metabolites. C. Secondary metabolites have restricted distribution in the plant kingdoms only. D. Secondary metabolites are derivatives of primary metabolites. E. Many plants, fungi and microbes synthesise secondary metabolites. F. No secondary metabolite has ecological importance. G. We understand the role of all secondary metabolites in the host organisms. H. Many secondary metabolites are of economic importance to us. Which of the above statement are wrong?", opts: ["A, B, C are wrong", "D, E, F are wrong", "A, D, E are wrong", "B, C, F, G are wrong"], ans: 3, exp: "B, C, F, G are wrong." },
  { q: "Which one of the following is not a polymeric substance?", opts: ["Rubber", "Morphine", "Gum", "Cellulose"], ans: 1, exp: "Morphine." },
  { q: "Which of the following secondary metabolites are used as drugs?", opts: ["Abrin + Ricin", "Vinblastin + Curcumin", "Anthocyanine", "Ricin + Glucosinolates"], ans: 1, exp: "Vinblastin + Curcumin." },

// ============================================================
// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
  palette.innerHTML = '';
  for (let i = 0; i < totalQ; i++) {
    const btn = document.createElement('button');
    btn.className = 'palette-btn';
    btn.textContent = i + 1;
    btn.id = 'pal-' + i;
    btn.onclick = () => goToQuestion(i);
    palette.appendChild(btn);
  }
}

function updatePalette() {
  for (let i = 0; i < totalQ; i++) {
    const btn = document.getElementById('pal-' + i);
    if (!btn) continue;
    btn.className = 'palette-btn';
    if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
    else if (marked[i]) btn.classList.add('marked');
    else if (userAnswers[i] !== null) btn.classList.add('attempted');
    else if (visited[i]) btn.classList.add('not-answered');
    else btn.classList.add('not-visited');
    if (i === currentQ) btn.classList.add('current');
  }
}

function updateStats() {
  let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
  for (let i = 0; i < totalQ; i++) {
    if (userAnswers[i] !== null) attempted++;
    else if (visited[i]) notAnswered++;
    else notVisited++;
    if (marked[i]) markedCount++;
  }
  document.getElementById('sbTotal').textContent = totalQ;
  document.getElementById('sbAttempted').textContent = attempted;
  document.getElementById('sbNotAnswered').textContent = notAnswered;
  document.getElementById('sbNotVisited').textContent = notVisited;
  document.getElementById('sbMarked').textContent = markedCount;
  document.getElementById('sbCorrect').textContent = correctCount;
  document.getElementById('sbWrong').textContent = wrongCount;
  const marks = correctCount * 1 - wrongCount * 0.25;
  document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
  visited[currentQ] = true;
  const q = questions[currentQ];
  let optsHTML = '';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (oi === q.ans) cls += ' correct-ans';
      else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
    }
    optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
  });

  let fbHTML = '';
  if (userAnswers[currentQ] !== null) {
    const isCorrect = userAnswers[currentQ] === q.ans;
    fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
      ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
    </div>`;
  }

  questionBox.innerHTML = `
    <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
    <div>${optsHTML}</div>
    ${fbHTML}
  `;

  document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
  document.getElementById('btnPrev').disabled = currentQ === 0;
  document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
  document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
  document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

  updatePalette();
  updateStats();
}

function selectAnswer(optIdx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = optIdx;
  if (optIdx === questions[currentQ].ans) correctCount++;
  else wrongCount++;
  renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
  const marks = correctCount * 1 - wrongCount * 0.25;
  const percent = ((marks / totalQ) * 100).toFixed(2);
  document.getElementById('rTotal').textContent = totalQ;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rMarks').textContent = marks.toFixed(2);
  document.getElementById('rPercent').textContent = percent + '%';
  document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
  if (!confirm('Are you sure you want to reset the quiz?')) return;
  for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
  correctCount = 0; wrongCount = 0; currentQ = 0;
  document.getElementById('resultModal').classList.remove('show');
  renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Save Result + Back Button
// ========================================
const CHAPTER_NUM = 9; // ⚠️ यहाँ chapter number बदलें!

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to also save
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        try {
          const marks = correctCount * 1 - wrongCount * 0.25;
          const percent = ((marks / totalQ) * 100).toFixed(2);
          
          const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
          const key = 'chapter' + CHAPTER_NUM;
          
          const newAttempt = {
            correct: correctCount,
            wrong: wrongCount,
            total: totalQ,
            marks: parseFloat(marks.toFixed(2)),
            percent: parseFloat(percent),
            date: new Date().toISOString(),
            userName: JSON.parse(localStorage.getItem('cbt_user') || '{}').name || 'Unknown'
          };
          
          if (!results[key]) {
            results[key] = { attempts: [], totalAttempts: 0 };
          }
          
          results[key].attempts.push(newAttempt);
          results[key].totalAttempts = results[key].attempts.length;
          
          // Keep only last 10 attempts
          if (results[key].attempts.length > 10) {
            results[key].attempts = results[key].attempts.slice(-10);
          }
          
          // Calculate best
          const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
          results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
          
          localStorage.setItem('cbt_results', JSON.stringify(results));
          console.log('✅ Attempt #' + results[key].totalAttempts + ' saved for Chapter ' + CHAPTER_NUM);
        } catch(e) {
          console.log('Save error:', e);
        }
      };
    }
  }, 500);
});
window.addEventListener('load', function() {
  const container = document.querySelector('.container');
  if (container) {
    const backBtn = document.createElement('div');
    backBtn.style.cssText = 'text-align:center; margin-top:20px;';
    backBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:12px 30px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600;">← Back to Dashboard</a>';
    container.appendChild(backBtn);
  }
});
</script>
