<script>
const questions = [
    { q: "1. Streaming of cytoplasm/cyclosis is seen in -", opts: ["Amoeba", "Macrophages", "Leucocytes", "All"], ans: 3, exp: "All are correct." },
    { q: "2. Which of the following statements is correct?", opts: ["Cytoplasmic streaming helps in pseudopodia formation or amoeboid movement", "Cytoplasmic streaming is caused by contracting microfilament", "Both a and b", "Locomotion is not a voluntary movement"], ans: 2, exp: "Both a and b." },
    { q: "3. I. Paramecium employs cilia for pushing food in cytopharynx and in locomotion\nII. Hydra takes help of tentacles for both food capturing and locomotion\nIII. All locomotions are movements and vice-versa\nIV. Methods of locomotion vary with habitats and the demands of situation\nV. Ciliated epithelium is found in respiratory tract, renal tubules and reproductive tracts\nWhich of the above statements is false?", opts: ["I and III", "III", "III and V", "IV and V"], ans: 1, exp: "III." },
    { q: "4. Which of the following statements is false?", opts: ["Locomotion and many other movements required coordinated muscular activities", "Muscle is a specialised tissues of endodermal in origin", "There are about 639 muscles which contribute about 40 - 50 % of adult body wall", "Muscles show contractibility, excitability and conductivity"], ans: 1, exp: "Muscle is a specialised tissues of endodermal in origin." },
    { q: "5. Which of the following statements about the skeletal muscles is correct?", opts: ["They are striated muscles", "They are voluntary muscles", "They are primarily involved in locomotory actions", "All"], ans: 3, exp: "All are correct." },
    { q: "6. Which of the following statements about visceral muscles is correct?", opts: ["They are non-striated muscles (smooth muscles)", "They are involuntary muscles", "They have various functions", "All"], ans: 3, exp: "All are correct." },
    { q: "7. Cardiac/heart muscles are -", opts: ["Striated and involuntary", "Branched", "Not fatigued", "All"], ans: 3, exp: "All are correct." },
    { q: "8. Which of the following statements is false?", opts: ["Smooth muscles are found in urinary bladder, alimentary canal and genital tract", "A striated muscle is syncytium (multinucleate)", "The cytoplasm of striated muscle is called endoplasm", "The plasma membrane and ER of striated muscles are called sarcolemma and sarcoplasmic reticulum respectively"], ans: 2, exp: "The cytoplasm of striated muscle is called endoplasm." },
    { q: "9. The source of Ca+2 for the muscle is -", opts: ["T-tubule", "Sarcosome", "Sarcolemma", "Sarcoplasmic reticulum"], ans: 3, exp: "Sarcoplasmic reticulum." },
    { q: "10. The fascia surrounding a muscle is made up of -", opts: ["Cartilage", "Collagenous connective tissues", "Adipose tissue", "Blood vessels"], ans: 1, exp: "Collagenous connective tissues." },
    { q: "11. Contractile fibrils of muscles are called -", opts: ["Neurofibrils", "Collagen fibres", "Myofibrils", "Yellow fibres"], ans: 2, exp: "Myofibrils." },
    { q: "12. Myofibrils show alternate dark and light bands in -", opts: ["Cardiac muscles", "Smooth muscles", "Striped muscles", "a and c"], ans: 3, exp: "a and c." },
    { q: "13. Select the true statement(s) -", opts: ["A-band is present in the middle of sarcomere", "H-zone is present in the middle of A-band", "M-line is present in the middle of H-zone", "All of the above"], ans: 3, exp: "All of the above." },
    { q: "14. Which is the smallest one?", opts: ["Muscle fibre", "Myofibril", "Actin", "Sarcomere"], ans: 2, exp: "Actin." },
    { q: "15. Match Column I with Column II -\nColumn I: A Structural and functional unit of a myofibril, B. Protein of thin filament, C. Protein of thick filament, D. The central part of thick filament not overlapped by thin filament\nColumn II: I. H-zone, II. Myosin, III. Sarcomere, IV. Actin", opts: ["A-1, B-11, C-111, D-IV", "A-1, B-111, C-11, D-IV", "A- I, B - IV, C - Ill, D - II", "A- Ill, B - IV, C - II, D - I"], ans: 3, exp: "A- Ill, B - IV, C - II, D - I." },
    { q: "16. Z-line divides the myofibrils into -", opts: ["Sarcomere", "Sarcolemma", "Sarcosome", "Microtubules"], ans: 0, exp: "Sarcomere." },
    { q: "17. Sarcomere is the area between -", opts: ["2 H-zones", "2 Z-lines", "2 M-lines", "2 A-bands"], ans: 1, exp: "2 Z-lines." },
    { q: "18. Light bands (thin filaments) contain actin and are called -", opts: ["A-bands or Isotropic band", "A-bands or Anisotropic bands", "I-bands or Isotropic bands", "I-bands or Anisotropic bands"], ans: 2, exp: "I-bands or Isotropic bands." },
    { q: "19. Dark bands (thick filaments) contain myosin and are called -", opts: ["A-bands or Isotropic band", "A-bands or Anisotropic bands", "I-bands or Isotropic bands", "I-bands or Anisotropic bands"], ans: 1, exp: "A-bands or Anisotropic bands." },
    { q: "20. Which of the following statements about the striated muscles is false?\nI. In the centre of each I-band is an elastic fibre (Z-line) which bisects it\nII. Thin filaments are firmly attached to the Z-line\nIII. M-line is a fibrous membrane in the middle of A-bands\nIV. A sarcomere comprises one full A-bands and 2 half I-bands", opts: ["All", "IV", "I and II", "None"], ans: 3, exp: "None." },
    { q: "21. The region between the ends of the A-bands of 2-adjoining sarcomeres is called -", opts: ["The Z-band", "The H-zone", "The T-tubule", "The I-band"], ans: 3, exp: "The I-band." },
    { q: "23. An individual sarcomere consist of -", opts: ["A stack of actin fibres", "A stack of myosin units", "Overlapping actin and myosin", "Overlapping myosin and membrane"], ans: 2, exp: "Overlapping actin and myosin." },
    { q: "24. Which of the following statements about the molecular arrangement of actin and myosin in myofibrils is false?\nI. Each actin (thin filament) is made of 2F (filamentous) actins\nII. F-actin is the polymer of G (globular) actin.\nIII. 2F-actins are twisted into a helix\nIV. Two strands of tropomyosin (protein) lie in the grooves of F-actin\nV Troponin molecules (complex proteins) are distributed at regular intervals on the tropomyosin\nVI. Troponin forms the head of the myosin molecule\nVII. The myosin is a polymerised protein", opts: ["I, III, VII", "Only VII", "Only VI", "Only III"], ans: 2, exp: "Only VI." },
    { q: "25. One myosin filament in the myofibril of skeletal muscle fibres is surrounded by how many actin filaments -", opts: ["8", "2", "6", "4"], ans: 2, exp: "6." },
    { q: "26. The cross bridges of the sarcomere in skeletal muscle are made up of -", opts: ["Actin", "Myosin", "Troponin", "Myelin"], ans: 1, exp: "Myosin." },
    { q: "27. The functions of tropomyosin in skeletal muscle include -", opts: ["Sliding on actin to produce shortening.", "Release Ca+2 after initiation of contraction", "Acting as \"relaxing protein\" at rest by covering up the sites where myosin binds to actin", "Generates ATP"], ans: 2, exp: "Acting as \"relaxing protein\" at rest by covering up the sites where myosin binds to actin." },
    { q: "28. Tropomysin is moved by which of following proteins -", opts: ["Calmodulin", "Actin", "Troponin", "Acetylcholine"], ans: 2, exp: "Troponin." },
    { q: "29. Ca+2 bind _____ in the skeletal muscles and leads to exposure of the binding site for ____ on the filament ____ _", opts: ["Troponin, myosin, actin", "Troponin, actin, relaxin", "Actin, myosin, troponin", "Tropomysin, myosin, actin"], ans: 0, exp: "Troponin, myosin, actin." },
    { q: "32. Which of the following statements is false?", opts: ["Each myosin is a polymerised protein", "Many meromysin constitute one thick filament (myosin)", "Each meromyosin's tail is called heavy meromyosin (HMM) and head is called light meromyosin (LMM)", "The globular head is an active ATPase enzyme and has binding sites for ATP and active sites for actin"], ans: 2, exp: "Each meromyosin's tail is called heavy meromyosin (HMM) and head is called light meromyosin (LMM)." },
    { q: "33. The action potential that triggers a muscle contraction travels deep within the muscle cell by means of -", opts: ["Sarcoplasmic reticulum", "Transverse tubules", "Synapse", "Motor end plates"], ans: 1, exp: "Transverse tubules." },
    { q: "34. ATP provides energy for muscle contraction by allowing for -", opts: ["An action potential formation in the muscle cell", "Cross-bridge detachment of myosin from actin", "Cross-bridge attachment of myosin to actin", "Release of Ca+2 from sarcoplasmic reticulum"], ans: 1, exp: "Cross-bridge detachment of myosin from actin." },
    { q: "35. A motor unit is best described as -", opts: ["All the nerve fibres and muscle fibres in a single muscle bundle", "One muscle fibre and its single nerve fibre", "A single motor neuron and all the muscle fibres that it innervates", "It is the neuron which carries the message from muscle to CNS"], ans: 2, exp: "A single motor neuron and all the muscle fibres that it innervates." },
    { q: "36. Motor end plate is a -", opts: ["Neuromuscular junction", "Plate of motor neuron", "Dendron of motor neuron", "Gradient of proton motive force"], ans: 0, exp: "Neuromuscular junction." },
    { q: "37. Electrical excitation in a muscle fibre most directly causes -", opts: ["Movement of tropomyosin", "Attachment of the cross bridges to actin", "Release of Ca+2 from sarcoplasmic reticulum", "Splitting of ATP"], ans: 2, exp: "Release of Ca+2 from sarcoplasmic reticulum." },
    { q: "38. The energy for muscle contraction is most directly obtained from -", opts: ["Phosphocreatine", "ATP", "Anaerobic respiration", "Aerobic respiration"], ans: 1, exp: "ATP." },
    { q: "39. According to the sliding filament theory -", opts: ["Actin (thin filament) moves past myosin (thick filament)", "Myosin moves past actin", "Both myosin and actin move past each other", "None of these is correct"], ans: 0, exp: "Actin (thin filament) moves past myosin (thick filament)." },
    { q: "40. Put the following phrases in proper order to describe what occurs at the neuromuscular junction to trigger muscle contraction.\nI. Receptor sites on sarcolemma.\nII. Nerve impulse.\nIII. Release of Ca+2 from sarcoplasmic reticulum\nIV. The neurotransmitter acetylcholine is released\nV. Sarcomere shortens\nVI. Synaptic cleft\nVII. Spread of impulses over sarcolemma on T-tubules", opts: ["II, IV, I, VI, VII, III, V", "II, IV, VI, I, VII, III, V", "I, II, III, IV, V, VI, VII", "VII, VI, V, IV, III, II, I"], ans: 1, exp: "II, IV, VI, I, VII, III, V." },
    { q: "42. How does the troponin-tropomyosin complex affect cross-bridge cycling?", opts: ["When [Ca2+] is low, the troponin-tropomyosin complex blocks actin's binding site for myosin. When [Ca2+] is high, the complex rolls out of the way, allowing myosin to bind to actin and initiate the cross-bridge cycle.", "The troponin-tropomyosin complex regenerates ATP for the myosin ATPase.", "The troponin-tropomyosin complex regulates calcium release from the terminal cisternae.", "The troponin-tropomyosin complex binds to the myosin head, facilitating contact with the actin filaments"], ans: 0, exp: "When [Ca2+] is low, the troponin-tropomyosin complex blocks actin's binding site for myosin. When [Ca2+] is high, the complex rolls out of the way, allowing myosin to bind to actin and initiate the cross-bridge cycle." },
    { q: "43. Relaxation of muscle is due to -", opts: ["Pumping of Ca+2 into sarcoplasmic cisternae", "Presence of ATP", "Confirmational change in troponin and masking of actin filaments", "a and c"], ans: 3, exp: "a and c." },
    { q: "45. When a skeletal muscle shortens during contraction which of these statements is false?", opts: ["The I-band shortens", "The A-band shortens", "The H-zone becomes narrow", "The sarcomeres shorten"], ans: 1, exp: "The A-band shortens." },
    { q: "46. The muscle band that remains unchanged during muscle contraction and relaxation of the skeletal muscle is -", opts: ["I", "A", "H", "Z-line"], ans: 1, exp: "A." },
    { q: "47. Which of the following statements is correct?", opts: ["During muscle contraction chemical energy changes into mechanical energy", "Muscle fatigue is due to lactic acid formation due to anaerobic respiration", "The reaction time of the fibres can vary in different muscles", "All"], ans: 3, exp: "All." },
    { q: "48. The compound or pigment acting as an oxygen store in skeletal muscles is -", opts: ["Myoglobin", "Haemoglobin", "Myokinase or ATP", "Cytochrome"], ans: 0, exp: "Myoglobin." },
    { q: "49. I. Number of mitochondria less.\nII. Number of mitochondria more\nIII. Sarcoplasmic reticulum is abundant\nIV. Myoglobin content high\nV. Sarcoplasmic reticulum moderate\nVI. Aerobic muscles\nVII. Depend on anaerobic respiration for energy\nVIII. Less myoglobin content\nA Red muscles\nB. White muscles\nIdentify above (I to VIII) traits as characteristic of A and B types of muscles-", opts: ["A- I, III, VII, VIII; B -II, IV, V, VI", "A-II, IV, V, VI; B- I, III, VII, VIII", "A-1, 111, IV, VII; B - II, V, VI, VIII", "A- 11, V, VI, VIII; B - I, III, IV, VII"], ans: 1, exp: "A-II, IV, V, VI; B- I, III, VII, VIII." },
    { q: "50. Skeletal system consists of -", opts: ["Only bones", "Only cartilage", "A framework of bones and a few cartilage", "A framework of cartilage and a few bone"], ans: 2, exp: "A framework of bones and a few cartilage." },

// ============================================================
// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
    palette.innerHTML = '';
    for (let i = 0; i < totalQ; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = i + 1;
        btn.id = 'pal-' + i;
        btn.onclick = () => goToQuestion(i);
        palette.appendChild(btn);
    }
}

function updatePalette() {
    for (let i = 0; i < totalQ; i++) {
        const btn = document.getElementById('pal-' + i);
        if (!btn) continue;
        btn.className = 'palette-btn';
        if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
        else if (marked[i]) btn.classList.add('marked');
        else if (userAnswers[i] !== null) btn.classList.add('attempted');
        else if (visited[i]) btn.classList.add('not-answered');
        else btn.classList.add('not-visited');
        if (i === currentQ) btn.classList.add('current');
    }
}

function updateStats() {
    let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
    for (let i = 0; i < totalQ; i++) {
        if (userAnswers[i] !== null) attempted++;
        else if (visited[i]) notAnswered++;
        else notVisited++;
        if (marked[i]) markedCount++;
    }
    document.getElementById('sbTotal').textContent = totalQ;
    document.getElementById('sbAttempted').textContent = attempted;
    document.getElementById('sbNotAnswered').textContent = notAnswered;
    document.getElementById('sbNotVisited').textContent = notVisited;
    document.getElementById('sbMarked').textContent = markedCount;
    document.getElementById('sbCorrect').textContent = correctCount;
    document.getElementById('sbWrong').textContent = wrongCount;
    const marks = correctCount * 1 - wrongCount * 0.25;
    document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
    visited[currentQ] = true;
    const q = questions[currentQ];
    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
        let cls = 'option';
        if (userAnswers[currentQ] !== null) {
            cls += ' disabled';
            if (oi === q.ans) cls += ' correct-ans';
            else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
        }
        optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
    });

    let fbHTML = '';
    if (userAnswers[currentQ] !== null) {
        const isCorrect = userAnswers[currentQ] === q.ans;
        fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
            ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
            ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
        </div>`;
    }

    questionBox.innerHTML = `
        <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
        <div>${optsHTML}</div>
        ${fbHTML}
    `;

    document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
    document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
    document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

    updatePalette();
    updateStats();
}

function selectAnswer(optIdx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = optIdx;
    if (optIdx === questions[currentQ].ans) correctCount++;
    else wrongCount++;
    renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
    const marks = correctCount * 1 - wrongCount * 0.25;
    const percent = ((marks / totalQ) * 100).toFixed(2);
    document.getElementById('rTotal').textContent = totalQ;
    document.getElementById('rCorrect').textContent = correctCount;
    document.getElementById('rWrong').textContent = wrongCount;
    document.getElementById('rMarks').textContent = marks.toFixed(2);
    document.getElementById('rPercent').textContent = percent + '%';
    document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
    if (!confirm('Are you sure you want to reset the quiz?')) return;
    for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
    correctCount = 0; wrongCount = 0; currentQ = 0;
    document.getElementById('resultModal').classList.remove('show');
    renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 17; // ⚠️ Chapter number (Yahan 20 hai)

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
