<script>
const questions = [
  { q: "The products of mitosis are —", opts: ["One nucleus containing twice as much DNA as the parent nucleus", "Two genetically identical cells", "Four nuclei containing half as much DNA as the parent nucleus", "Two genetically identical nuclei"], ans: 1, exp: "Two genetically identical cells." },
  { q: "The mitotic spindle is composed of —", opts: ["Chromosomes", "Chromatids", "Microtubules", "Chromatin"], ans: 2, exp: "Microtubules." },
  { q: "Centrosomes are —", opts: ["Constricted regions of phase chromosomes", "Regions where microtubules polymerize", "The central region of the same cell", "Part of cilia"], ans: 1, exp: "Regions where microtubules polymerize." },
  { q: "When dividing cells are examined under a light microscope, chromosomes first become visible during —", opts: ["Interphase", "The S Phase", "Prophase", "G1"], ans: 2, exp: "Prophase." },
  { q: "The structures that line up the chromosomes on the equatorial plate during metaphase are called —", opts: ["Asters", "Polar and Kinetochore microtubules", "Centrosomes", "Centrioles"], ans: 1, exp: "Polar and Kinetochore microtubules." },
  { q: "DNA replication occurs —", opts: ["During both mitosis and meiosis", "Only during mitosis", "Only during meiosis", "During the S phase"], ans: 0, exp: "During both mitosis and meiosis." },
  { q: "Mature nerve cells are incapable of cell division. These cells are probably in —", opts: ["G1 phase", "The S phase", "G2 phase", "Mitosis"], ans: 0, exp: "G1 phase." },
  { q: "The microtubules of the mitotic spindle attach to a specialized structure in the centromere region of each chromosome, called the —", opts: ["Kinetochore", "Nucleosome", "Equatorial plate", "Centrosome"], ans: 0, exp: "Kinetochore." },
  { q: "After the centromeres separate during mitosis the chromatids now called ___ move toward opposite poles of the spindle —", opts: ["Centrosomes", "Kinetochores", "Half spindles", "Daughter chromosomes"], ans: 3, exp: "Daughter chromosomes." },
  { q: "In plant cells, cytokinesis is accomplished by the formation of a(n) —", opts: ["membrane furrow", "Equatorial plate", "Cell plate", "Spindle"], ans: 2, exp: "Cell plate." },
  { q: "Genetically diverse offspring result from —", opts: ["Mitosis", "Cloning", "Cytokinesis", "Sexual reproduction"], ans: 3, exp: "Sexual reproduction." },
  { q: "Meiosis can occur —", opts: ["in all organism", "Only when an organism is diploid", "Only in multicellular organisms", "Only in haploid organisms"], ans: 1, exp: "Only when an organism is diploid." },
  { q: "The members of a homologous pair of chromosomes —", opts: ["Are identical in size and appearance", "Contain identical genetic information", "Separate to opposite poles of the cell during mitosis", "Are found only in haploid cells"], ans: 0, exp: "Are identical in size and appearance." },
  { q: "The diagnosis of Down syndrome is made by examining the individual's —", opts: ["Spores", "Karyotype", "Chromatin", "Nucleosome"], ans: 1, exp: "Karyotype." },
  { q: "During meiosis, the sister chromatids separate during —", opts: ["Anaphase II", "Anaphase I", "The S phase", "Synapsis"], ans: 0, exp: "Anaphase II." },
  { q: "The exchange of genetic material between chromatids and homologous chromosomes occurs during —", opts: ["Interphase", "Mitosis and Meiosis", "Prophase I", "Anaphase I"], ans: 2, exp: "Prophase I." },
  { q: "At the end of the first meiotic division, each chromosome consists of —", opts: ["A homologous chromosome pair", "Four copies of each DNA molecule", "Two chromatids", "A pair of polar microtubules"], ans: 2, exp: "Two chromatids." },
  { q: "The four haploid nuclei found at the end of meiosis differ from one another in their exact genetic composition. Some of this difference is the result of —", opts: ["Cytokinesis", "Respiration of DNA during the S phase", "Spindle formation", "Crossing over during Prophase I"], ans: 3, exp: "Crossing over during Prophase I." },
  { q: "During meiosis I in human, one of the daughter cells receives —", opts: ["Only maternal chromosomes", "A mixture of maternal and paternal chromosomes", "The same number of chromosomes as a diploid cell", "A sister chromatid from each chromosome"], ans: 1, exp: "A mixture of maternal and paternal chromosomes." },
  { q: "A triploid nucleus cannot undergo meiosis because —", opts: ["The DNA cannot replicate", "Not all of the chromosomes can form homologous pairs", "The sister chromatids cannot separate", "Cytokinesis cannot occur"], ans: 1, exp: "Not all of the chromosomes can form homologous pairs." },
  { q: "Chromatin condenses to form discrete, visible chromosomes —", opts: ["Early in G1", "During S", "During telophase", "During prophase"], ans: 3, exp: "During prophase." },
  { q: "Chromosomes decondense into diffuse chromatin —", opts: ["At the end of telophase", "At the beginning of prophase", "At the end of interphase", "At the end of metaphase"], ans: 0, exp: "At the end of telophase." },
  { q: "Genetic recombination occurs during —", opts: ["Prophase of meiosis I", "Interphase preceding meiosis II", "Mitotic telophase", "Fertilization"], ans: 0, exp: "Prophase of meiosis I." },
  { q: "The number of chromosomes is reduced to half during —", opts: ["Anaphase of mitosis and meiosis", "Meiosis II", "Meiosis I", "Fertilization"], ans: 2, exp: "Meiosis I." },
  { q: "The total DNA content of each daughter cell is reduced during meiosis because —", opts: ["Chromosomes do not replicate during the interphase preceding meiosis I", "Chromosomes do not replicate between meiosis I and II", "Half of the chromosomes from each gamete are lost during fertilization", "Chromosome arms are lost during crossing over"], ans: 1, exp: "Chromosomes do not replicate between meiosis I and II." },
  { q: "Chromosome number is reduced during meiosis because the process consists of —", opts: ["Two cell divisions without any chromosome replication", "A single cell division without any chromosome replication", "Two cell divisions in which half of the chromosomes are destroyed", "Two cell divisions and only single round of chromosome replication"], ans: 3, exp: "Two cell divisions and only single round of chromosome replication." },
  { q: "Which of the following is not true for homologous chromosome pairs?", opts: ["They come from only one of the individual's parents", "They usually contain slightly different versions of the same genetic information", "They segregate from each other during meiosis I", "They synapse during meiosis I"], ans: 0, exp: "They come from only one of the individual's parents." },
  { q: "Which of the following is not true for sister chromatids?", opts: ["They arise by replication during S phase", "They segregate from each other during each mitotic anaphase", "They usually contain identical versions of the same genetic information", "They segregate from each other during meiosis I"], ans: 3, exp: "They segregate from each other during meiosis I." },
  { q: "A cell that is post reproductive will remain in —", opts: ["S", "G1", "G2", "M"], ans: 2, exp: "G2." },
  { q: "The milestone that defines telophase is when the chromosomes —", opts: ["Separate", "Come together", "Are at opposite poles", "Line up"], ans: 2, exp: "Are at opposite poles." },
  { q: "Meiosis takes place in —", opts: ["Conidia", "Gemmule", "Megaspore", "Meiocyte"], ans: 3, exp: "Meiocyte." },
  { q: "A reduction step during meiosis is important because —", opts: ["It returns the chromosomes number to normal before fertilization", "There is a mechanism for this", "Only one copy of each chromosome is necessary", "Otherwise chromosome copies would double each fertilization"], ans: 0, exp: "It returns the chromosomes number to normal before fertilization." },
  { q: "Which of the following phases lasts for more than 95% of the duration of cell cycle —", opts: ["M-phase", "G1-phase", "G2-phase", "Interphase"], ans: 3, exp: "Interphase." },
  { q: "Which phase corresponds to the interval between the mitosis and initiation of DNA replication —", opts: ["S-phase", "M-phase", "G1-phase", "G2-phase"], ans: 2, exp: "G1-phase." },
  { q: "What happens in S-phase?", opts: ["DNA replication", "In animal cell replication of centriole", "Both a and b", "Separation of replicated DNA"], ans: 2, exp: "Both a and b." },
  { q: "Which is otherwise called quiescent stage?", opts: ["G0", "G1", "G2", "S-phase"], ans: 0, exp: "G0." },
  { q: "Cells in G0-stage —", opts: ["Are metabolically more active", "Are metabolically inactive", "Remain metabolically active but no longer proliferate in normal condition", "None"], ans: 2, exp: "Remain metabolically active but no longer proliferate in normal condition." },
  { q: "Mitosis is seen in —", opts: ["Apical meristem", "Lateral meristem", "Intercalary meristem", "All meristematic cells"], ans: 3, exp: "All meristematic cells." },
  { q: "As mitosis begins, a condensed chromosome appears to consist of two —", opts: ["Centromeres", "Centriole", "Centrosome", "Chromatids"], ans: 3, exp: "Chromatids." },
  { q: "During which phase of the cell cycle does cell grow. The cell doubles in size during which phase of cell cycle —", opts: ["Interphase", "Metaphase", "Anaphase", "Telophase"], ans: 0, exp: "Interphase." },
  { q: "Normal cellular activities, such protein synthesis, occurs primarily during —", opts: ["Prophase", "Metaphase", "Anaphase", "Interphase"], ans: 3, exp: "Interphase." },
  { q: "It is important that the centromere not divide till the end of metaphase because it —", opts: ["Contains genes that control prophase", "Holds the replicated DNA molecules together", "Is connected with nuclear membrane", "Produces spindle fibres"], ans: 1, exp: "Holds the replicated DNA molecules together." },
  { q: "Mitotic telophase shows which of the following events —", opts: ["Arrival of chromosomes cluster at opposite pole and loss of their identity as discrete elements", "NM assembles around each chromosomes clusters", "Nucleolus, GB and ER form", "All"], ans: 3, exp: "All." },
  { q: "Which of the following statements is True?", opts: ["Cell plate represents the middle lamella between the walls of two adjacents cells", "At the time of cytokinesis, organelles like mitochondria and plastids get distributed between the daughter cells", "Cytokinesis in plant cell is centrifugal and takes place by cell-plate formation while animal cells by furrowing / cleavage and is centripetal", "All"], ans: 3, exp: "All." },
  { q: "I. Terminalization of chiasmata occurs. II. Chromosomes are fully condensed. III. Meiotic spindle is assembled. IV. By the end NM and nucleolus disappear. The above points indicate that it is —", opts: ["Zygotene stage", "Diakinesis stage", "Metaphase II", "Pachytene"], ans: 1, exp: "Diakinesis stage." },
  { q: "Crossing is an enzyme-mediated process. The enzyme is —", opts: ["DNA ligase", "Recombinase", "RNAase", "DNAase"], ans: 1, exp: "Recombinase." },
  { q: "Diplotene can lasts for months or years in —", opts: ["Oocytes of all vertebrates", "Oocytes of all invertebrates", "Oocytes of some vertebrates", "Spermatocytes of all vertebrates"], ans: 2, exp: "Oocytes of some vertebrates." },
  { q: "Match Column I with Column II: Column I: I. Chromosomes are moved to spindle equator, II. Centromere splits and chromatids apart, III. Pairing between homologous chromosomes takes place, IV. Crossing between homologous chromosomes. Column II: (a) Pachytene, (b) Zygotene, (c) Anaphase, (d) Metaphase.", opts: ["A-I, B-II, C-III, D-IV", "A-IV, B-III, C-II, D-I", "A-III, B-IV, C-I, D-II", "A-II, B-I, C-IV, D-III"], ans: 1, exp: "A-IV, B-III, C-II, D-I." },
  { q: "Cell cycle is the character of —", opts: ["Only bacteria", "Only plants and animals", "Only protists", "All organisms"], ans: 3, exp: "All organisms." },
  { q: "Which event is not associated with prophase I?", opts: ["Synizesis", "Synapsis", "Segregation", "Terminalization"], ans: 2, exp: "Segregation." },
  { q: "Human cells in culture show a cell cycle to be completed in approximately —", opts: ["42 hours", "24 hours", "24 minutes", "24 seconds"], ans: 1, exp: "24 hours." },
  { q: "Yeast cell divides once in approximately every —", opts: ["90 minutes", "9 minutes", "24 hours", "24 days"], ans: 0, exp: "90 minutes." },
  { q: "Which one is the correct sequence of a cell cycle?", opts: ["G2 → M → G1 → S", "S → G2 → M → G1", "G1 → S → G2 → M", "M → G1 → G2 → S"], ans: 2, exp: "G1 → S → G2 → M." },
  { q: "A cell cycle includes —", opts: ["Interphase + M-phase / divisional phase", "Prophase + Metaphase + Anaphase + Telophase", "G1 + S + G2 - phase", "karyokinesis + Cytokinesis"], ans: 0, exp: "Interphase + M-phase / divisional phase." },

  { q: "Which one is the longest phase?", opts: ["G1", "G2", "Interphase", "Prophase"], ans: 2, exp: "Interphase." },

// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
  palette.innerHTML = '';
  for (let i = 0; i < totalQ; i++) {
    const btn = document.createElement('button');
    btn.className = 'palette-btn';
    btn.textContent = i + 1;
    btn.id = 'pal-' + i;
    btn.onclick = () => goToQuestion(i);
    palette.appendChild(btn);
  }
}

function updatePalette() {
  for (let i = 0; i < totalQ; i++) {
    const btn = document.getElementById('pal-' + i);
    if (!btn) continue;
    btn.className = 'palette-btn';
    if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
    else if (marked[i]) btn.classList.add('marked');
    else if (userAnswers[i] !== null) btn.classList.add('attempted');
    else if (visited[i]) btn.classList.add('not-answered');
    else btn.classList.add('not-visited');
    if (i === currentQ) btn.classList.add('current');
  }
}

function updateStats() {
  let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
  for (let i = 0; i < totalQ; i++) {
    if (userAnswers[i] !== null) attempted++;
    else if (visited[i]) notAnswered++;
    else notVisited++;
    if (marked[i]) markedCount++;
  }
  document.getElementById('sbTotal').textContent = totalQ;
  document.getElementById('sbAttempted').textContent = attempted;
  document.getElementById('sbNotAnswered').textContent = notAnswered;
  document.getElementById('sbNotVisited').textContent = notVisited;
  document.getElementById('sbMarked').textContent = markedCount;
  document.getElementById('sbCorrect').textContent = correctCount;
  document.getElementById('sbWrong').textContent = wrongCount;
  const marks = correctCount * 1 - wrongCount * 0.25;
  document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
  visited[currentQ] = true;
  const q = questions[currentQ];
  let optsHTML = '';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (oi === q.ans) cls += ' correct-ans';
      else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
    }
    optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
  });

  let fbHTML = '';
  if (userAnswers[currentQ] !== null) {
    const isCorrect = userAnswers[currentQ] === q.ans;
    fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
      ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
    </div>`;
  }

  questionBox.innerHTML = `
    <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
    <div>${optsHTML}</div>
    ${fbHTML}
  `;

  document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
  document.getElementById('btnPrev').disabled = currentQ === 0;
  document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
  document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
  document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

  updatePalette();
  updateStats();
}

function selectAnswer(optIdx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = optIdx;
  if (optIdx === questions[currentQ].ans) correctCount++;
  else wrongCount++;
  renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
  const marks = correctCount * 1 - wrongCount * 0.25;
  const percent = ((marks / totalQ) * 100).toFixed(2);
  document.getElementById('rTotal').textContent = totalQ;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rMarks').textContent = marks.toFixed(2);
  document.getElementById('rPercent').textContent = percent + '%';
  document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
  if (!confirm('Are you sure you want to reset the quiz?')) return;
  for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
  correctCount = 0; wrongCount = 0; currentQ = 0;
  document.getElementById('resultModal').classList.remove('show');
  renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 10; // ⚠️ Chapter number (Yahan 10 hai)

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
<script src="results-save.js"></script>
