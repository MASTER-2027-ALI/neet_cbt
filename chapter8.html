<style>

  .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

  }
</style>

<script>
const questions = [
  { q: "Unicellular organisms are —", opts: ["Not capable of independent existence because they cannot perform all the essential functions of life", "Not capable of independent existence but they can perform all the essential vital functions", "Are capable of independent existence and perform all the essential vital functions", "Are capable to lead independent existence but they perform some vital functions"], ans: 2, exp: "Are capable of independent existence and perform all the essential vital functions." },
  { q: "Select the incorrect statement —", opts: ["Any thing less than a complete structure of a cell does not ensure independent living", "Anton Von Leeuwenhoek first saw and described a living cell", "Robert Brown discovered cell", "Cell is the basic unit of structure and function of all organisms"], ans: 2, exp: "Robert Brown discovered cell." },
  { q: "Cell is the fundamental structural and functional unit of all living organisms is evidenced by the facts like —", opts: ["Any thing less than a complete structure of a cell does not ensure independent living", "Subcellular components can regenerate whole cell", "A cell arises by fusion of two cells", "All cells are totipotent"], ans: 0, exp: "Any thing less than a complete structure of a cell does not ensure independent living." },
  { q: "Select the right option which relates to Schwann regarding the following statement: I. He reported that cells have a thin outer layer which is today known as plasma membrane. II. Cell wall is a unique character of the plant cell. III. Body of plants and animals are composed of cells and products of cells.", opts: ["All are correct", "Only III is correct", "II and III are correct", "All are incorrect"], ans: 0, exp: "All are correct." },
  { q: "Which of the following statements was not explained in the cell theory given jointly by Schleiden and Schwann?", opts: ["All living organisms are composed of cells and products of cells", "Cell is the structural and functional unit of living organisms", "Explanation of formation of new cells", "None"], ans: 2, exp: "Explanation of formation of new cells." },
  { q: "Choose the wrong option —", opts: ["Mycoplasma is the smallest cell (0.3 μm in length)", "Bacteria are 3 to 5 μm", "The largest cell is the egg of an ostrich", "Nerve cells are some of the smallest cells"], ans: 3, exp: "Nerve cells are some of the smallest cells." },
  { q: "I. The shape of the cells may vary with the function they perform. II. Human RBC is about 7.0 μm in diameter. III. Cytoplasm is the main arena of cellular activities. IV. Various chemical reactions occur in cytoplasm to keep the cell in the living state.", opts: ["All are correct", "Only I and II are correct", "Only IV is correct", "All are wrong"], ans: 0, exp: "All are correct." },
  { q: "Go through the following statements and then select correct option(s) for prokaryotic cells: I. They are generally smaller than eukaryotic cells. II. They multiply more rapidly than the eukaryotic cells. III. They are presented by bacteria, B.G.A, mycoplasma and PPLO.", opts: ["All", "II and III", "Only III", "I and III"], ans: 0, exp: "All." },
  { q: "All the statements are correct except —", opts: ["The organization of the prokaryotic cells is fundamentally similar", "Prokaryotes show a wide variety of shapes and functions", "Few prokaryotes have cell walls", "There is no well-defined nucleus"], ans: 2, exp: "Few prokaryotes have cell walls." },
  { q: "Organization of a cell has not been achieved in —", opts: ["Bacteria", "Bacteriophage", "Amoeba", "Diatom"], ans: 1, exp: "Bacteriophage." },
  { q: "Which of the following is (are) exception(s) to the cell theory —", opts: ["Viruses", "Viriods", "Prions", "All"], ans: 3, exp: "All." },
  { q: "Arrange the following cells in an ascending order of their sizes: I. Mycoplasma, II. Ostrich egg, III. Human RBC, IV. Bacteria", opts: ["I, II, III, IV", "I, IV, III, II", "II, IV, I, III", "IV, III, II, I"], ans: 1, exp: "I, IV, III, II." },
  { q: "Match the column I with column II correctly: Column I: I. Typical bacteria, II. Viruses, III. PPLO, IV. A typical eukaryotic cells; Column II: A. 10-20 μm, B. 1-2 μm, C. 0.1 μm, D. 0.02-0.2 μm", opts: ["I-B, II-D, III-C, IV-A", "I-A, II-B, III-C, IV-D", "I-D, II-C, III-B, IV-A", "I-B, II-D, III-A, IV-C"], ans: 0, exp: "I-B, II-D, III-C, IV-A." },
  { q: "Which of the following is not a characteristic of prokaryotic cell —", opts: ["Mesosome", "Circular DNA", "Photosynthetic membrane system", "Membrane bound organelles"], ans: 3, exp: "Membrane bound organelles." },
  { q: "Which of the following statements concerning prokaryotes is/are true?", opts: ["Because prokaryotes do not contain organelles, they cannot photosynthesize or carry out cellular respiration", "Prokaryotes have no chromosomes and therefore lack DNA", "Prokaryotic flagella are similar in structure to eukaryotic flagella", "None of the above"], ans: 3, exp: "None of the above." },
  { q: "All of the following statements are correct about plasmids except —", opts: ["they are extrachromosomal DNA", "They are smaller, circular, double stranded naked DNA that confer certain unique phenotypic characters to some bacteria like resistance to antibiotics", "They are used in genetic engineering", "It helps in the replication of nucleoid"], ans: 3, exp: "It helps in the replication of nucleoid." },
  { q: "Which one is correct about mesosome?", opts: ["A characteristic of bacteria", "Infolding of cell membrane", "May be in the form of vesicles, tubules or lamellae", "All"], ans: 3, exp: "All." },
  { q: "I. It is the extension of plasma membrane into the cytoplasm. II. It helps in cell wall formation, DNA replication, helps in respiration, secretion processes, increases the surface area of plasma membrane and enzymatic contents, also helps in cytokinesis. III. It is the characteristic of bacterial cells. The above features are attributed to bacterial —", opts: ["Nucleoid", "Plasmid", "Mesosome", "Pilus"], ans: 2, exp: "Mesosome." },
  { q: "Most prokaryotic cells, particularly the bacterial cells, have —", opts: ["A chemically simple cell envelope", "A chemically complex cell envelope", "No cell envelope", "Cell envelope only in the form a cell membrane"], ans: 1, exp: "A chemically complex cell envelope." },
  { q: "Most of the bacterial cell envelope consists of —", opts: ["Only the cell membrane", "The cell wall and cell membrane", "A tightly bound 3 layered structure", "Only glycocalyx"], ans: 2, exp: "A tightly bound 3 layered structure." },
  { q: "Which one is correct about the bacterial cell envelope?", opts: ["The outmost cell wall followed by glycocalyx and then plasma membrane", "The outer most glycocalyx followed by plasma membrane and then cell wall", "The outermost glycocalyx followed by cell wall and plasma membrane", "Cell envelope is chemically very simple and consists of only plasma membrane"], ans: 2, exp: "The outermost glycocalyx followed by cell wall and plasma membrane." },
  { q: "Which of the following pairs is mismatched?", opts: ["Glycocalyx - may be capsule or slime layer", "Pili - Reproduction", "Cell wall - Protective, determines shape, prevents from bursting", "Flagella, Pilli and Fimbriae - Surface structures of bacterial cell"], ans: 1, exp: "Pili - Reproduction." },
  { q: "Which is mismatched pair?", opts: ["Capsule - Thick and tough glycocalyx", "Slime layer - Loose glycocalyx", "Pili - Motility organ", "Bacterial cells - Motile or nonmotile"], ans: 2, exp: "Pili - Motility organ." },
  { q: "Which of the following is not true about fimbriae?", opts: ["they are composed of protein", "They may be used for attachment", "They are small bristle like fibres sprouting out of the bacterial cell", "They form pellicle"], ans: 3, exp: "They form pellicle." },
  { q: "Which is false?", opts: ["Bacterial glycocalyx differs in composition and thickness among different bacteria", "Bacterial envelope has a 3 layered structure and each layer has a distinct function but they act as a single protective unit", "Bacteria are organelleless and sans ribosomes", "Number and arrangement of flagella are variable in bacteria"], ans: 2, exp: "Bacteria are organelleless and sans ribosomes." },
  { q: "Bacteria can be classified into 2 groups on the basis of —", opts: ["Differences in the cell envelopes", "The manner in which they respond to the staining procedure developed by Gram", "Occurrence of pili", "a and b"], ans: 3, exp: "a and b." },
  { q: "Bacterial flagellum consists of all of the following parts except —", opts: ["Filament", "Microtubule", "Hook", "Basal body"], ans: 1, exp: "Microtubule." },
  { q: "Select the incorrect statement —", opts: ["Filament of the bacterial flagella is the longest part and extends from the cell surface to the outside", "In prokaryotes, ribosomes (70S) are associated with plasma membrane", "Size of prokaryotic ribosomes (70S) is 15 nm x 20 nm", "None"], ans: 3, exp: "None." },
  { q: "Select the incorrect statement about prokaryotic ribosomes —", opts: ["50S and 30S subunits unite to form 70S ribosomes", "Polysome / polyribosome consists of many ribosomes only", "Ribosome is the site of protein synthesis", "Polysome indicate the synthesis of identical polypeptide in multiple copies"], ans: 1, exp: "Polysome / polyribosome consists of many ribosomes only." },
  { q: "Which of the following statement is false for prokaryotic cell inclusions?", opts: ["These are storage granules in the cytoplasm", "They are membranous", "Phosphate granules, cyanophycean granules and glycogen granules are the examples of cell inclusions", "Gas vacuole is found in B.G.A and purple and green photosynthetic bacteria"], ans: 1, exp: "They are membranous." },
  { q: "The eukaryotes include —", opts: ["Fungi", "Protists", "Plants and animals", "All"], ans: 3, exp: "All." },
  { q: "If you removed the fimbriae from a bacterial cell, which of the following would you expect to happen?", opts: ["The bacteria could no longer swim", "The bacteria would not adhere to the host tissue", "Transportation of molecules across the membrane would stop", "The shape of bacteria would change"], ans: 1, exp: "The bacteria would not adhere to the host tissue." },
  { q: "There is an extensive compartmentalization of cytoplasm through membrane bound organelles in all except —", opts: ["Prokaryotes", "Diatoms", "Plants and fungi", "Animals"], ans: 0, exp: "Prokaryotes." },
  { q: "Plant cells differ from animal cells in having —", opts: ["large vacuole, plastid and cell wall", "Cell wall, plastid, centriole", "Cell wall, plastid and mitochondria", "Cell membrane, plastid and cell wall"], ans: 0, exp: "large vacuole, plastid and cell wall." },
  { q: "Cell membrane is absent in living —", opts: ["Prokaryotic cells", "RBC", "Mesophyll cell", "None"], ans: 3, exp: "None." },
  { q: "The detailed structure of the membrane was studied in the 1950s only after the advent of the —", opts: ["Phase contrast microscope", "Electrophoresis", "Electron microscope", "DNA probes"], ans: 2, exp: "Electron microscope." },
  { q: "The best material for the study of structure of cell membrane is —", opts: ["RBC of human", "RBC of frog", "Kidney cell", "Muscle cell"], ans: 0, exp: "RBC of human." },
  { q: "Biochemical investigation reveals that the cell membrane is composed of —", opts: ["Proteins + Lipids only", "Carbohydrate + Protein only", "Carbohydrate + Lipids + Proteins", "Carbohydrate + lipids only"], ans: 2, exp: "Carbohydrate + Lipids + Proteins." },
  { q: "In cell membrane, lipids are arranged in a —", opts: ["Bilayer", "Mono layer", "Multilayer", "Unilayer at some places and bilayers at other places"], ans: 0, exp: "Bilayer." },
  { q: "The most abundant lipid in the cell membrane is —", opts: ["Cutin", "Cholesterol", "Steroid", "Phospholipid / phosphoglycerides"], ans: 3, exp: "Phospholipid / phosphoglycerides." },
  { q: "Lipids are arranged within the membrane with —", opts: ["Polar heads towards inner side and the hydrophobic tails towards outer side", "Both heads and tails towards outer side", "Heads towards outer side and tail towards inside", "Both heads and tails towards inner side"], ans: 2, exp: "Heads towards outer side and tail towards inside." },
  { q: "Why tail of lipids in the membrane are towards inner part?", opts: ["The tail is non polar hydrocarbon and so protected within an aqueous environment", "The tail is polar hydrocarbon and so is protected from aqueous environment", "The non polar or hydrophobic hydrocarbon tails of lipid, being on inner side ensures their protection from aqueous environment", "The tail is hydrophilic so it tends to be located in the aqueous inner side of membrane"], ans: 2, exp: "The non polar or hydrophobic hydrocarbon tails of lipid, being on inner side ensures their protection from aqueous environment." },
  { q: "Which of the following statement is incorrect about the plasma membrane?", opts: ["The ratio of proteins and lipid varies considerably in different cell types", "52% protein and 40% lipids are in the membrane of human RBC", "The arrangement of proteins (P) and lipids (L) is L-P-P-L", "Head of lipid (fatty acid) is hydrophilic"], ans: 2, exp: "The arrangement of proteins (P) and lipids (L) is L-P-P-L." },
  { q: "The molecules in a membrane that limit its permeability are the —", opts: ["Carbohydrates", "Phospholipids", "Proteins", "Water"], ans: 2, exp: "Proteins." },
  { q: "An improved model of cell membrane, a widely accepted model is the —", opts: ["Unit membrane model", "Fluid mosaic model", "Danielli and Davson's model", "Robertson's model"], ans: 1, exp: "Fluid mosaic model." },
  { q: "Who proposed the fluid mosaic model of plasma membrane in 1972?", opts: ["Singer and Nicolson", "Robertson", "Robert Brown", "Camillo Golgi"], ans: 0, exp: "Singer and Nicolson." },
  { q: "Which of the following statements is not true about the cell membrane?", opts: ["It is present in both plant and animal cells", "Lipid is present in it as bilayer", "Proteins may be peripheral or integral in it", "carbohydrates are never found in it"], ans: 3, exp: "carbohydrates are never found in it." },
  { q: "According to the fluid mosaic model of the cell membrane, the proteins are located —", opts: ["In a continuous layer over the outer surface of the membrane only", "In a continuous layer over the inner surface only", "In discontinuous arrangement, both on the surface (as peripheral proteins) and in the interior of the membrane (integral proteins)", "In the middle of the membrane, between the lipid layers only"], ans: 2, exp: "In discontinuous arrangement, both on the surface (as peripheral proteins) and in the interior of the membrane (integral proteins)." },

// ============================================================
// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
  palette.innerHTML = '';
  for (let i = 0; i < totalQ; i++) {
    const btn = document.createElement('button');
    btn.className = 'palette-btn';
    btn.textContent = i + 1;
    btn.id = 'pal-' + i;
    btn.onclick = () => goToQuestion(i);
    palette.appendChild(btn);
  }
}

function updatePalette() {
  for (let i = 0; i < totalQ; i++) {
    const btn = document.getElementById('pal-' + i);
    if (!btn) continue;
    btn.className = 'palette-btn';
    if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
    else if (marked[i]) btn.classList.add('marked');
    else if (userAnswers[i] !== null) btn.classList.add('attempted');
    else if (visited[i]) btn.classList.add('not-answered');
    else btn.classList.add('not-visited');
    if (i === currentQ) btn.classList.add('current');
  }
}

function updateStats() {
  let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
  for (let i = 0; i < totalQ; i++) {
    if (userAnswers[i] !== null) attempted++;
    else if (visited[i]) notAnswered++;
    else notVisited++;
    if (marked[i]) markedCount++;
  }
  document.getElementById('sbTotal').textContent = totalQ;
  document.getElementById('sbAttempted').textContent = attempted;
  document.getElementById('sbNotAnswered').textContent = notAnswered;
  document.getElementById('sbNotVisited').textContent = notVisited;
  document.getElementById('sbMarked').textContent = markedCount;
  document.getElementById('sbCorrect').textContent = correctCount;
  document.getElementById('sbWrong').textContent = wrongCount;
  const marks = correctCount * 1 - wrongCount * 0.25;
  document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
  visited[currentQ] = true;
  const q = questions[currentQ];
  let optsHTML = '';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (oi === q.ans) cls += ' correct-ans';
      else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
    }
    optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
  });

  let fbHTML = '';
  if (userAnswers[currentQ] !== null) {
    const isCorrect = userAnswers[currentQ] === q.ans;
    fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
      ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
    </div>`;
  }

  questionBox.innerHTML = `
    <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
    <div>${optsHTML}</div>
    ${fbHTML}
  `;

  document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
  document.getElementById('btnPrev').disabled = currentQ === 0;
  document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
  document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
  document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

  updatePalette();
  updateStats();
}

function selectAnswer(optIdx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = optIdx;
  if (optIdx === questions[currentQ].ans) correctCount++;
  else wrongCount++;
  renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
  const marks = correctCount * 1 - wrongCount * 0.25;
  const percent = ((marks / totalQ) * 100).toFixed(2);
  document.getElementById('rTotal').textContent = totalQ;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rMarks').textContent = marks.toFixed(2);
  document.getElementById('rPercent').textContent = percent + '%';
  document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
  if (!confirm('Are you sure you want to reset the quiz?')) return;
  for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
  correctCount = 0; wrongCount = 0; currentQ = 0;
  document.getElementById('resultModal').classList.remove('show');
  renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Save Result + Back Button
// ========================================
const CHAPTER_NUM = 8; // ⚠️ यहाँ chapter number बदलें!

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to also save
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        try {
          const marks = correctCount * 1 - wrongCount * 0.25;
          const percent = ((marks / totalQ) * 100).toFixed(2);
          
          const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
          const key = 'chapter' + CHAPTER_NUM;
          
          const newAttempt = {
            correct: correctCount,
            wrong: wrongCount,
            total: totalQ,
            marks: parseFloat(marks.toFixed(2)),
            percent: parseFloat(percent),
            date: new Date().toISOString(),
            userName: JSON.parse(localStorage.getItem('cbt_user') || '{}').name || 'Unknown'
          };
          
          if (!results[key]) {
            results[key] = { attempts: [], totalAttempts: 0 };
          }
          
          results[key].attempts.push(newAttempt);
          results[key].totalAttempts = results[key].attempts.length;
          
          // Keep only last 10 attempts
          if (results[key].attempts.length > 10) {
            results[key].attempts = results[key].attempts.slice(-10);
          }
          
          // Calculate best
          const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
          results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
          
          localStorage.setItem('cbt_results', JSON.stringify(results));
          console.log('✅ Attempt #' + results[key].totalAttempts + ' saved for Chapter ' + CHAPTER_NUM);
        } catch(e) {
          console.log('Save error:', e);
        }
      };
    }
  }, 500);
});
window.addEventListener('load', function() {
  const container = document.querySelector('.container');
  if (container) {
    const backBtn = document.createElement('div');
    backBtn.style.cssText = 'text-align:center; margin-top:20px;';
    backBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:12px 30px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600;">← Back to Dashboard</a>';
    container.appendChild(backBtn);
  }
});
</script>
