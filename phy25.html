    { q: "141. When one of slits is covered with cellophane paper, the intensity of light emerging from the slit is decreased (because this medium is translucent). Now, the two interfering beam have different intensities or amplitudes. Hence, intensity at minima will not be zero and fringes will become indistinct.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "When one of slits is covered with cellophane paper, the intensity of light emerging from the slit is decreased (because this medium is translucent). Now, the two interfering beam have different intensities or amplitudes. Hence, intensity at minima will not be zero and fringes will become indistinct." },
    { q: "142. For reflecting system of the film, the condition for maxima or constructive interference is 2μt cos r = ((2n - 1)/2)λ, while the maxima for transmitted system of film is given by equation 2μt cos r = nλ, where t is thickness of the film and r is angle of refraction. From these two equations, we can see that condition for maxima in reflected system and transmitted system are just opposite.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "For reflecting system of the film, the condition for maxima or constructive interference is 2μt cos r = ((2n - 1)/2)λ, while the maxima for transmitted system of film is given by equation 2μt cos r = nλ, where t is thickness of the film and r is angle of refraction. From these two equations, we can see that condition for maxima in reflected system and transmitted system are just opposite." },
    { q: "143. In Young's double slit experiment fringe width for dark and white fringes are same while in the same experiment, when a white light as source is used, the central fringe is white around while few coloured fringes are observed on either side.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "In Young's double slit experiment fringe width for dark and white fringes are same while in the same experiment, when a white light as source is used, the central fringe is white around while few coloured fringes are observed on either side." },
    { q: "144. Fringe width, β = λD/d shall remain the same as the waves travel in air only, after passing through the thin transparent sheet. Due to introduction of this sheet, only path difference is changed, due to which there is shift of position of fringes only, which is given as Δx = D(μ - 1)t/d, where, μ is refractive index of thin sheet and t is thickness.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Fringe width, β = λD/d shall remain the same as the waves travel in air only, after passing through the thin transparent sheet. Due to introduction of this sheet, only path difference is changed, due to which there is shift of position of fringes only, which is given as Δx = D(μ - 1)t/d, where, μ is refractive index of thin sheet and t is thickness." },
    { q: "145. For diffraction to occur, the size of an obstacle/aperture is comparable to the wavelength of light wave. The order of wavelength of light wave is 10⁻⁷, so diffraction occurs.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "For diffraction to occur, the size of an obstacle/aperture is comparable to the wavelength of light wave. The order of wavelength of light wave is 10⁻⁷, so diffraction occurs." },
    { q: "146. Maxwell proposed that light must be an electromagnetic wave. Thus, according to Maxwell, light waves are associated with changing electric and magnetic fields. The changing electric and magnetic field result in the propagation of electromagnetic waves (or light waves) even in vacuum.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Maxwell proposed that light must be an electromagnetic wave. Thus, according to Maxwell, light waves are associated with changing electric and magnetic fields. The changing electric and magnetic field result in the propagation of electromagnetic waves (or light waves) even in vacuum." },
    { q: "147. The frequency of light emitted by a charged oscillator equal to its frequency of oscillation. So, the frequency of scattered light equals to the frequency of incident light.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "The frequency of light emitted by a charged oscillator equal to its frequency of oscillation. So, the frequency of scattered light equals to the frequency of incident light." },
    { q: "148. Red colour travels faster than violet in glass. Speed of light is independent of its colour only in vacuum. For light travelling from medium 1 to medium 2, v₁/v₂ = λ₁/λ₂ = μ₂/μ₁.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Red colour travels faster than violet in glass. Speed of light is independent of its colour only in vacuum. For light travelling from medium 1 to medium 2, v₁/v₂ = λ₁/λ₂ = μ₂/μ₁." },
    { q: "149. μ = c/v. Hence, the speed of light decreases in denser medium. Energy carried by a wave depends on the amplitude of the wave, not on the speed of wave propagation. Energy remains same. Also, intensity of wave ∝ (amplitude)² or I ∝ A².", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "μ = c/v. Hence, the speed of light decreases in denser medium. Energy carried by a wave depends on the amplitude of the wave, not on the speed of wave propagation. Energy remains same. Also, intensity of wave ∝ (amplitude)² or I ∝ A²." },
    { q: "150. Only transverse waves can be polarised. Sound waves are longitudinal waves, so these waves cannot be polarised.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Only transverse waves can be polarised. Sound waves are longitudinal waves, so these waves cannot be polarised." },
    { q: "151. I_max = (√I₁ + √I₂)² = (2√I₀)² = 4I₀. The minimum intensity observed at dark band is given by I_min = [√I₁ - √I₂]². If I₁ = I₂ = I₀, I_min = 0. If I₁ ≠ I₂; I_min ≠ 0.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "I_max = (√I₁ + √I₂)² = (2√I₀)² = 4I₀. The minimum intensity observed at dark band is given by I_min = [√I₁ - √I₂]². If I₁ = I₂ = I₀, I_min = 0. If I₁ ≠ I₂; I_min ≠ 0." },
    { q: "152. For centre of screen, S₁P - S₂P = 0 => ΔL = 0. => Δφ = 2π/λ × ΔL = 0. So, waves meet in phase and results in intensity maxima or bright fringe due to constructive interference.", img: "images/phy25-q152.png", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "For centre of screen, S₁P - S₂P = 0 => ΔL = 0. => Δφ = 2π/λ × ΔL = 0. So, waves meet in phase and results in intensity maxima or bright fringe due to constructive interference." },
    { q: "153. (a) Only Statement I is correct.", img: "", opts: ["Statement I is correct but Statement II is incorrect.", "Statement II is correct but Statement I is incorrect.", "Both statements are correct.", "Both statements are incorrect."], ans: 0, exp: "In Young's double slit experiment, the width of one of the slits is slowly increased to make it twice the width of the other slit. The intensity of both the maxima and minima increases. But Intensity of light from the slits is directly proportional to the width of the slit." },
    { q: "154. Diffraction determines the limitations of the concepts of light rays. A beam of width a starts to spread out due to diffraction after it has travelled a distance (2a²/λ).", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Diffraction determines the limitations of the concepts of light rays. A beam of width a starts to spread out due to diffraction after it has travelled a distance (2a²/λ)." },
    { q: "155. According to Maxwell's electromagnetic theory following phenomenon can be explained.\nI. propagation of light in vaccum\nII. interference of light\nIII. polarisation of light\nIV. photoelectric effect", img: "", opts: ["I, II and III", "I, II, IV", "I, III and IV", "II, III and IV"], ans: 0, exp: "According to Maxwell's electromagnetic theory, propagation of light in vacuum, interference of light and polarisation of light can be explained." },
    { q: "156. Which of the following statement(s) is/are correct?\nI. A point source emitting waves uniformly in all directions.\nII. In spherical wave, the locus of point which have the some amplitude and vibrate in same phase are spheres.\nIII. At a small distance from the source, a small portion of sphere can be considered as plane wave.", img: "", opts: ["Only I", "Both I and II", "Only III", "All of the above"], ans: 3, exp: "All of the above statements are correct." },
    { q: "157. In case of reflection of a wavefront from a reflecting surface,\nI. points A and E are in same phase\nII. points A and C are in same phase\nIII. points B and A are in same phase\nIV. points C and E are in same phase", img: "images/phy25-q157.png", opts: ["I and II", "II and III", "III and IV", "I and IV"], ans: 3, exp: "I and IV statements are correct." },
    { q: "158. Figure shows behaviour of a wavefront when it passes through a prism. Which of the following statement(s) is/are correct?\nI. Lower portion of wavefront (B') is delayed resulting in a tilt.\nII. Time taken by light to reach A' from A is equal the time taken to reach B' from B.\nIII. Speed of wavefront is same everywhere.\nIV. A particle on wavefront A'B' is in phase with a particle on wavefront AB.", img: "images/phy25-q158.png", opts: ["I and II", "II and III", "III and IV", "I and III"], ans: 0, exp: "I and II statements are correct." },
    { q: "159. Monochromatic light of wavelength 589 nm is incident from air on a water surface. (Refractive index of water is 1.33). Which of the following statement(s) is/are correct?\nI. Frequency of reflected light and refracted light are same.\nII. Wavelength of reflected light is more than that of refracted light.\nIII. Speed of reflected light is equal to that of refracted light.\nIV. Intensity of reflected light is always more than that of refracted light.", img: "", opts: ["I and III", "II and IV", "I and II", "III and IV"], ans: 2, exp: "I and II statements are correct." },
    { q: "160. Shape of wavefront in case of\nI. light diverging from a point source.\nII. light emerging out of convex lens when a point source is placed at its focus.\nIII. the portion of the wavefront of light from a distant star intercepted by the earth are respectively.", img: "", opts: ["cylindrical, concave, plane", "spherical, plane, plane", "spherical, convex, plane", "spherical, cylindrical, plane"], ans: 1, exp: "Shape of wavefront in case of light diverging from a point source is spherical, light emerging out of convex lens when a point source is placed at its focus is plane and the portion of the wavefront of light from a distant star intercepted by the earth is plane." },
    { q: "161. Let S₁ and S₂ are two sources and if wave from S₁ reaches some common point P be covering seven time of wavelength (λ) and from S₂ by covering nine times of wavelength (λ). Which of the following statement(s) is/are correct?\nI. S₂P - S₁P = 2λ\nII. Waves from S₁ arrives exactly two cycles earlier than waves from S₂.\nIII. At P waves from S₁ and S₂ are in phase.\nIV. At P waves from S₁ and S₂ are out of phase.", img: "images/phy25-q161.png", opts: ["I, II and III", "I, III and IV", "II, III and IV", "I, II and IV"], ans: 0, exp: "I, II and III statements are correct." },
    { q: "162. The conditions for producing sustained interference are\nI. phase difference between interfering waves remains constant with time.\nII. interfering waves have nearly same amplitude levels\nIII. interfering waves are of same frequency.\nIV. interfering waves are moving in opposite directions.", img: "", opts: ["I, II and III", "II and III", "III and IV", "(d) I and IV"], ans: 0, exp: "I, II and III statements are correct." },
    { q: "163. The necessary condition for formation of rainbow is the\n(i) Sun should be shining in part of the sky while it is raining in the opposite part of the sky.\n(ii) The observer must stand with his back towards the Sun.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "The necessary condition for formation of rainbow is the (i) Sun should be shining in part of the sky while it is raining in the opposite part of the sky. (ii) The observer must stand with his back towards the Sun." },
    { q: "164. The amount of scattering is inversely proportional to the fourth power of the wavelength. This is known as Rayleigh scattering.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "The amount of scattering is inversely proportional to the fourth power of the wavelength. This is known as Rayleigh scattering." },
    { q: "165. At sunset or sunrise, the Sun's rays have to pass through a larger distance in the atmosphere. Most of the blue and other shorter wavelengths are removed by scattering. The least scattered light reaching our eyes, therefore, the Sun looks reddish. This explains the reddish appearance of the Sun and full Moon near the horizon.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "At sunset or sunrise, the Sun's rays have to pass through a larger distance in the atmosphere. Most of the blue and other shorter wavelengths are removed by scattering. The least scattered light reaching our eyes, therefore, the Sun looks reddish. This explains the reddish appearance of the Sun and full Moon near the horizon." },
    { q: "166. If the ratio of amount of scattering of two light waves is 1 : 4, then the ratio of their wavelengths is", img: "", opts: ["√2 : 1", "2 : 1", "3 : 1", "2√2 : 1"], ans: 0, exp: "We know, from Rayleigh's scattering. Amount of scattering ∝ 1/λ⁴. => (Amount of scattering)₁/(Amount of scattering)₂ = λ₂⁴/λ₁⁴ => 1/4 = (λ₂/λ₁)⁴ => λ₂/λ₁ = (1/4)^(1/4) = 1/√2. Therefore, λ₁ : λ₂ = √2 : 1." },
    { q: "167. Red colour is used for danger signals because it undergoes least scattering", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "From Rayleigh's scattering, amount of scattering ∝ 1/λ⁴. Since, λ_red is more, it is least scattered and hence, suitable for indication signals." },
    { q: "168. The sky would appear red instead of blue, if atmospheric particles scatter red light more than the blue light", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Amount of scattering ∝ 1/λ⁴ (Rayleigh's law). Thus, sky appears blue as blue light (short wavelength) is scattered more than red and predominates. If red light will be scattered more, sky would appears red." },
    { q: "169. Consider the arrangement shows in the figure. The distance D is large compared to the separation d between the slits. For this arrangement, match the items in Column I with terms in Column II and choose the correct option from codes given below.", img: "images/phy25-q169.png", opts: ["A → 4, B → 3, C → 2, D → 1", "A → 1, B → 2, C → 3, D → 4", "A → 1, B → 3, C → 2, D → 4", "A → 4, B → 2, C → 3, D → 1"], ans: 1, exp: "A. The minimum value of d so that there is a dark fringe at O for x = D is √(λD/3). B. For x = D and d minimum such that there is dark fringe at O, the distance y at which next bright fringe is located is 2d. C. Fringe width for x = D is d. D. The minimum value of d so that there is a dark fringe at O for x = D/2 is √(λD/2)." },
    { q: "170. Column I shows the changes introduced in Young's double-slit experiment while Column II tells the changes in the fringe pattern while performing the experiment. Match each situation given in Column I with the result given in Column II.\nColumn I:\nA. If sodium light is replaced by red light of same intensity\nB. Monochromatic light is replaced by white light\nC. Distance between slits and screen is doubled and the distance between slits is halved\nD. If one of the slits is covered by cellophane paper\n\nColumn II:\n1. All fringes are coloured except central fringe\n2. Fringe width will became quadrupled\n3. The bright fringe will became less bright\n4. The fringe width will increase", img: "", opts: ["A → 4, B → 1, C → 2, D → 3", "A → 1, B → 2, C → 3, D → 4", "A → 3, B → 1, C → 4, D → 2", "A → 3, B → 2, C → 4, D → 1"], ans: 0, exp: "A → 4: Fringe width, W = Dλ/d where, D = distance between slits and screen, d = distance between slits and λ = wavelength of light. A. λ increase so W also increase (∵ A → 4). B. White light produces coloured fringes (∵ B → 1). C. If D is doubled and d is halved, then W becomes four times (∵ C → 2). D. If intensity of either slit is reduced, the bright fringes became less bright. (∵ D → 3)." },
    { q: "171. Column I shows the changes introduced in Young's double-slit experiment while Column II tells the changes in the fringe pattern while performing the experiment. Match each situation given in Column I with the result given in Column II.\nColumn I:\nA. If sodium light is replaced by red light of same intensity\nB. Monochromatic light is replaced by white light\nC. Distance between slits and screen is doubled and the distance between slits is halved\nD. If one of the slits is covered by cellophane paper\n\nColumn II:\n1. All fringes are coloured except central fringe\n2. Fringe width will became quadrupled\n3. The bright fringe will became less bright\n4. The fringe width will increase", img: "", opts: ["A → 4, B → 1, C → 2, D → 3", "A → 1, B → 2, C → 3, D → 4", "A → 3, B → 1, C → 4, D → 2", "A → 3, B → 2, C → 4, D → 1"], ans: 0, exp: "A → 4: Fringe width, W = Dλ/d where, D = distance between slits and screen, d = distance between slits and λ = wavelength of light. A. λ increase so W also increase (∵ A → 4). B. White light produces coloured fringes (∵ B → 1). C. If D is doubled and d is halved, then W becomes four times (∵ C → 2). D. If intensity of either slit is reduced, the bright fringes became less bright. (∵ D → 3)." },
    { q: "172. [Passage: The figure represents a wavefront emanating from a point source.] The phase difference between the two points P and Q on the wavefront is", img: "images/phy25-q172.png", opts: ["π/2", "0", "π/3", "Data insufficient"], ans: 1, exp: "A wavefront is locus of points, which oscillate in phase i.e., it is a surface of constant phase." },
    { q: "173. [Passage: The figure represents a wavefront emanating from a point source.] The amplitude of point P and Q on the wavefront is", img: "images/phy25-q173.png", opts: ["same", "different", "zero", "Data sufficient"], ans: 0, exp: "If we have a point source emitting waves uniformly in all directions, then the locus of points which have the same amplitude and vibrate in same phase are spheres." },
    { q: "174. [Passage: A point source emits wave diverging in all directions.] At a finite distance r from the source the shape of wavefront is", img: "", opts: ["spherical", "plane", "Either (a) or (b)", "None of these"], ans: 0, exp: "At a finite distance r the shape of the wavefront is spherical." },
    { q: "175. [Passage: A point source emits wave diverging in all directions.] At a very large distance from the source, the shape of the wavefront will be", img: "", opts: ["spherical", "plane", "Either (a) or (b)", "None of these"], ans: 1, exp: "At a large distance from the source, a small portion of the spherical wave can be approximated by a plane wave." },
    { q: "176. [Passage: In the given figure, AB is an incident wavefront and EC is refracted wavefront. Speed of light in medium 1 is v₁ and speed of light in medium 2 is v₂.] The ratio of sin i/sin r is equal to", img: "images/phy25-q176.png", opts: ["BC/AC", "AE/EC", "BC/AE", "AE/BC"], ans: 2, exp: "sin i = BC/AC = v₁τ/AC and sin r = AE/AC = v₂τ/AC where, i and r are the angles of incidence and refraction, respectively. sin i/sin r = (BC/AC)/(AE/AC) = BC/AE." },
    { q: "177. [Passage: In the given figure, AB is an incident wavefront and EC is refracted wavefront. Speed of light in medium 1 is v₁ and speed of light in medium 2 is v₂.] When light travelling through medium 1, passes through medium 2, which of the statements is correct.", img: "images/phy25-q177.png", opts: ["sin i/sin r = v₂/v₁", "η = C/v₁", "η₂₁ = v₂/v₁", "v₁/λ₁ = v₂/λ₂"], ans: 3, exp: "According to Snell's law of refraction, we have sin i/sin r = v₁τ/AC / v₂τ/AC = v₁/v₂. v₁/v₂ = βλ₁/βλ₂ = λ₁/λ₂ or v₁/λ₁ = v₂/λ₂." },
    { q: "178. [Passage: In the given figure, AB is an incident wavefront and EC is refracted wavefront. Speed of light in medium 1 is v₁ and speed of light in medium 2 is v₂.] In case of refraction of a light beam, which of these remains constant?", img: "images/phy25-q178.png", opts: ["Speed", "Wavelength", "Frequency", "Intensity"], ans: 2, exp: "In refraction, speed and wavelength changes but frequency remains constant. As part of light is always reflected (and also absorbed,) there is change in intensity of light also." },
    { q: "179. [Passage: Monochromatic light of wavelength 589 nm in incident from air on a water surface. λ₁ and λ₂ are the wavelength of reflected and refracted light respectively, v₁ and v₂ are the velocities of reflected and refracted light, respectively. (Refractive index of water is 1.33)] The velocities of reflected and refracted light is v₁ and v₂, respectively. Then, v₁/v₂ is (ratio of frequency) is", img: "", opts: ["1", "2", "3", "4"], ans: 0, exp: "On reflection and refraction, frequency of light remains the same. Therefore, v₁/v₂ = 1." },
    { q: "180. [Passage: Monochromatic light of wavelength 589 nm in incident from air on a water surface. λ₁ and λ₂ are the wavelength of reflected and refracted light respectively, v₁ and v₂ are the velocities of reflected and refracted light, respectively. (Refractive index of water is 1.33)] Match the items in Column I with terms in Column II and choose the correct option from the codes given below.\nColumn I:\nA. λ₁ (in nm)\nB. λ₂ (in nm)\nC. v₁ (in 10⁶ ms⁻¹)\nD. v₂ (in 10⁶ ms⁻¹)\n\nColumn II:\n1. 442\n2. 225\n3. 589\n4. 300", img: "", opts: ["A-3, B-1, C-4, D-2", "A-1, B-2, C-3, D-4", "A-2, B-4, C-1, D-3", "A-1, B-3, C-2, D-4"], ans: 0, exp: "According to Snell's law of refraction, sin i/sin r = μ₂/μ₁ = v₁/v₂ = λ₁/λ₂ ...(i). Given, wavelength of incident light, λ₁ = 589 nm. For reflection, λ₂ = λ₁ = 589 nm ...(A). Also, v₂ = v₁ = 3 × 10⁸ ms⁻¹ = 300 × 10⁶ ms⁻¹ ...(C). For refraction, using Eq. (i) μ₂/μ₁ = λ₁/λ₂ = v₁/v₂ => λ₂ = λ₁/μ₂/μ₁ = 589 nm/(4/3) = 441.7 nm = 442 nm ...(B). Also, v₂ = v₁/μ₂ = (3 × 10⁸)/(4/3) = 2.25 × 10⁸ ms⁻¹ = 2.25 × 10⁶ ms⁻¹ ...(D)." },
    { q: "181. [Passage: The expression for Doppler's shift is given by Δv/v = v_radial/c. (Consider the directions from observer to source as positive)] Here, v_radial refers to", img: "", opts: ["the component of the source velocity along the line joining the source to observer", "the component of the source velocity along the line joining the observer to the source relative to the observer", "the frequency of light as observed by the observer", "None of the above"], ans: 1, exp: "In Doppler's shift given by, Δv/v = v_radial/c. Δv/v = fractional change in frequency. v_radial = the component of the source velocity along the line joining the observer to the source relative to the observer. c = speed of light in vacuum = 3 × 10⁸ ms⁻¹." },
    { q: "182. [Passage: The expression for Doppler's shift is given by Δv/v = v_radial/c. (Consider the directions from observer to source as positive)] Statement I The Doppler's shift expression is valid only when the speed of the source is small compared to that of light.\nStatement II Doppler's effect in light can be used to estimate the velocity of aeroplanes, rockets submarines etc.", img: "", opts: ["Both the Statements are correct", "Both the Statements are incorrect", "Statement I is correct, Statement II is incorrect", "Statement I is incorrect, Statement II is correct"], ans: 0, exp: "I. The Doppler's shift is valid only when the speed of source is small compared to that of light. When speeds are close to that of light, the concept of Einstein's special theory of relativity is used. II. Doppler's effect finds application in estimation of the velocity of aeroplanes, rockets, submarines etc." },
    { q: "183. [Passage: The string shown above is given an up and down jerk at one end of it while the outer end is fixed at origin.] If the string always remains confined to the XY-plane, then it represents", img: "images/phy25-q183.png", opts: ["a plane polarised wave", "an unpolarised wave", "linearly polarised wave", "Both (a) and (c)"], ans: 3, exp: "In transverse wave the displacement is in the y-direction, it is often referred to as a y-polarised wave. Since, each point on the string moves on a straight line, the wave is also referred to as a linearly polarised wave. Further, the string always remains confined to the XY-plane and therefore, it is also referred to as a plane polarised wave." },
    { q: "184. [Passage: The string shown above is given an up and down jerk at one end of it while the outer end is fixed at origin.] If the plane of the vibrations of the string is changed randomly in a very short intervals of time, it is known as", img: "images/phy25-q184.png", opts: ["polarised wave", "plane polarised wave", "unpolarised wave", "Both (a) and (b)"], ans: 2, exp: "If the plane of vibration of the string is changed randomly in very short intervals of time, then we have what is known as an unpolarised wave. Thus for an unpolarised wave the displacement will be randomly changing with time though it will always be perpendicular to the direction of propagation." },
    { q: "185. [Passage: Light passes through two polaroids P₁ and P₂ with pass axis of P₂ making an angle θ with the pass axis of P₁.] The value of θ for which the intensity of emergent light is zero, is", img: "", opts: ["45°", "90°", "60°", "30°"], ans: 1, exp: "By law of Malus, intensity of emergent light from P₂ is I = I₀ cos² θ, where θ = angle between P₁ and P₂ pass axis. => I = 0 when θ = 90°." },
    { q: "186. [Passage: Light passes through two polaroids P₁ and P₂ with pass axis of P₂ making an angle θ with the pass axis of P₁.] A third polaroid is placed between P₁ and P₂ with its pass axis making an angle β with the pass axis of P₁. The value of β for which the intensity of light from P₂ is I₀/8, where I₀ is the intensity of light on the polaroid P₁ is", img: "", opts: ["0°", "30°", "45°", "60°"], ans: 2, exp: "Let P₃ be the new polaroid inserted. β = angle between the pass axis of P₁ and P₃ (given). I₀ = Intensity of light on polaroid P₁ (given). Let α be the angle between P₃ and P₂ pass axis. Intensity of light from P₁ = I₀/2. Intensity of light from P₃ = I₀/2 cos² β. Intensity of light from P₂ = I₀/2 cos² β cos² α. Therefore, α = π/2 - β (as P₁ and P₂ are perpendicular). I = I₀/2 cos² β cos² (π/2 - β) = I₀/2 cos² β sin² β = I₀/8 sin² 2β (∵ sin 2θ = 2sin θ cos θ). Also, I = I₀/8 (given). => I₀/8 = I₀/8 sin² 2β or sin² 2β = 1 => β = π/4 = 45°." },
    { q: "187. In the Young's double slit experiment, the ratio of intensities bright and dark fringes is 9. This mean that", img: "", opts: ["the intensities of individual sources are 5 and 4 units respectively", "the intensities of individual sources are 4 and 1 units respectively", "the ratio of their amplitudes is 3", "the ratio of their amplitudes is 2"], ans: 1, exp: "I_max/I_min = 9 => (a₁ + a₂)/(a₁ - a₂)² = 9 => (a₁ + a₂)/(a₁ - a₂) = √9 = 3 => a₁ + a₂ = 3(a₁ - a₂) => a₁ + a₂ = 3a₁ - 3a₂ => 2a₂ = 4a₁ => a₁/a₂ = 2/1. Therefore I₁ : I₂ = 4:1." },
    { q: "188. A thin film of thickness t and index of refraction 1.33 coats a glass with index of refraction 1.50. Which of the following thickness t will not reflect normally incident light with wavelength 640 nm in air?", img: "", opts: ["120 nm", "240 nm", "360 nm", "480 nm"], ans: 1, exp: "We have, for minima is reflection 2μ₁t = nλ => t = nλ/2μ₁ = n × 640 × 3/(2 × 4) = 240 nm. t = 240 nm, 480 nm, ..." },
    { q: "189. Two sources S₁ and S₂ of intensity I₁ and I₂ are placed infront of a screen Fig. (a). The pattern of intensity distribution seen in the central portion is given by Fig. (b). In this case, which of the following statements are true?", img: "images/phy25-q189.png", opts: ["S₁ and S₂ have the same intensities", "S₁ and S₂ have a constant phase difference", "S₁ and S₂ have the same phase", "S₁ and S₂ have the same wavelength"], ans: 0, exp: "Consider the pattern of the intensity shown in the figure of question. (i) As intensities of all successive minima is zero, hence we can say that two sources S₁ and S₂ are having same intensities." },
    { q: "190. Consider the sunlight incident on a pinhole of width 10³ Å. The image of the pinhole seen on a screen shall be", img: "", opts: ["a sharp white ring", "different from a geometrical image", "a diffused central spot, white in colour", "a diffused coloured region around a sharp central white spot"], ans: 1, exp: "Given, width of pinhole = 10³ Å = 1000 Å. We know that wavelength of sunlight ranges from 4000 Å to 8000 Å. Clearly, wavelength λ < width of the slit. Hence, light is diffracted from the hole. Due to diffraction from the sunlight the image formed on the screen will be different from the geometrical image and overlapping of colour v." },
    { q: "191. For light from a point source,", img: "", opts: ["the wavefront is spherical", "the intensity decreases in proportion to the distance squared", "the wavefront is parabolic", "the intensity at the wavefront does not depend on the distance"], ans: 0, exp: "Consider the diagram in which light diverges from a point source (O). Due to the point source light propagates in all directions symmetrically and hence, wavefront will be spherical as shown in the diagram. If power of the source is P, then intensity of the source will be I = P/4πr² where, r is radius of the wavefront at any time." },
    { q: "192. Monochromatic light of wavelength 589 nm is incident from air on a water surface. What are the wavelength, frequency and speed of (i) reflected and (ii) refracted light? (Refractive index of water is 1.33).", img: "", opts: ["Reflected light - 589×10⁻⁹ m, 5.09×10¹⁴ Hz, 3×10⁸ ms⁻¹; Refracted light - 4.42×10⁻⁷ m, 5.09×10¹⁴ Hz, 2.25×10⁸ ms⁻¹", "Reflected light - 475×10⁻⁹ m, 509×10⁻¹⁴ Hz, 2×10⁵ ms⁻¹; Refracted light - 5×10⁻⁵ m, 2.09×10¹⁴, 3×10⁸ ms⁻¹", "Reflected light - 1m, 1ms⁻¹; Refracted light - 1m, 2Hz, 3×10⁶ ms⁻¹", "None of the above"], ans: 0, exp: "Given, wavelength of light, λ = 589 nm = 589 × 10⁻⁹ m. Refractive index of water μ_w = 1.33. (i) For reflected light (a) Wavelength of reflected light, λ = 589×10⁻⁹ m. (b) Frequency of reflected light, v = c/λ = (3×10⁸)/(589×10⁻⁹) = 5.09 × 10¹⁴ Hz (c) As the reflection takes place in the same medium so Speed of reflected light c = 3 × 10⁸ ms⁻¹. (ii) For refracted light (In this process wavelength and speed changes but frequency remains the same). Wavelength of refracted light λ' = λ/μ = (589 × 10⁻⁹)/1.33 = 4.42 × 10⁻⁷ m. Therefore, Velocity of refracted li, v = c/μ = (3 × 10⁸)/1.33 = 2.25 × 10⁸ ms⁻¹." },
    { q: "193. In a Young's double slit experiment, the slits are separated by 0.28 mm and screen is placed 1.4 m away. The distance between the central bright fringe and the fourth bright fringe is measured to be 1.2 cm. Determine the wavelength of light used in the experiment.", img: "", opts: ["5 × 10⁻⁷ m", "6 × 10⁻⁷ m", "0.05 × 10⁻⁷ m", "0.06 × 10⁻⁷ m"], ans: 1, exp: "Given, separation between slits d = 0.28 mm = 0.28 × 10⁻³ m. Distance between screen and slit D = 1.4 m. Distance between central bright and fourth fringe x = 1.2 cm = 1.2 × 10⁻² m. Number of fringes n = 4. For constructive interference x = n Dλ/d. 1.2 × 10⁻² = (4 × 1.4 × λ)/(0.28 × 10⁻³). Wavelength, λ = (1.2 × 10⁻² × 0.28 × 10⁻³)/(4 × 1.4) => λ = 6 × 10⁻⁷ m." },
    { q: "194. A beam of light consisting of two wavelengths 650 nm and 520 nm is used to obtain interference fringes in a Young's double slit experiment with slit width = 2 mm and distance of screen = 1.2 m. (i) Find the distance of the third bright fringe on the screen from the central maximum for wavelength 650 nm. (ii) What is the least distance from the central maximum where the bright fringes due to both the wavelength coincide.", img: "", opts: ["1.17 × 10⁻³ m, 1.56 × 10⁻³ m", "2.25 × 10⁻² m, 1.25 m", "0.05 × 10⁻² m, 1.3 × 10⁻⁴ m", "None of the above"], ans: 0, exp: "Given, wavelength λ₁ = 650 nm = 650 × 10⁻⁹ m and λ₂ = 520 nm = 520 × 10⁻⁹ m, d = 2 × 10⁻³ m. (i) For third bright fringe, n = 3, D = 1.2 m. The distance of third bright fringe from central maximum. x = nλD/d = (3 × 650 × 10⁻⁹ × 1.2)/(2 × 10⁻³) = 1.17 × 10⁻³ m. (ii) Let nth bright fringe due to wavelength λ₂ = 520 nm, coincide with (n + 1)th bright fringe due to wavelength λ₁ = 650 nm. i.e., nλ₂D/d = (n - 1)λ₁D/d. n × 520 × 10⁻⁹ = (n - 1)650 × 10⁻⁹ or 4n = 5n - 5 or n = 5. Thus, the least distance, x = nλ₂D/d = 5 × 520 × 10⁻⁹ × 1.2/(2 × 10⁻³) = 1.56 × 10⁻³ m." },

// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
    palette.innerHTML = '';
    for (let i = 0; i < totalQ; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = i + 1;
        btn.id = 'pal-' + i;
        btn.onclick = () => goToQuestion(i);
        palette.appendChild(btn);
    }
}

function updatePalette() {
    for (let i = 0; i < totalQ; i++) {
        const btn = document.getElementById('pal-' + i);
        if (!btn) continue;
        btn.className = 'palette-btn';
        if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
        else if (marked[i]) btn.classList.add('marked');
        else if (userAnswers[i] !== null) btn.classList.add('attempted');
        else if (visited[i]) btn.classList.add('not-answered');
        else btn.classList.add('not-visited');
        if (i === currentQ) btn.classList.add('current');
    }
}

function updateStats() {
    let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
    for (let i = 0; i < totalQ; i++) {
        if (userAnswers[i] !== null) attempted++;
        else if (visited[i]) notAnswered++;
        else notVisited++;
        if (marked[i]) markedCount++;
    }
    document.getElementById('sbTotal').textContent = totalQ;
    document.getElementById('sbAttempted').textContent = attempted;
    document.getElementById('sbNotAnswered').textContent = notAnswered;
    document.getElementById('sbNotVisited').textContent = notVisited;
    document.getElementById('sbMarked').textContent = markedCount;
    document.getElementById('sbCorrect').textContent = correctCount;
    document.getElementById('sbWrong').textContent = wrongCount;
    const marks = correctCount * 1 - wrongCount * 0.25;
    document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
    visited[currentQ] = true;
    const q = questions[currentQ];
    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
        let cls = 'option';
        if (userAnswers[currentQ] !== null) {
            cls += ' disabled';
            if (oi === q.ans) cls += ' correct-ans';
            else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
        }
        optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
    });

    let fbHTML = '';
    if (userAnswers[currentQ] !== null) {
        const isCorrect = userAnswers[currentQ] === q.ans;
        fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
            ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
            ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
        </div>`;
    }

    // Add image if exists
    let imgHTML = '';
    if (q.img) {
        imgHTML = `<img src="${q.img}" class="q-image" alt="Question Diagram" onerror="this.style.display='none'">`;
    }

    questionBox.innerHTML = `
        <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
        ${imgHTML}
        <div>${optsHTML}</div>
        ${fbHTML}
    `;

    document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
    document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
    document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

    updatePalette();
    updateStats();
}

function selectAnswer(optIdx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = optIdx;
    if (optIdx === questions[currentQ].ans) correctCount++;
    else wrongCount++;
    renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
    const marks = correctCount * 1 - wrongCount * 0.25;
    const percent = ((marks / totalQ) * 100).toFixed(2);
    document.getElementById('rTotal').textContent = totalQ;
    document.getElementById('rCorrect').textContent = correctCount;
    document.getElementById('rWrong').textContent = wrongCount;
    document.getElementById('rMarks').textContent = marks.toFixed(2);
    document.getElementById('rPercent').textContent = percent + '%';
    document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
    if (!confirm('Are you sure you want to reset the quiz?')) return;
    for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
    correctCount = 0; wrongCount = 0; currentQ = 0;
    document.getElementById('resultModal').classList.remove('show');
    renderQuestion();
}

renderPalette();
renderQuestion();

// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 57; // ⚠️ Set to 57 as requested

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
<script src="results-save.js"></script>
