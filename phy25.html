    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a202c; line-height: 1.6; padding: 10px; }
        .main-container { display: flex; max-width: 1400px; margin: 0 auto; gap: 15px; height: calc(100vh - 20px); }
        .sidebar { width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 15px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-box { background: #ebf8ff; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; }
        .stat-box .num { font-size: 18px; font-weight: 700; color: #2c5282; }
        .stat-box .lbl { font-size: 11px; color: #4a5568; }
        .stat-box.green { background: #f0fff4; } .stat-box.green .num { color: #22543d; }
        .stat-box.red { background: #fff5f5; } .stat-box.red .num { color: #742a2a; }
        .stat-box.orange { background: #fffaf0; } .stat-box.orange .num { color: #7b341e; }
        .stat-box.purple { background: #faf5ff; } .stat-box.purple .num { color: #44337a; }
        .legend { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; font-size: 11px; justify-content: center; }
        .legend span { display: flex; align-items: center; gap: 3px; }

        .dot.not-visited { background: #e2e8f0; border: 1px solid #a0aec0; }

        .dot.not-answered { background: #e53e3e; }
        .dot.marked { background: #805ad5; }
        .dot.answered-marked { background: #805ad5; border: 2px solid #38a169; }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }

        .palette-btn:hover { transform: scale(1.05); }
        .palette-btn.not-visited { background: #edf2f7; color: #4a5568; }
        .palette-btn.attempted { background: #38a169; color: #fff; border-color: #2f855a; }
        .palette-btn.not-answered { background: #e53e3e; color: #fff; border-color: #c53030; }

        .palette-btn.answered-marked { background: #805ad5; color: #fff; border: 3px solid #38a169; }
        .palette-btn.current { outline: 3px solid #4299e1; outline-offset: 1px; }
        .quiz-area { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .quiz-header h2 { color: #2b6cb0; font-size: 18px; }
        .q-counter { background: #4299e1; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }

        .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
        .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }

        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
        .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
        .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
        .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
        .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
        .result-item .label { font-size: 12px; color: #4a5568; }
        .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
        .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
        .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
        .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
        .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
        .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .q-image { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; border: 1px solid #e2e8f0; }
        @media (max-width: 850px) {
            .main-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
            .sidebar.open { transform: translateY(0); }
            .mobile-palette-toggle { display: block; }
            .quiz-area { min-height: 500px; }
        }
    </style>

<script>
const questions = [
    { q: "1. In geometrical optics, a ray of light is defined as", img: "", opts: ["path of propagation of light", "path of propagation of shadows", "direction of formation of image", "path of propagation of energy for λ → 0"], ans: 3, exp: "In geometrical optics a ray is defined as the path of the energy propagation in the limit of wavelength tending to zero." },
    { q: "2. For a ray of light, which of the following statement holds true?", img: "", opts: ["A ray is defined as the path of energy propagation", "The wavelength for a ray of light in geometrical optics is assumed to be negligible, standing to zero", "A ray of light travels in a straight line", "All of the above"], ans: 3, exp: "A ray is defined as the path of energy propagation in the limit of wavelength tending to zero. It travels in a straight line and defined as the path of energy propagation." },
    { q: "3. Which of the given phenomenon is based on the fact that light waves are transverse electromagnetic waves?", img: "", opts: ["Diffraction", "Interference", "Polarisation", "All of these"], ans: 2, exp: "The phenomenon of polarisation is based on the fact that the light waves are transverse electromagnetic waves. Diffraction and interference can be explained by wave theory of light." },
    { q: "4. Huygens' principle of secondary wavelets may be used to", img: "", opts: ["find the velocity of light in vacuum", "explain the particle's behaviour of light", "find the new position of a wavefront", "explain photoelectric effect"], ans: 2, exp: "Every point on a given wavefront act as a secondary source of light and emits secondary wavelets which travels in all directions with the speed of light in the medium. A surface touching all these secondary wavelets tangentially in the forward direction, gives new wavefront at that instant of time." },
    { q: "5. Which one of the following phenomena is not explained by Huygens' construction of wavefront?", img: "", opts: ["Refraction", "Reflection", "Diffraction", "Origin of spectra"], ans: 3, exp: "Huygens' construction does not explains quantisation of energy and it is not able to explain emission and absorption spectrum." },
    { q: "6. The direction of wavefront of a wave with the wave motion is", img: "", opts: ["parallel", "perpendicular", "opposite", "at an angle of θ"], ans: 1, exp: "Wavefront is a surface perpendicular to a ray but a wavefront moves in the direction of the light." },
    { q: "7. Ray diverging from a point source on a wavefront are", img: "", opts: ["cylindrical", "spherical", "plane", "cubical"], ans: 1, exp: "Wavefronts emitting from a point source are spherical wavefronts." },
    { q: "8. If a source is at infinity, then wavefronts reaching to observer are", img: "", opts: ["cylindrical", "spherical", "plane", "conical"], ans: 2, exp: "Rays reaching from a source at infinity are parallel and when we draw a surface perpendicular to each ray, we get a plane wavefront." },
    { q: "9. In Huygens' wave theory, the locus of all points in the same state of vibration is called", img: "", opts: ["a half period zone", "an oscillator", "a wavefronts", "a ray"], ans: 2, exp: "In Huygens' wave theory, the locus of all points in the same state of vibration is called a wavefront." },
    { q: "10. According to Huygens' principle, each point of the wavefront is the source of", img: "", opts: ["secondary disturbance", "primary disturbance", "third disturbance", "fourth disturbance"], ans: 0, exp: "According to Huygens' principle, each point of the wavefront is the source of a secondary disturbance and the wavelength emanating from these points spread out in all directions with the speed of the wave." },
    { q: "11. If AB is incident wavefront. Then, refracted wavefront is", img: "images/phy25-q11.png", opts: ["Option (a)", "Option (b)", "Option (c)", "Option (d)"], ans: 1, exp: "When ABC wavefront passes through glass, its velocity is reduced. As, points A and C remain in glass for a short duration, they move for a larger distance and B covers a small distance as it remains in glass for a longer duration (middle portion of glass is thick) and finally A'B'C' is position of new wavefront. It is concave in shape." },
    { q: "12. When light is refracted into a denser medium", img: "", opts: ["its wavelength and frequency both increases", "its wavelength increases but frequency remains unchanged", "its wavelength decreases but frequency remains the same", "its wavelength and frequency both decreases"], ans: 2, exp: "Wavelength is dependent on refractive index medium by, λ₁/λ₂ = μ₂/μ₁. So, in denser medium, μ₂ > μ₁ so λ₁ > λ₂ (i.e. wavelength decreases as the light travels from rarer to denser medium) c = vλ." },
    { q: "13. In given figure, light passes from denser medium 1 to rare medium 2. When i > i_c (critical angle of incidence). Then, wavefronts EC is", img: "images/phy25-q13.png", opts: ["formed further deep in medium 2", "formed closer to surface line AC", "formed perpendicular to AC", "formed in medium 1 (on same side of AB)"], ans: 3, exp: "We define an angle i_c by the following equation. sin i_c = v₂/v₁. Thus, if i = i_c, then sin r = 1 and r = 90°. Obviously for i > i_c, there cannot be any refracted wave. The angle i_c is known as the critical angle and for all angles of incidence greater than the critical angle, we will not have any wavefront in medium 2." },
    { q: "14. If a source of light is moving away from a stationary observer, then the frequency of light wave appears to change because of", img: "", opts: ["Doppler's effect", "interference", "diffraction", "None of these"], ans: 0, exp: "According to Doppler's effect, wherever there is relative motion between source and observer, the frequency observed is different from that given out by source." },
    { q: "15. In the context of Doppler effect in light, the term red shift signifies", img: "", opts: ["decrease in frequency", "increase in frequency", "decrease in intensity", "increase in intensity"], ans: 0, exp: "When source moves away from the observer, frequency observed is smaller than that emitted from the source and (as if light emitted is yellow but it will be observed as red) this shift is called red shift." },
    { q: "16. If source and observer are moving towards each other with a velocity, v_radial and c indicates velocity of light, then fractional change in frequency of light due to Doppler's effect will be", img: "", opts: ["Δv/v = v_radial/c", "Δv/v = -v_radial/c", "Δv/v = -c/v_radial", "Δv/v = c/v_radial"], ans: 1, exp: "For small velocities compared to the speed of light. The fractional change in frequency Δv/v is given by -v_radial/c, where, v_radial is the component of the source velocity along the line joining the observer to the source relative to the observer. v_radial is considered positive when the source moves away from the observer. Thus, the Doppler's shift can be expressed as Δv/v = -v_radial/c." },
    { q: "17. The refractive index of glass is 1.5. The speed of light in glass is", img: "", opts: ["3 × 10⁸ ms⁻¹", "2 × 10⁸ ms⁻¹", "1 × 10⁸ ms⁻¹", "4 × 10⁸ ms⁻¹"], ans: 1, exp: "From Snell's law of refraction sin i/sin r = μ₂/μ₁ = v₁/v₂. Given, v₁ = 3 × 10⁸ ms⁻¹. μ₂/μ₁ = ¹μ₂ = 1.5 => v₂ = v₁/¹μ₂ = (3 × 10⁸)/1.5 ms⁻¹. Therefore, Speed of light, v₂ = (3 × 10⁸)/(3/2) = 2 × 10⁸ ms⁻¹." },
    { q: "18. Which of the colours of light travels fastest in prism made up of glass?", img: "", opts: ["Red", "Violet", "Blue", "Speed of light in glass is independent of the colour of light"], ans: 0, exp: "We know from Cauchy's expression, μ(λ) = a + b/λ² + c/λ⁴ + ... or λ_red > λ_blue > λ_violet. μ_red < μ_blue < μ_violet (for glass prism). So, refractive index of prism for violet colour is more hence from Eq. (i), the velocity of violet colour in medium 2(v₂) will be less than the red colour. Red colour light will travel fastest in glass prism." },
    { q: "19. A planet moves with respect to us so that light of 475 nm is observed at 475.6 nm. The speed of the planet is", img: "", opts: ["206 kms⁻¹", "378 kms⁻¹", "108 kms⁻¹", "100 kms⁻¹"], ans: 1, exp: "The relation between v, c and λ is vλ = c. For small changes in v and λ, Δv/v = -Δλ/λ = -v_radial/c. as Δλ = 475.6 - 475.0 = +0.6 nm. or v_radial = c(0.6/475) = 0.6/475 × 3 × 10⁸ = 3.78 × 10⁵ ms⁻¹ = 378 kms⁻¹." },
    { q: "20. The earth is moving towards a fixed star with a velocity of 50 kms⁻¹. An observer on the earth observes a shift of 0.50 Å in the wavelength of light coming from the star. The actual wavelength of light emitted by the star is", img: "", opts: ["3000 Å", "2400 Å", "6000 Å", "5800 Å"], ans: 0, exp: "Using, Δλ = v/c λ. Here, v = 50 kms⁻¹ = 50 × 10³ ms⁻¹. c = 3 × 10⁸ ms⁻¹. Wavelength, Δλ = 0.50 Å. Therefore, Wavelength, λ = c/v Δλ = (3 × 10⁸)/(50 × 10³) × 0.50 = 3000 Å." },
    { q: "21. The wavelength of spectral line coming from a distant star shift from 400 nm to 400.1 nm. The velocity of the star relative to earth is", img: "", opts: ["75 kms⁻¹", "100 kms⁻¹", "50 kms⁻¹", "200 kms⁻¹"], ans: 0, exp: "Here, λ = 400 nm. Δλ = 400.1 nm - 400 nm = 0.1 nm. as v_s/c = Δλ/λ. v_s = Δλ/λ · c = 0.1 nm/400 nm × 3 × 10⁸ ms⁻¹ = 75 × 10³ ms⁻¹ = 75 kms⁻¹." },
    { q: "22. The source of light is moving towards observer with relative velocity of 3 kms⁻¹. The fractional change in frequency of light observed is", img: "", opts: ["3 × 10⁻³", "3 × 10⁻⁵", "10⁻⁵", "None of these"], ans: 2, exp: "Doppler's shift is given by Δv/v = v_radial/c => Δv/v = (3 × 10³)/(3 × 10⁸) = 10⁻⁵." },
    { q: "23. Suppose displacement produced at some point P by a wave is y₁ = a cos ωt and by another wave is y₂ = a cos ωt. Let I₀ represents intensity produced by each one of individual wave, then resultant intensity due to overlapping of both waves is", img: "", opts: ["I₀", "2I₀", "I₀/2", "4I₀"], ans: 3, exp: "The displacement produced by the source S₁ at the point P is given by y₁ = a cos ωt. The displacement produced by the sources S₂ (at the point P) is also given by y₂ = a cos ωt. Thus, the resultant of displacement at P would be given by y = y₁ + y₂ = 2a cos ωt. Since, the intensity is proportional to the square of the amplitude, the resultant intensity will be given by I = 4I₀. where, I₀ represents the intensity produced by each one of the individual waves." },
    { q: "24. Interference can be observed in", img: "", opts: ["only longitudinal waves", "only transverse waves", "only electromagnetic waves", "All of the above"], ans: 3, exp: "Interference is a wave phenomenon. Longitudinal waves like sound, transverse waves like wave on a string or electromagnetic waves like light show interference." },
    { q: "25. Two light waves interfere constructively at a point P. The total phase difference between the two waves at P may be", img: "", opts: ["0", "2π", "4π", "All of these"], ans: 3, exp: "For constructive interference, Phase difference (Δφ) = 2nπ (even multiple of π). For n = 0, Δφ = 0. For n = 1, Δφ = 2π. For n = 2, Δφ = 4π and so on." },
    { q: "26. Two waves interfere at point P having path difference 1.5λ between them. The interference is", img: "", opts: ["constructive", "destructive", "no interference pattern", "None of the above"], ans: 1, exp: "Given, path difference (Δx) = 1.5λ = 3λ/2. Phase difference (Δφ) and path difference (Δx) are related by the relation, Δφ = 2π/λ × Δx => Δφ = 2π/λ × 3λ/2 = 3π. => Δφ = odd multiple of π. So, destructive interference occurs." },
    { q: "27. Two coherent point sources S₁ and S₂ vibrating in phase emit light of wavelength λ. The separation between the sources is 2λ. The smallest distance from S₂ on a line passing through S₂ and perpendicular to S₁S₂, where minimum of intensity occurs, is", img: "images/phy25-q27.png", opts: ["7λ/12", "15λ/4", "λ/2", "3λ/2"], ans: 0, exp: "Given, separation between sources S₁ and S₂ = 2λ. For minimum intensity at P, destructive interference must take place at P. So, S₁P - S₂P = Δx (path difference) = (2n + 1)λ/2 (for destructive interference). For minimum distance, S₁P - S₂P = 3λ/2 ≠ λ/2 ...(i). => √(x² + (2λ)²) - x = 3λ/2 => x² + (2λ)² = [x + (3λ/2)]² => x² + 4λ² = x² + 9λ²/4 + 2x·3λ/2 => x·3λ = 4λ² - 9λ²/4 = 7λ²/4 => x = 7λ/12. Note If we proceed with Eq. (i) taking S₁P - S₂P = λ/2, x = 15λ/4 which is more than 7λ/12." },
    { q: "28. Two identical coherent sources placed on a diameter of a circle of radius R at separation x (<< R) symmetrically about the centre of the circle. The sources of points on the circle with maximum intensity is (x = 5λ).", img: "images/phy25-q28.png", opts: ["20", "22", "24", "26"], ans: 0, exp: "From the figure, path difference = S₁M = P. P = S₁M = x cos θ (∵ x << R) (S₁P and S₂P are assumed approximately parallel). For maximum intensity, P = nλ (where, n = 0, 1, 2, 3) => x cos θ = nλ => cos θ = nλ/x => cos θ = nλ/5λ (∵ x = 5λ) => cos θ = n/5. We know, -1 ≤ cos θ ≤ 1 => -1 ≤ n/5 ≤ 1 => -5 ≤ n ≤ 5. Possible values of n = {0, ±1, ±2, ±3, ±4, ±5}. Let us analysis each value of n for θ in range. θ ∈ (0, 2π). For n = 1, cos θ = 1/5. Here, negative value of n means the path difference (S₁P - S₂P) is negative, i.e., for those points S₁P < S₂P. For n = 0, ±1, ±2, ±3, ±4. From the given graph of cosine function, it can be observed that in interval θ ∈ [0, 2π], for above values of n there are in total 18 points, i.e., 2 points for n = 0, 4 points each for n = ±1, ±2, ±3, ±4. For n = +5, cos θ = +1. One value of θ i.e., θ = 0° is possible as for θ = 2π, the points will coincide. For n = -5, cos θ = -1, i.e., θ = π. Thus, in total 20 points of maxima's are possible in all 4 quadrants." },
    { q: "29. Two sources S₁ and S₂ emitting light of wavelength 600 nm are placed at a distance 1.0 × 10⁻² cm apart. A detector can be moved on the line S₁P which is perpendicular to S₁S₂. The position of the farthest minimum detected is approximately", img: "images/phy25-q29.png", opts: ["1.5 m", "1.0 m", "1.07 m", "1.03 m"], ans: 2, exp: "The position of farthest minimum detection occurs when the path difference is least and odd multiple of λ/2, i.e., condition for destructive interference and approaches zero as P moves to infinity. So, if S₂P = D. S₁P - S₂P = (2n + 1)λ/2 for destructive interference. (n = 0, 1, 2, ...). For farthest distance so S₁P - S₂P = λ/2 => √(D² + d²) - D = λ/2 => D² + d² = (D + λ/2)² => d² = Dλ + λ²/4 => D = d²/λ - λ/4 = ((1.0 × 10⁻⁴ m)²)/(600 × 10⁻⁹ m) - 150 × 10⁻⁹ m = 107 cm => D = 1.07 m." },
    { q: "30. The phase difference between the two light waves reaching at a point P is 100π. Their path difference is equal to", img: "", opts: ["10λ", "25λ", "50λ", "100λ"], ans: 2, exp: "Given, Δφ = 100π. We know, change in phase difference, i.e., Δφ = 2π/λ × Δx where, Δx = path difference. => Δx = Δφ × λ/2π = 100π × λ/2π = 50λ." },
    { q: "31. In the phenomenon of interference, energy is", img: "", opts: ["destroyed at destructive interference", "created at constructive interference", "conserved but it is redistributed", "same at all points"], ans: 2, exp: "In the phenomenon of interference, energy is conserved but it is redistributed." },
    { q: "32. Two distinct light bulbs as sources", img: "", opts: ["can produce an interference pattern", "cannot produce a sustained interference pattern", "can produce an interference pattern, if they produce light of same frequency", "can produce an interference pattern only when the light produced by them is monochromatic in nature"], ans: 1, exp: "As two distinct sources are incoherent, so phase changes are random, so no fixed pattern of maxima or minima." },
    { q: "33. Two light waves superimposing at the mid-point of the screen are coming from coherent sources of light with phase difference π rad. Their amplitudes are 2 cm each. The resultant amplitude at the given point will be", img: "", opts: ["8 cm", "2 cm", "4 cm", "zero"], ans: 3, exp: "Resultant amplitude A = √(A₁² + A₂² + 2A₁A₂ cos φ). Here A₁ = A₂ = 2 cm => φ = π rad. A = √((2)² + (2)² + 2 × 2 × 2 × cos π) = A = √(4 + 4 - 8) or A = 0." },
    { q: "34. If two waves of equal intensities I₁ = I₂ = I₀, meets at two locations P and Q with path difference Δ₁ and Δ₂ respectively, then the ratio of resultant intensity at points P and Q, (I_P/I_Q) will be", img: "", opts: ["cos²(Δ₁/λ) / cos²(Δ₂/λ)", "cos² Δ₁ / cos² Δ₂", "cos²(πΔ₁/λ) / cos²(πΔ₂/λ)", "Δ₁/Δ₂"], ans: 2, exp: "Resultant intensity is given by I = 4I₀ cos² φ/2. Now, phase difference (φ) = 2π/λ × Δ (path difference). As a path difference of one wavelength corresponds to a phase difference of 2π radius. => I = 4I₀ cos²(2πΔ/2λ) = 4I₀ cos²(πΔ/λ). Therefore, I_P/I_Q = cos²(πΔ₁/λ) / cos²(πΔ₂/λ)." },
    { q: "35. The ratio of maximum and minimum intensities of two sources is 4 : 1. The ratio of their amplitudes is", img: "", opts: ["1 : 81", "3 : 1", "1 : 9", "1 : 16"], ans: 1, exp: "Given, I_max/I_min = 4/1. We know, I_max/I_min = (r + 1)²/(r - 1)² = 4/1 => (r + 1)/(r - 1) = 2/1 => r + 1 = 2r - 2 or r = 3. Therefore, the ratio of amplitudes A₁/A₂ = r = 3." },
    { q: "36. When two coherent monochromatic beams of intensity I and 9I interference, the possible maximum and minimum intensities of the resulting beam are", img: "", opts: ["9I and I", "9I and 4I", "16I and 4I", "16 I and I"], ans: 2, exp: "Given, I₁ = I and I₂ = 9I. => I₁/I₂ = I/9I = 1/9 => r = A₁/A₂ = √(I₁/I₂) = √(1/9) = 1/3. I_max/I_min = ((r + 1)/(r - 1))² = ((1/3 + 1)/(1/3 - 1))² = 16/4 = 4." },
    { q: "37. Two slits in Young's double slit experiments have width in ratio 1 : 25. The ratio of intensity at the maxima and minima in the interference pattern I_max/I_min is", img: "", opts: ["9/4", "121/49", "49/121", "4/9"], ans: 0, exp: "Given, Young's double slit experiment, having two slits of width in the ratio of 1 : 25. So, ratio of intensity, I₁/I₂ = W₁/W₂ = 1/25 => I₂/I₁ = 25/1. Therefore, I_max/I_min = (√I₁ + √I₂)²/(√I₁ - √I₂)² = (√(I₂/I₁) + 1)²/(√(I₂/I₁) - 1)² => [5 + 1]²/[5 - 1]² = (6)²/(4)² = 36/16 = 9/4. Thus, I_max/I_min = 9/4." },
    { q: "38. Two coherent light sources of intensity ratio n are employed in an interference experiment. The ratio of the intensities of maxima and minima is", img: "", opts: ["(n + 1)/(n - 1)", "((n + 1)/(n - 1))²", "(√n + 1)/(√n - 1)", "(√(n + 1)/(√n - 1))²"], ans: 3, exp: "Given, I₁/I₂ = n => r = √(I₁/I₂) = √n. I_max/I_min = ((r + 1)/(r - 1))² = ((√n + 1)/(√n - 1))²." },
    { q: "39. Light from two coherent sources of the same amplitude A and wavelength λ interference. The maximum intensity recorded is I₀. If the sources were incoherent, the intensity at the same point will be", img: "", opts: ["4I₀", "2I₀", "I₀", "I₀/2"], ans: 3, exp: "We know, I_max = (√I₁ + √I₂)² = 4I₀' (if I₁ = I₂ = I₀'). Here, 4I₀' = I₀ => I₀' = I₀/4. For incoherent source, the interference has uniform intensity throughout given by I = I₁ + I₂. or I = 2I₀' = 2 × I₀/4 = I₀/2." },
    { q: "40. If two incoherent sources each of intensity I₀ produce wave which overlaps at some common point, then resultant intensity obtained is", img: "", opts: ["4I₀", "2I₀", "I₀/2", "dependent on phase difference"], ans: 1, exp: "When the sources are incoherent there is no interference and resultant intensity is I₁ + I₂. For sources of same intensity I₀, resultant intensity will be 2I₀." },
    { q: "41. Two identical and independent sodium lamps act as", img: "", opts: ["coherent sources", "incoherent sources", "Either (a) and (b)", "None of these"], ans: 1, exp: "Two identical and independent sodium lamps (i.e., two independent sources of light) can never be coherent. Hence, no coherence between the light emitted by different atoms." },
    { q: "42. In an experiment with two coherent sources, the amplitude of the intensity variation is found to be 5% of the average intensity. The relative intensities of the light waves of interfering sources will be", img: "", opts: ["1600:1", "900:1", "40:1", "400:1"], ans: 0, exp: "Let the average intensity be I_av. The amplitude of intensity variation means I = I_av ± 0.05 I_av. => I_max = I_av(1 + 0.05) = 1.05 I_av. I_min = I_av(1 - 0.05) = 0.95 I_av. So, I_max/I_min = 1.05/0.95 = 105/95 => ((r + 1)/(r - 1))² = 105/95 => (r² + 1 + 2r)/95 = 105(r² + 1 - 2r) => 10r² + 10 - 200·2r = 0 => 10r² - 400r + 10 = 0 => r² - 40r + 1 = 0 => r = (40 ± √(40² - 4 × 1 × 1))/2 => r = (40 + 40)/2 = 40. Therefore, I₁/I₂ = r² = (40)² = 1600/1 or I₁ : I₂ = 1600 : 1." },
    { q: "43. In Young's double slit experiment, if source S is shifted by an angle φ as shown in figure. Then, central-bright fringe will be shifted by angle φ towards", img: "images/phy25-q43.png", opts: ["end A of screen", "end B of screen", "(c) does not shift at all", "(d) Either end A and B depending on extra phase difference caused by shifting of source"], ans: 1, exp: "Consider that the source is moved to some new point S' and suppose that Q is the mid-point of S₁ and S₂. If the angle S'QS is φ, then the central bright fringe occurs at an angle -φ, on the other side. Thus, if the source S is on the perpendicular bisector, then the central fringe occurs at O, also on the perpendicular bisector. If S is shifted by an angle φ to point S', then the central fringe appears at a point O' at an angle -φ, which means that it is shifted by the same angle on the other side of the bisector. This also means that the source S', the mid-point Q and the point O' of the central fringe are in a straight line." },
    { q: "44. White light may be considered to be mixture of wave with wavelength ranging between 3000 Å and 7800 Å. An oil film of thickness 10000 Å is examined normally by the reflected light. If μ = 1.4, then the film appears bright for", img: "", opts: ["4308 Å, 5091 Å, 6222 Å", "4000 Å, 5091 Å, 5600 Å", "4667 Å, 6222 Å, 7000 Å", "4000 Å, 4667 Å, 5600 Å, 7000 Å"], ans: 0, exp: "The film appears bright if the path difference is 2μt = (2n - 1)λ/2, where, n = 1, 2, 3, ... Therefore, λ = 4μt/(2n - 1) = (4 × 1.4 × 10000 × 10⁻¹⁰)/(2n - 1) = 56000/(2n - 1) Å. Therefore, λ = 56000 Å, 18666 Å, 11200 Å, 8000 Å, 6222 Å, 5091 Å, 4308 Å, 3733 Å. The wavelengths which are not within specified ranges produce minima." },
    { q: "45. The figure shows a Young's double-slit experiment where, P and Q are the slits. The path lengths PX and QX are nλ and (n + 2)λ respectively, where n is a whole number and λ is the wavelength. Taking, path difference at the central fringe as zero, what is formed at X?", img: "images/phy25-q45.png", opts: ["First bright", "First dark", "Second bright", "Second dark"], ans: 2, exp: "Path difference = QX - PX = (n + 2)λ - nλ = 2λ ...(i). For constructive interference or bright band, Path difference = Δx = nλ (where, n = 1, 2, ...). From Eq. (i), it is obvious that second bright band is formed as n = 2." },
    { q: "46. In Young's double slit experiment, a glass plate is placed before a slit which absorbs half the intensity of light. Under this case", img: "", opts: ["the brightness of fringes decreases", "the fringe width decreases", "no fringes will be observed", "the bright fringes become fainter and the dark fringes have finite light intensity"], ans: 3, exp: "We know, Intensity of bright band, I_max = (√I₁ + √I₂)² ...(i). Intensity of dark band, I_min = (√I₁ - √I₂)² ...(ii). Case I When there is no glass slab => I₁ = I₂ = I₀ or I_max = 4I₀ (Complete brightness) and I_min = 0 (Complete darkness). Case II When glass slab is inserted, => I₁ < I₂ or I₁ = I₀/2 and I₂ = I₀ (given). or I_max < 4I₀ [from Eq. (i)] and I_min > 0 [from Eq. (ii)]. Hence, the bright band becomes less bright and dark band becomes less dark." },
    { q: "47. In Young's double slit experiment, intensity at a point is (1/4)th of the maximum intensity. Angular position of this point is", img: "", opts: ["sin⁻¹(λ/d)", "sin⁻¹(λ/2d)", "sin⁻¹(λ/3d)", "sin⁻¹(λ/4d)"], ans: 2, exp: "Using relation, I = I_max cos²(Δφ/2) where, Δφ = total phase difference. Given, I = I_max/4 at certain point => I_max/4 = I_max cos²(Δφ/2) or 1/4 = cos²(Δφ/2) => cos(Δφ/2) = cos(π/3) or Δφ = (2π/3). Path difference, Δx = λ/2π × Δφ = λ/2π × 2π/3 = λ/3 ...(i). For Young's double slit experiment we know, path difference = d sin θ ...(ii). Using Eqs. (i) and (ii), we get λ/3 = d sin θ => sin θ = λ/3d => θ = sin⁻¹(λ/3d)." },
    { q: "48. The Young's double slit experiment is done in a medium of refractive index 4/3. A light of 600 nm wavelength is falling on the slits having 0.45 mm separation. The lower slit S₂ is covered by a thin glass sheet of thickness 10.4 μm and refractive index 1.5. The interference pattern is observed on a screen placed 1.5 m from the slits as shown in the figure. The location of the central bright fringes on the Y-axis is", img: "images/phy25-q48.png", opts: ["4.0 mm", "4.33 mm", "5 mm", "4.5 mm"], ans: 1, exp: "Shift produced due to insertion of slab Δx = t(μ_g/μ_m - 1)D/d = 10.4 × 10⁻⁶ × (1.5/(4/3) - 1) × 1.5/(0.45 × 10⁻³) = 4.33 mm. Thus, the central maximum is obtained at a distance 4.33 mm below point O on the screen as the slab is placed in the path of lower slit." },
    { q: "49. With reference of the above question, if 600 nm light is replaced by white light of range 400 nm to 700 nm, the wavelength of the light that form maxima exactly at point O are", img: "images/phy25-q49.png", opts: ["650 nm and 400 nm", "650 nm and 433.33 nm", "400 nm and 667 nm", "650 nm and 667 nm"], ans: 1, exp: "At O, path difference, P = (μ_g/μ_m - 1)t. For maximum intensity at O P = nλ (n = 1, 2, 3, ...). Therefore, λ = [P/n]. or λ = (μ_g/μ_m - 1)t/n = (1.5/(4/3) - 1) × 10.4 × 10³ nm/n. λ = 1300 nm/n. For n = 1, λ = 1300 nm. For n = 2, λ = 650 nm. For n = 3, λ = 433.33 nm. Thus, the wavelength in the range 400 to 700 nm are 650 nm and 433.33 nm." },
    { q: "50. A parallel beam of sodium light of wavelength 6000 Å is incident on a thin glass plate of refractive index 1.5 such that the angle of refraction in the plate is 60°. The smallest thickness of the plate which will make it dark by reflection.", img: "", opts: ["4000 Å", "4200 Å", "1390 Å", "2220 Å"], ans: 0, exp: "The condition for minimum thickness corresponding to a dark band in reflection 2μt cos r = λ. Therefore, t = λ/2μ cos r = (6000 × 10⁻¹⁰)/(2 × 1.5 × cos 60°) = 4000 Å." },
    { q: "51. In Young's double slit experiment two disturbance arriving at a point P have phase difference of π/2. The intensity of this point expressed as a fraction of maximum intensity I₀ is", img: "", opts: ["3/2 I₀", "1/2 I₀", "4 I₀", "3/4 I₀"], ans: 1, exp: "The resultant intensity I = I₀ cos²(φ/2). Here, I₀ is the maximum intensity and φ = π/2. I = I₀ cos²(π/(2 × 2)) = I₀ cos²(π/4). I = I₀/2." },
    { q: "52. Two monochromatic light wave of same amplitudes of 2A interfering at a point have a phase difference of 60°. The intensity at that point will be proportional to", img: "", opts: ["5A²", "12A²", "7A²", "19A²"], ans: 1, exp: "Here, A₁ = 2A, A₂ = 2A, φ = 60°. R = √(A₁² + A₂² + 2A₁A₂ cos φ) = √((2A)² + (2A)² + 2 × 2A × 2A × cos 60°) = A√12. as intensity ∝ (Amplitude)². Therefore, I ∝ 12A²." },
    { q: "53. The shape of the fringe obtained on the screen in case of Young's double slit experiment is", img: "", opts: ["a straight line", "a parabola", "a hyperbola", "a circle"], ans: 2, exp: "The shape of the fringe obtained on the screen in case of Young's double slit experiment is a hyperbola." },
    { q: "54. In Young's double slit experiment, distance between slits in kept 1 mm and a screen is kept 1 m apart from slits. If wavelength of light used is 500 nm, then fringe spacing is", img: "", opts: ["0.5 mm", "0.5 cm", "0.25 mm", "0.25 cm"], ans: 0, exp: "Fringe spacing β = Dλ/d = (1 × 5 × 10⁻⁷)/(1 × 10⁻³) m (1 nm = 10⁻⁹ m) = 5 × 10⁻⁴ m = 0.5 mm." },
    { q: "55. If the 8th bright band due to light of wavelength λ₁ coincides with 9th bright band from light of wavelength λ₂ in Young's double slit experiment, then the possible wavelengths of visible light are", img: "", opts: ["400 nm and 450 nm", "425 nm and 400 nm", "400 nm and 425 nm", "450 nm and 400 nm"], ans: 3, exp: "Position of nth bright fringe from central maxima is nλD/d. Therefore, 8λ₁D/d = 9λ₂D/d => λ₁/λ₂ = 9/8. Hence, the possible wavelengths of visible light is of the ratio of 9 : 8." },
    { q: "56. The Young's double slit experiment is performed with light of wavelength 6000 Å, where in 16 fringes occupy a certain region on the screen. If 24 fringes occupy the same region with another light, of wavelength λ, then λ is", img: "", opts: ["6000 Å", "4500 Å", "5000 Å", "4000 Å"], ans: 3, exp: "Given, λ₁ = 6000 Å, n₁ = 16 fringes and n₂ = 24 fringes. Position of nth fringe, nλD/d => n₁λ₁ = n₂λ₂ => λ₁/λ₂ = n₂/n₁ => 6000/λ₂ = 24/16 => λ₂ = 6000 × 16/24 = 96000/24 = 4000 Å." },
    { q: "57. The maximum intensity of fringes in Young's double slit experiment is I. If one of the slit is closed, then the intensity at that place becomes I₀. Which of the following relations is correct?", img: "", opts: ["I = I₀", "I = 2I₀", "I = 4I₀", "There is no relation between I and I₀"], ans: 2, exp: "Suppose slit width are equal, so they produces wave of equal intensity say I'. Resultant intensity at any point I_R = 4I' cos² φ, where φ is the phase difference between the waves at the point of observation. For maximum intensity. φ = 0 => I_max = 4I' = I ...(i). Also, when one slit is closed I' = I₀ ...(ii). From Eqs. (i) and (ii), we get 4I₀ = I." },
    { q: "58. Young's double slit experiment is performed with sodium (Yellow) light of wavelength 589.3 nm and the interference pattern is observed on a screen 100 cm away. The 10th bright fringe has its centre at a distance of 12 nm from the central maximum. The separation between the slits is", img: "", opts: ["0.49 mm", "0.6 mm", "0.7 mm", "0.53 mm"], ans: 0, exp: "Position of 10th bright fringe = 10λD/d. Also, 10λD/d = 12. => d = 10λD/12. The separation between the slits = (10 × 589.3 × 10⁻⁹ × 1)/(12 × 10⁻³) = 4.9 × 10⁻⁴ m = 0.49 mm." },
    { q: "59. If Young's double slit experiment, is performed in water, the fringe width recorded is ω₂. If it is performed in air, the fringe width recorded is ω₁. Then, ω₁/ω₂ is (μ_water = 4/3)", img: "", opts: ["3/2", "3/4", "4/3", "Data insufficient"], ans: 2, exp: "μ = λ_air/λ_water. Using Eq. (iii), we get ω₁/ω₂ = μ_water/μ_air = 4/3." },
    { q: "60. In a Young's double slit experiment, the slit separation is 1mm and the screen is 1m from the slit. For a monochromatic light of wavelength 500 nm, the distance of 3rd minima from the central maxima is", img: "", opts: ["0.50 mm", "1.25 mm", "1.50 mm", "1.75 mm"], ans: 1, exp: "Here, λ = 500 nm, d = 1 mm, D = 1 m. Distance of 3rd minima i.e., x_n = (n + 1/2)λD/d. x₃ = (2 + 1/2)λD/d => x = 5λD/2d = (5 × 500 × 10⁻⁹ × 1)/(2 × 1 × 10⁻³) = 12.5 × 10⁻⁴ m = 1.25 mm." },
    { q: "61. In Young's double slit experiment the two slits are d distance apart. Interference pattern is observed on a screen at a distance D from the slits. A dark fringe is observed on the screen directly opposite to one of the slit. The wavelength of light is", img: "images/phy25-q61.png", opts: ["D²/2d", "d²/2D", "D²/d", "d²/D"], ans: 3, exp: "Since, dark fringe is directly opposite to one of the slits, Therefore, distance of the dark fringe from central maxima = d/2. Position of nth dark fringe = λD/2d (2n - 1). or d/2 = (2n - 1)λD/2d => λ = d²/D(2n - 1). For n = 1, λ = d²/D." },
    { q: "62. The Young's double slit experiment is performed with blue and with green light of wavelengths 4360 Å and 5460 Å, respectively. If x is the distance of 4th maximum from the central one, then", img: "", opts: ["x(blue) = x(green)", "x(blue) > x(green)", "x(blue) < x(green)", "x(blue)/x(green) = 5460/4360"], ans: 2, exp: "Position of nth maximum from central maxima = nλD/d => x_n ∝ λ. So, x(blue) < x(green) as λ_blue < λ_green." },
    { q: "63. In a Young's double slit experiment, two coherent sources are placed 0.90 nm apart and the fringes are observed 1 m away. If it produces the second dark fringe at a distance of 1mm from the central fringe, the wavelength of monochromatic light used would be", img: "", opts: ["60 × 10⁻⁴ cm", "10 × 10⁻⁴ cm", "10 × 10⁻⁵ cm", "6 × 10⁻⁵ cm"], ans: 3, exp: "Given, d = 0.90 mm = 0.90 × 10⁻³, D = 1 m. Position of 2nd dark fringe from central fringe = 3λD/2d = 1 × 10⁻³ m. => 1 × 10⁻³ = (3 × λ × 1)/(2 × 0.90 × 10⁻³). Therefore, λ = (1.8 × 10⁻⁶)/3 = 0.6 × 10⁻⁶ m = 6 × 10⁻⁵ cm." },
    { q: "64. In Young's double slit experiment, the slits are 2 mm apart and are illuminated by photons of two wavelengths λ₁ = 12000 Å and λ₂ = 10000 Å. At what minimum distance from the common central bright fringe on the screen 2 m from the slit will a bright fringe from one interference pattern coincide with a bright fringe from the other?", img: "", opts: ["8 mm", "6 mm", "4 mm", "3 mm"], ans: 1, exp: "Given, λ₁ = 12000 Å and λ₂ = 10000 Å, D = 2 cm and d = 2 mm = 2 × 10⁻³ cm. We have λ₁/λ₂ = 12000/10000 = 6/5 = n₂/n₁. as x = n₁λ₁D/d = (5 × 12000 × 10⁻¹⁰ × 2)/(2 × 10⁻³) = 5 × 1.2 × 10⁻⁴ × 10⁻¹⁰ × 10³ = 6 mm." },
    { q: "65. In a two slit experiment with monochromatic light fringes are obtained on a screen placed at some distance from the slits. If the screen is moved by 5 × 10⁻² m towards the slits, the change in fringe width is 3 × 10⁻⁵ m. If separation between the slits is 10⁻³ m, the wavelength light used is", img: "", opts: ["6000 Å", "5000 Å", "3000 Å", "4500 Å"], ans: 0, exp: "The fringe width i.e., β₁ = λD₁/d and β₂ = λD₂/d. So, β₁ - β₂ = λ/d (D₁ - D₂) => 3 × 10⁻⁵ = λ/10⁻³ (5 × 10⁻²) (∵ D₁ - D₂ = 5 × 10⁻² m). => λ = 3/5 × 10⁻⁸ = 0.6 × 10⁻⁶ m = 6000 Å." },
    { q: "66. In Young's double slit experiment, the distance between two slits is 0.1 mm and these are illuminated with light of wavelength 5460 Å. The angular positions of first dark fringe on the screen distant 20 cm from slits will be", img: "images/phy25-q66.png", opts: ["0.8°", "0.6°", "0.4°", "0.16°"], ans: 3, exp: "Angular position of first dark fringe = tan θ ≈ θ = x/D => θ = λ/2d = (5460 × 10⁻¹⁰)/(0.1 × 10⁻³) = 54600 × 10⁻⁷ rad (∵ x = λD/2d). As, we know, θ (in degree) = 180/π × 546 × 10⁻⁵ = 180/22 × 7 × 546 × 10⁻⁵ = 0.32/2 = 0.16°." },
    { q: "67. In Young's double slit experiment the fringe width is 1 × 10⁻⁴ m. If the distance between the slit and screen is double and distance between the two slit is reduced to half and wavelength is changed from 6.4 × 10⁻⁷ m to 4.0 × 10⁻⁷ m, the value of new fringe width will be", img: "", opts: ["0.15 × 10⁻⁴ m", "2.0 × 10⁻⁴ m", "1.25 × 10⁻⁴ m", "2.5 × 10⁻⁴ m"], ans: 3, exp: "β = λD/d. Therefore, β₂/β₁ = (λ₂ D₂ d₁)/(λ₁ D₁ d₂) => β₂ = β₁ × λ₂ × 2D₁ × d₁ / (λ₁ × D₁ × d₁/2) => β₂ = β × λ₂/λ₁ × 4 => β₂ = 2.5 × 10⁻⁴ m." },
    { q: "68. Consider a two slits interference arrangements (figure) such that the distance of the screen from the slits is half the distance between the slits. Obtain the value of D in terms of λ such that the first minima on the screen falls at a distance D from the centre O.", img: "images/phy25-q68.png", opts: ["0.358 λ", "0.404 λ", "0.725 λ", "0.80 λ"], ans: 1, exp: "Resultant intensity, I_R = I₁ + I₂ + 2√(I₁I₂) cos Δφ. Case I (at A) Δφ = π/2. I_R₁ = I₁ + I₂ = I + 4I = 5I. Case II (at B) Δφ = π. I_R₂ = I₁ + I₂ - 2√(I₁I₂) = 5I - 2 × 2I = I. Therefore, I_R₁ - I_R₂ = 5I - I = 4I." },
    { q: "69. Four identical monochromatic sources A, B, C, D as shown in the figure, produce waves of the same wavelength λ and are coherent. Two receiver R₁ and R₂ are at great but equal distances from B.", img: "images/phy25-q69.png", opts: ["R₁", "R₂", "R₁ and R₂", "None of these"], ans: 0, exp: "So, distance between two slits i.e., S₁ and S₂ d = (2 tan θ/2)D. For small angles θ, tan θ ≈ θ. => d = 2 × θ/2 × D = Dθ or D/d = 1/θ. Fringe width, β = λD/d = λ/θ." },
    { q: "70. [Passage: Answer the following questions based on the given passage. A point source emits wave diverging in all directions.] The length of segment = constant => n₁ω₁ = n₂ω₂ => n₁λ₁ = n₂λ₂. or n₂ = n₁ λ₁/λ₂ = 12 × 600/400 = 18." },
    { q: "71. In liquid position of 10th bright fringe, x_n = nλ_lD/d => x = 10λ_lD/d. where, λ_l = wavelength in liquid. Therefore, Position of dark fringe = (2n - 1)λD/2d ...(i). In vacuum position of 6th dark fringe = 11λ_airD/2d [put n = 6 in Eq. (i)]. Since, 10th bright fringe in liquid is located at 6th dark fringe in air, 10λ_lD/d = 11λ_airD/2d => λ_l/λ_air = 5.5/10. Also, λ_l/λ_air = μ_l/μ_l => 1/μ_l = 5.5/10 or μ_l = 10/5.5 = 20/11 = 1.8." },
    { q: "72. Yellow light is used in a single-slit diffraction experiment with slit width of 0.6 mm. If yellow light is replaced by X-rays, then the observed pattern will reveal", img: "", opts: ["that the central maximum is narrower", "more number of fringes", "less number of fringes", "no diffraction pattern"], ans: 1, exp: "I = I_max cos² φ/2 ...(i). Given, I = I_max/2 ...(ii). Therefore, From Eqs. (i) and (ii), we have, φ = π/2, 3π/2, 5π/2. Or path difference, Δx = (λ/2π)φ = λ/4, 3λ/4, 5λ/4 ...((2n + 1)/4)λ, n = 0, 1, 2, ..." },
    { q: "73. Fringe width i.e., β = λD/d = (600 × 10⁻⁹ × 2)/(2 × 10⁻³) = 6 × 10⁻⁴ m. Using, I = I_max cos² πx/β => I = 0.20 cos² (π × 0.5 × 10⁻² / (6 × 10⁻⁴)) => I = 0.20 cos² (100π/12) = 0.20 cos² 25π/3. or I = 0.20 cos²(8π + π/3) => I = 0.20 cos² π/3 = 0.20 × 1/4 = 0.05 Wm⁻²." },
    { q: "74. As we know, fringe width β₁ = λD/d. β₂ = λ(2D/2d) = λD/d. => β₁ = β₂." },
    { q: "75. Two sources S₁ and S₂ of intensity I₁ and I₂ are placed infront of a screen Fig. (a). The pattern of intensity distribution seen in the central portion is given by Fig. (b).", img: "images/phy25-q75.png", opts: ["S₁ and S₂ have the same intensities", "S₁ and S₂ have a constant phase difference", "S₁ and S₂ have the same phase", "S₁ and S₂ have the same wavelength"], ans: 0, exp: "Consider the pattern of the intensity shown in the figure of question. (i) As intensities of all successive minima is zero, hence we can say that two sources S₁ and S₂ are having same intensities." },
    { q: "76. Consider the sunlight incident on a pinhole of width 10³ Å. The image of the pinhole seen on a screen shall be", img: "", opts: ["a sharp white ring", "different from a geometrical image", "a diffused central spot, white in colour", "a diffused coloured region around a sharp central white spot"], ans: 1, exp: "Given, width of pinhole = 10³ Å = 1000 Å. We know that wavelength of sunlight ranges from 4000 Å to 8000 Å. Clearly, wavelength λ < width of the slit. Hence, light is diffracted from the hole. Due to diffraction from the sunlight the image formed on the screen will be different from the geometrical image and overlapping of colour v." },
    { q: "77. For light from a point source,", img: "", opts: ["the wavefront is spherical", "the intensity decreases in proportion to the distance squared", "the wavefront is parabolic", "the intensity at the wavefront does not depend on the distance"], ans: 0, exp: "Consider the diagram in which light diverges from a point source (O). Due to the point source light propagates in all directions symmetrically and hence, wavefront will be spherical as shown in the diagram. If power of the source is P, then intensity of the source will be I = P/4πr² where, r is radius of the wavefront at any time." },
    { q: "78. Monochromatic light of wavelength 589 nm is incident from air on a water surface. What are the wavelength, frequency and speed of (i) reflected and (ii) refracted light? (Refractive index of water is 1.33).", img: "", opts: ["Reflected light - 589×10⁻⁹ m, 5.09×10¹⁴ Hz, 3×10⁸ ms⁻¹; Refracted light - 4.42×10⁻⁷ m, 5.09×10¹⁴ Hz, 2.25×10⁸ ms⁻¹", "Reflected light - 475×10⁻⁹ m, 509×10⁻¹⁴ Hz, 2×10⁵ ms⁻¹; Refracted light - 5×10⁻⁵ m, 2.09×10¹⁴, 3×10⁸ ms⁻¹", "Reflected light - 1m, 1ms⁻¹; Refracted light - 1m, 2Hz, 3×10⁶ ms⁻¹", "None of the above"], ans: 0, exp: "Given, wavelength of light, λ = 589 nm = 589 × 10⁻⁹ m. Refractive index of water μ_w = 1.33. (i) For reflected light (a) Wavelength of reflected light, λ = 589×10⁻⁹ m. (b) Frequency of reflected light, v = c/λ = (3×10⁸)/(589×10⁻⁹) = 5.09 × 10¹⁴ Hz (c) As the reflection takes place in the same medium so Speed of reflected light c = 3 × 10⁸ ms⁻¹. (ii) For refracted light (In this process wavelength and speed changes but frequency remains the same). Wavelength of refracted light λ' = λ/μ = (589 × 10⁻⁹)/1.33 = 4.42 × 10⁻⁷ m. Therefore, Velocity of refracted li, v = c/μ = (3 × 10⁸)/1.33 = 2.25 × 10⁸ ms⁻¹." },
    { q: "79. In a Young's double slit experiment, the slits are separated by 0.28 mm and screen is placed 1.4 m away. The distance between the central bright fringe and the fourth bright fringe is measured to be 1.2 cm. Determine the wavelength of light used in the experiment.", img: "", opts: ["5 × 10⁻⁷ m", "6 × 10⁻⁷ m", "0.05 × 10⁻⁷ m", "0.06 × 10⁻⁷ m"], ans: 1, exp: "Given, separation between slits d = 0.28 mm = 0.28 × 10⁻³ m. Distance between screen and slit D = 1.4 m. Distance between central bright and fourth fringe x = 1.2 cm = 1.2 × 10⁻² m. Number of fringes n = 4. For constructive interference x = n Dλ/d. 1.2 × 10⁻² = (4 × 1.4 × λ)/(0.28 × 10⁻³). Wavelength, λ = (1.2 × 10⁻² × 0.28 × 10⁻³)/(4 × 1.4) => λ = 6 × 10⁻⁷ m." },
    { q: "80. A beam of light consisting of two wavelengths 650 nm and 520 nm is used to obtain interference fringes in a Young's double slit experiment with slit width = 2 mm and distance of screen = 1.2 m. (i) Find the distance of the third bright fringe on the screen from the central maximum for wavelength 650 nm. (ii) What is the least distance from the central maximum where the bright fringes due to both the wavelength coincide.", img: "", opts: ["1.17 × 10⁻³ m, 1.56 × 10⁻³ m", "2.25 × 10⁻² m, 1.25 m", "0.05 × 10⁻² m, 1.3 × 10⁻⁴ m", "None of the above"], ans: 0, exp: "Given, wavelength λ₁ = 650 nm = 650 × 10⁻⁹ m and λ₂ = 520 nm = 520 × 10⁻⁹ m, d = 2 × 10⁻³ m. (i) For third bright fringe, n = 3, D = 1.2 m. The distance of third bright fringe from central maximum. x = nλD/d = (3 × 650 × 10⁻⁹ × 1.2)/(2 × 10⁻³) = 1.17 × 10⁻³ m. (ii) Let nth bright fringe due to wavelength λ₂ = 520 nm, coincide with (n + 1)th bright fringe due to wavelength λ₁ = 650 nm. i.e., nλ₂D/d = (n - 1)λ₁D/d. n × 520 × 10⁻⁹ = (n - 1)650 × 10⁻⁹ or 4n = 5n - 5 or n = 5. Thus, the least distance, x = nλ₂D/d = 5 × 520 × 10⁻⁹ × 1.2/(2 × 10⁻³) = 1.56 × 10⁻³ m." },
    { q: "81. The distance between the first dark fringes on either side of the central bright fringe is", img: "", opts: ["1.2 cm", "1.2 mm", "2.4 cm", "2.4 mm"], ans: 3, exp: "Distance between the first dark fringes on either side of the central bright fringe = Width of central maxima. 2y = 2λD/d = (2 × 600 × 10⁻⁹ × 2)/(1 × 10⁻³) = 24 × 10⁻⁴ m = 2.4 mm." },
    { q: "82. In Young's double slit experiment, the central bright fringes can be identified", img: "", opts: ["as it is greater intensity than the other bright fringes", "as it has wider than the other bright fringes", "as it is narrower than the other bright fringes", "by using white light instead of monochromatic light"], ans: 3, exp: "In Young's double slit experiment, the central bright fringe is white while the other fringes are coloured. So, it is identified by using white light instead of monochromatic light." },
    { q: "83. Yellow light is used in a single-slit diffraction experiment with slit width of 0.6 mm. If yellow light is replaced by X-rays, then the observed pattern will reveal", img: "", opts: ["that the central maximum is narrower", "more number of fringes", "less number of fringes", "no diffraction pattern"], ans: 1, exp: "For diffraction pattern, the size of slit should be comparable to the wavelength of wave used. II. Diffraction phenomenon is commonly observed in our daily routine in case of sound waves (which is a longitudinal wave) because wavelength of sound waves is large (0.1-1 m). However, as wavelength of light waves is extremely small (10⁻⁶-10⁻⁷ m), we do not observe diffraction of light in daily routine. III. Diffraction is a wave phenomenon. It is observed in electromagnetic and longitudinal waves as well." },
    { q: "84. What should be the slit width to obtain 10 maxima of the double slit pattern within the central maxima of the single slit pattern of slit width 0.4 mm?", img: "", opts: ["0.4 mm", "0.2 mm", "0.6 mm", "0.8 mm"], ans: 1, exp: "For 10 maxima of double slit pattern within the central maxima of the single slit pattern, the angular width of the central maximum of single slit = angular width of 10 maxima of double slit. Therefore, 2λ/a = 10λ/d (where, a = slit width of single slit and d = slit width of double slit) => 2/a = 10/d => d = 10a/2 = 5a = 5 × 0.4 = 2 mm = 0.2 cm." },
    { q: "85. In a single slit diffraction of light of wavelengths λ is used and slit of width e, the size of the central maxima on a screen at a distance b is", img: "", opts: ["2bλ + e", "2bλ/e", "2bλ/e + e", "2bλ/e - e"], ans: 1, exp: "Size of central maxima on screen = 2 × (distance of screen) × (angle of diffraction) = 2bλ/e." },
    { q: "86. A parallel beam of light of wavelength 6000 Å gets diffracted by a single-slit width 0.3 mm. The angular position of the first minima of diffracted light is", img: "", opts: ["6 × 10⁻³ rad", "1.8 × 10⁻³ rad", "3.2 × 10⁻³ rad", "2 × 10⁻³ rad"], ans: 3, exp: "Here, λ = 6000 Å = 6 × 10⁻⁷ m, a = 0.3 mm = 3 × 10⁻⁴ m. For first minima, sin θ = λ/a = (6 × 10⁻⁷)/(3 × 10⁻⁴) = 2 × 10⁻³. As sin θ is very small, θ ≈ sin θ = 2 × 10⁻³ rad." },
    { q: "87. Yellow light from atomic sodium with a wavelength of 589 nm illuminates a single-slit. The dark fringes in the diffraction pattern are found to be seperated on either side of central bright by 2.2 mm, on a screen 1.0 m from the slit. The slit width is", img: "", opts: ["0.7 mm", "0.54 mm", "1.0 mm", "0.24 mm"], ans: 1, exp: "Using, for zero intensities path difference = mλ, we have dy/D = mλ. Slit width i.e., d = mλD/y = (1)(589 × 10⁻⁹ m) × (1.0 m)/(1.1 × 10⁻³ m) = 0.54 mm." },
    { q: "88. In a single-slit diffraction pattern observed on a screen placed at D m distance from the slit of width d m, the ratio of the width of the central maximum to the width of other secondary maximum is", img: "images/phy25-q88.png", opts: ["2:1", "1:2", "1:1", "3:1"], ans: 0, exp: "Width of central maximum (Δy₀) = 2y = 2λD/d ...(i). Width of 1st order secondary maxima = Distance between D₁ and D₂ (consecutive dark bands) = y₂ - y₁. For secondary minima (or dark band) path difference = d sin θ = mλ (where, m = 1, 2, 3...). Position of 1st dark band Path difference = y₁d/D = λ or y₁ = λD/d. Position of 2nd dark band Path difference = y₂d/D = 2λ => y₂ = 2λD/d. Therefore, Width of secondary maxima (Δy₁) => Δy₁ = y₂ - y₁ or Δy₁ = λD/d = y. Thus, width of other secondary maxima is half that of central maxima. or Δy₀/Δy₁ = 2/1." },
    { q: "89. Consider diffraction pattern obtained with a single slit at normal incidence. At the angular position of the first order diffraction maximum, the phase difference between the wavelets from the opposite edges of the slit is", img: "", opts: ["π/4", "π/2", "3π", "2π"], ans: 2, exp: "Phase difference = Δφ = 2π/λ × (d sin θ) (for two end of slit). For first order diffraction maximum, d sin θ = (2m + 1)λ/2, where m = 1. => 3λ/2 => Δφ = 2π/λ × 3λ/2 = 3π." },
    { q: "90. In a diffraction pattern due to a single slit of width a, the first minimum is observed at an angle 30° when light of wavelength 5000 Å is incident of the slit. The first secondary maximum is observed at an angle of", img: "", opts: ["sin⁻¹(2/3)", "sin⁻¹(1/2)", "sin⁻¹(3/4)", "sin⁻¹(1/4)"], ans: 2, exp: "For minima, a sin θ = nλ => a sin 30° = (1)λ (n = 1) => a = 2λ [∵ sin 30° = 1/2] ...(i). For 1st secondary maxima => a sin θ₁ = 3λ/2 => sin θ₁ = 3λ/2a ...(ii). Substitute value of a from Eq. (i) to Eq. (ii), we get sin θ₁ = 3λ/4λ => sin θ₁ = 3/4 => θ₁ = sin⁻¹(3/4)." },
    { q: "91. A parallel beam of fast moving electrons is incident normally on a narrow slit. A fluorescent screen is placed at a large distance from the slit. If the speed of the electrons is increased, then which of the following statements is correct?", img: "", opts: ["Diffraction pattern is not observed on the screen in the case of electrons", "The angular width of the central maximum of the diffraction pattern will increases", "The angular width of the central maximum will decreases", "The angular width of the central maximum will be unaffected"], ans: 2, exp: "λ = h/mv => λ ∝ 1/v. So, as velocity of electron increases, λ decreases. Angular width = 2θ = 2λ/a. So, θ decreases." },
    { q: "92. A single-slit diffraction pattern is formed with white light. For what wavelength of light the third secondary maximum in the diffraction pattern coincides with the second secondary maximum in the pattern for red light of wavelength 6500 Å.", img: "", opts: ["4400 Å", "4100 Å", "4642.8 Å", "9100 Å"], ans: 2, exp: "For 2nd secondary maxima using red light d sin θ₁ = ((2m + 1)/2)λ₁, where m = 2. d sin θ₁ = 5λ₁/2 => sin θ₁ = 5λ₁/2d ...(i). When white light is used, for position of 3rd secondary maxima (m = 3), d sin θ₂ = 7λ₂/2 => sin θ₂ = 7λ₂/2d ...(ii). Since, the position coincide with each other for white and red light sin θ₁ = sin θ₂ => 5λ₁/2d = 7λ₂/2d => λ₂ = 5/7 λ₁ = 5/7 × 6500 Å. Wavelength of white light, λ₂ = 4642.85 Å." },
    { q: "93. A single-slit of width d is illuminated by violet light of wavelength 400 nm and the width of the central maxima is measured as y. When half of the slit width is covered and illuminated by yellow light of wavelength 600 nm, the width of the central diffraction pattern is", img: "", opts: ["the pattern vanishes and the width is zero", "y/3", "3y", "None of the above"], ans: 2, exp: "Using violet light Slit width = d, λ₁ = 400 × 10⁻⁹ m. Width of diffraction pattern (central maxima) = 2y = 2λ₁D/d ...(i). Slit width = d/2 (as half covered). λ₂ = 600 × 10⁻⁹ m. Width of diffraction pattern(Central maxima) = 2y' = 2λ₂D/(d/2) ...(ii). From Eqs. (i) and (ii), y/y' = λ₁/2λ₂ => y/y' = 400/(600 × 2) = 2/3 × 1/2 = 1/3 => y' = 3y." },
    { q: "94. A beam of light of wavelength 600 nm from a distant source falls on a single-slit 1mm wider and the resulting diffraction pattern is observed on a screen 2m away. The distance between the first dark fringes on either side of the central bright fringes is", img: "", opts: ["1.2 cm", "1.2 mm", "2.4 cm", "2.4 mm"], ans: 3, exp: "Distance between the first dark fringes on either side of the central bright fringe = Width of central maxima. 2y = 2λD/d = (2 × 600 × 10⁻⁹ × 2)/(1 × 10⁻³) = 24 × 10⁻⁴ m = 2.4 mm." },
    { q: "95. If we observe the single-slit diffraction with wavelength λ and slit width e, the width of the central maximum is 2θ. On decreasing the slit width for the same λ, then", img: "", opts: ["θ increases", "θ remains unchanged", "θ decreases", "θ increases or decreases depending on the intensity of light"], ans: 0, exp: "Angular width of central maxima (2θ) = 2λ/d = 2λ/e. => 2θ ∝ λ/e => θ ∝ 1/e (for λ = constant). Thus, on decreasing slit width (e), then θ will increases." },
    { q: "96. In diffraction from a single slit the angular width of the central maxima does not depend on", img: "", opts: ["λ of light used", "width of slit", "distance of slits from the screen", "ratio of λ and slit width"], ans: 2, exp: "Angular width of central maxima = 2θ = 2λ/d. Thus, θ does not depend on D i.e., distance between the slits and the screen." },
    { q: "97. A parallel beam of light of wavelength 4000 Å gets diffraction by a single slit of width 0.2 mm. The angular position of the first minima of diffracted light is", img: "", opts: ["2 × 10⁻³ rad", "3 × 10⁻³ rad", "1.8 × 10⁻³ rad", "6 × 10⁻³ rad"], ans: 0, exp: "Here, λ = 4000 Å = 4000 × 10⁻¹⁰ m = 4 × 10⁻⁷ m. a = 0.2 mm = 0.2 × 10⁻³ m = 2 × 10⁻⁴ m. sin θ = λ/a = (4 × 10⁻⁷)/(2 × 10⁻⁴) = 2 × 10⁻³. As sin θ is very small, therefore θ ≈ sin θ = 2 × 10⁻³ rad." },
    { q: "98. A beam of light of λ = 600 nm from a distant source falls on a single slit 1 mm wide and the resulting diffraction pattern is observed on a screen 2 m away. The distance between first dark fringes on either side of the central bright fringe is", img: "images/phy25-q98.png", opts: ["1.2 cm", "1.2 mm", "2.4 cm", "2.4 mm"], ans: 3, exp: "From the figure, tan θ = (x/2)/D. For small θ and when θ is counted in rad, tan θ ≈ θ. Width of central maximum = 2λD/d = 2.4 mm. So, θ ≈ (x/2)/D = λ/a => x = 4λ/a = (4 × 600 × 10⁻⁹)/10⁻³ ≈ 24 × 10⁻⁴ m ≈ 2.4 × 10⁻³ m ≈ 2.4 mm." },
    { q: "99. In a Young's double slit experiment the angular width of a fringe is found to be 0.2° on a screen placed 1 m away. The wavelength of light used is 600 nm. If the entire experimental apparatus is immersed in water (Refractive index of water is 4/3), then angular width of the fringe will be", img: "", opts: ["0.25°", "0.15°", "0.75°", "1°"], ans: 1, exp: "Angular width, θ = λ/d. Therefore, θ₁/θ₂ = λ₁/λ₂ => θ₁/θ₂ = λ₁/λ₁/μ (refractive index) => θ₂ = θ₁/μ = 3/4 × 0.2 = 0.15°." },
    { q: "100. In a Young's double slit experiment, the screen is placed at a distance of 1.25 m from the slits. When the apparatus is immersed in water (μ_w = 4/3), the angular width of a fringe is found to be 0.2°. When the experiment is performed in air with same set up, the angular width of the fringe is", img: "", opts: ["0.4°", "0.28°", "0.35°", "0.15°"], ans: 1, exp: "In water angular width θ_w = 0.2° (given). We know, θ_w = λ_water/d ...(i). Let μ_water = refractive index of water. In air, θ_air = λ_air/d ...(ii). On dividing Eq. (i) from Eq. (ii), we get θ_w/θ_air = λ_water/λ_air or θ_w/θ_air = μ_air/μ_water = 1/μ_water (∵ λ_air/λ_water = μ_water/μ_air). => θ_air = μ_waterθ_w = 4/3 × 0.2° ≈ 0.28°." },
    { q: "101. The angular resolution of the telescope is determined by the", img: "", opts: ["image produced by the telescope", "objective of the telescope", "Both (a) and (b)", "Neither (a) nor (b)"], ans: 1, exp: "The angular resolution of the telescope is determined by the objective of the telescope." },
    { q: "102. In telescope, the radius of the central bright region (r₀) is", img: "images/phy25-q102.png", opts: ["0.61λf/a", "0.75λf/a", "1.94λf/a", "2.43λf/a"], ans: 0, exp: "Radius of the central bright region is approximately given by r₀ ≈ 1.22λf/2a = 0.61λf/a." },
    { q: "103. For better resolution, a telescope must have a", img: "", opts: ["large diameter objective", "small diameter objective", "may be large", "Neither large nor small"], ans: 0, exp: "Thus, Δθ will be small if the diameter of the objective is large. This implies that the telescope will have better resolving power, if a is large. It is for this reason that for better resolution, a telescope must have a large diameter objective." },
    { q: "104. The diameter of objective lens of a telescope is 6 cm and wavelength of light used is 540 nm. The resolving power of telescope is", img: "", opts: ["9.1 × 10⁴ rad⁻¹", "10⁵ rad⁻¹", "3 × 10⁴ rad⁻¹", "None of these"], ans: 0, exp: "Resolving power of telescope (RP) = 1/Δθ = D/1.22λ where, D = diameter of objective, λ = wavelength of light. Given, D = 6 cm = 6 × 10⁻² m, λ = 540 nm = 540 × 10⁻⁹ m. => RP = (6 × 10⁻²)/(1.22 × 540 × 10⁻⁹) rad⁻¹ = (6000 × 10⁴)/(540 × 1.22) rad⁻¹ = 9.1 × 10⁴ rad⁻¹." },
    { q: "105. A telescope is used to resolve two stars separated by 3.2 × 10⁻⁶ rad. If the wavelength of light used in 5600 Å, what should be the aperture of the objective of the telescope?", img: "", opts: ["0.2135 m", "0.1488 m", "0.567 m", "1 m"], ans: 0, exp: "Aperture of the telescope D = 1.22λ/dθ. Here λ = 5600 Å = 5600 × 10⁻¹⁰ m, dθ = 3.2 × 10⁻⁶ rad. Therefore, D = (1.22 × 5600 × 10⁻¹⁰)/(3.2 × 10⁻⁶) => D = 0.2135 m." },
    { q: "106. What will be the ratio (D/f) in microscope, where D is the diameter of the aperture and f is the focal length of the objective lens?", img: "", opts: ["tan β", "tan β/2", "2 tan β", "tan β/6"], ans: 2, exp: "The objective lens of a microscope, the object is placed slightly beyond f, so that a real image is formed at a distance v [figure]. The magnification ratio of image size to object size is given by m ≈ v/f. It can be seen from figure that D/f ≈ 2 tan β ...(i) where, 2β is the angle subtended by the diameter of the objective lens at the focus of the microscope." },
    { q: "107. If the medium between the object and the objective lens of a microscope is not air but refractive index n, then minimum separation gets modified to", img: "", opts: ["1.44λ/(2n sin β)", "1.22λ/(2n sin β)", "3.2λ/(2n sin β)", "1.49λ/(n sin β)"], ans: 1, exp: "If the medium between the object and the objective lens is not air but a medium of refractive index n, d_min = 1.22λ/(2n sin β)." },
    { q: "108. The resolving power of a compound microscope increases when", img: "", opts: ["refractive index of the medium is increased keeping wavelength of light (λ) constant (or same)", "for the same medium, wavelength of light is decreased", "refractive index of the medium and wavelength of light used both are decreased", "Both (a) and (b)"], ans: 3, exp: "For compound microscope, Resolving power i.e., RP = 2μ sin β/1.22λ. (i) ∵ RP ∝ μ. If the refractive index (μ) of the medium between the object and the objective lens increases, the resolving power increases. (ii) ∵ RP ∝ 1/λ. On increasing the wavelength of light used, the resolving power of microscope decreases and vice-versa." },
    { q: "109. In a Fresnel biprism experiment, the two positions of lens give separation between the slits as 25 cm and 16 cm respectively. The actual distance of separation is", img: "", opts: ["20 cm", "16 cm", "18 cm", "20.5 cm"], ans: 0, exp: "In Fresnel biprism experiment, the actual distance of separation between the two slits, d = √(d₁d₂) = √(25 × 16) = 20 cm." },
    { q: "110. For what distance is ray optics a good approximately when the aperture is 3 mm wide and wavelength is 500 nm?", img: "", opts: ["18 m", "25 m", "30 m", "35 m"], ans: 0, exp: "According to Fresnel distance, Z_F i.e., Z_F = a²/λ = (3 × 10⁻³)²/(5 × 10⁻⁷) = (9 × 10⁻⁶)/(5 × 10⁻⁷) = 18 m." },
    { q: "111. When the displacement of the wave is at right angles to the direction of its propagation, it is known as", img: "", opts: ["transverse wave", "longitudinal wave", "Either (a) or (b)", "Both (b) and (c)"], ans: 0, exp: "Light waves are transverse in nature; i.e., the electric field associated with a propagating light wave is always at right angles to the direction of propagation of the wave. We can say light waves are transverse electromagnetic waves." },
    { q: "112. Light waves are", img: "", opts: ["longitudinal waves", "electromagnetic waves", "transverse wave", "Both (b) and (c)"], ans: 3, exp: "Light waves are transverse in nature; i.e., the electric field associated with a propagating light wave is always at right angles to the direction of propagation of the wave. We can say light waves are transverse electromagnetic waves." },
    { q: "113. Which of the following can be used to control the intensity, in sunglasses, window pares etc?", img: "", opts: ["Transverse wave", "Polaroids", "Plane polarised wave", "Polarised wave"], ans: 1, exp: "Polaroids can be used to control the intensity in sunglasses windowpanes, etc. The intensity can be further controlled from 50% to zero of the incident intensity by adjusting the angle between the pass-axes of two polaroids." },
    { q: "114. The phenomenon of polarisation of light indicates that", img: "", opts: ["light is a longitudinal wave", "light is a transverse electromagnetic wave", "light is a transverse wave only", "Either (b) or (c)"], ans: 1, exp: "The phenomenon of polarisation is based on the fact that light waves are transverse electromagnetic waves. Light waves are transverse in nature i.e., the electric field associated with a propagating light wave is always at right angles to the direction of propagation of the wave." },
    { q: "115. Which of the following cannot be polarised?", img: "", opts: ["Ultraviolet", "Ultrasonic waves", "X-rays", "Radio waves"], ans: 1, exp: "Ultrasonic waves being sound waves are longitudinal and hence cannot be polarised." },
    { q: "116. Which of the following is a dichronic crystal?", img: "", opts: ["Quartz", "Tourmaline", "Mica", "Selenite"], ans: 1, exp: "Some crystals such as tourmaline and sheets of iodosulphate of quinine have the property of strongly absorbing the light with vibrations perpendicular to a specific direction (called pass axis), transmitting the light with vibration parallel to it. This selective absorption of light called dichroism." },
    { q: "117. In the propagation of light waves, the angle between the direction of vibration and plane of polarisation is", img: "", opts: ["0°", "90°", "45°", "80°"], ans: 0, exp: "Plane of vibration is perpendicular to the direction of propagation and also perpendicular to plane of polarisation. Thus, the angle between plane of polarisation and direction of vibration is 0° i.e., they are parallel." },
    { q: "118. When light passes through two polaroids P₁ and P₂, then transmitted polarisation is the component parallel to the polaroid axis. Which of the following is correct?", img: "images/phy25-q118.png", opts: ["Option (a)", "Option (b)", "Option (c)", "Option (d)"], ans: 0, exp: "If an identical piece of polaroid P₂ be placed before P₁. As expected, the light from the lamp is reduced in intensity on passing through P₂ alone. But now rotating P₁ has a dramatic effect on the light coming from P₂. In one position, the intensity transmitted by P₂ followed by P₁ is nearly zero. When turned by 90° from this position, P₁ transmits nearly the full intensity emerging from P₂ as shown figure." },
    { q: "119. At which angle the intensity of transmitted light is maximum when a polaroid sheet is rotated between two crossed polaroids?", img: "", opts: ["π/4", "π/2", "π/3", "π"], ans: 0, exp: "Suppose I₀ be the intensity of polarised light after passing through the first polariser P₁. Then, the intensity of light after passing through second polariser will be I = I₀ cos² θ. where, θ is the angle between pass axes of P₁ and P₂. Since, P₁ and P₃ are crossed the angle between the pass axes of P₂ and P₃ will be (π/2 - θ). Hence, the intensity of light emerging from P₃ will be I = I₀ cos² θ cos² (π/2 - θ) = I₀ cos² θ · sin² θ = (I₀/4) sin² 2θ. Therefore, the transmitted intensity will be maximum when θ = π/4." },
    { q: "120. Unpolarised light is incident on a plane glasses surface. What should be the angle of incidence so that the reflected and refracted rays are perpendicular to each other? [μ for glass = 1.5]", img: "images/phy25-q120.png", opts: ["60°", "90°", "0°", "57°"], ans: 3, exp: "Given, i + r = π/2. According to Brewster's law, we get tan i_B = μ = 1.5. So, i_B = tan⁻¹(1.5) => i_B = 57°. i.e., this is the Brewster's angle for air to glass interface." },
    { q: "121. An unpolarised beam of light of intensity I₀ falls on a polaroid. The intensity of the emergent beam is", img: "", opts: ["I₀/2", "I₀", "I₀/4", "zero"], ans: 0, exp: "In unpolarised beam, vibrations are probable in all directions in a plane perpendicular to the direction of propagation. Therefore, θ can have any value from 0 to 2π. [cos² θ]_av = 1/2π ∫₀²π cos² θ dθ = 1/2π ∫₀²π ((1 + cos 2θ)/2) dθ = 1/2. So, using law of Malus, I = I₀ cos² θ => I₀ = I₀ × 1/2 = I₀/2." },
    { q: "122. For good polariser in case of unpolarised light, we will observe", img: "", opts: ["reflection and no transmission of light", "no reflection and total transmission of light", "diffraction", "total internal reflection of light"], ans: 1, exp: "When an unpolarised beam of light is incident at the Brewster's angle on interface of two media, only part of light with electric field vector perpendicular to the plane of incidence will be reflected. Now, by using a good polariser, if we completely remove all the light with its electric vector perpendicular to the plane of incidence and let this light be incident on the surface of the prism at Brewster's angle, we will observe no reflection and there will be total transmission of light." },
    { q: "123. When both the components of electric field of light waves are present such that one is stronger than the other and such light is viewed through a rotating analyser, one sees a maximum and a minimum of intensity but not complete darkness. This kind of light is called", img: "", opts: ["polarised", "linearly polarised", "partially polarised", "None of these"], ans: 2, exp: "In the special situation, one of the two perpendicular components of the electric field is zero. At other angles, both components are present but one is stronger than the other. There is no stable phase relationship between the two perpendicular components, since these are derived from two perpendicular components of an unpolarised beam. When such light is viewed through a rotating analyser, one sees a maximum and a minimum of intensity but not complete darkness. This kind of light is called partially polarised." },
    { q: "124. An unpolarised beam intensity I₀ is incident on a pair of nicols making an angle of 60° with each other. The intensity of light emerging the pair is", img: "images/phy25-q124.png", opts: ["I₀", "I₀/2", "I₀/4", "I₀/8"], ans: 3, exp: "Angle between P₁ and P₂ = 60°. Intensity of light emerging from P₂ is I = I₀/2 cos² θ. where, θ = angle between P₁ and P₂. so, I = I₀/2 cos² 60° = I₀/8." },
    { q: "125. A beam of unpolarised light of intensity I₀ is passed through a polaroid A and then through another polaroid B which is oriented so that its principal plane makes an angle of 45° relative to that of A. The intensity of the emergent light is", img: "images/phy25-q125.png", opts: ["I₀", "I₀/2", "I₀/4", "I₀/8"], ans: 2, exp: "According to Malus law, I_R = (I₀/2)cos²(45°) = I₀/2 × 1/2 = I₀/4." },
    { q: "126. A beam of ordinary unpolarised light passes through a tourmaline crystal C₁ and then its passes through another tourmaline crystal C₂, which is oriented such that its principle plane is parallel to that of C₂. The intensity of emergent light is I₀. Now, C₂ is rotated by 60° about the ray. The emergent ray have an intensity.", img: "images/phy25-q126.png", opts: ["2I₀", "I₀/2", "I₀/4", "I₀/√4"], ans: 2, exp: "Case I Since, ray emergent from C₂ has intensity. Angle between C₁ and C₂ = 0°. I = I₁/2 cos² θ = I₁/2 cos² 0° = I₁/2. or I₁/2 = I₀ => I₁ = 2I₀. Case II Angle between C₁ and C₂ = 60°. Intensity of emergent ray = I₀ cos² 60° = I₀(1/2)² = I₀/4." },
    { q: "127. If unpolarised light is incident at polarising angle, then reflected light is completely i.e., 100% polarised perpendicular to the plane of incidence.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "If unpolarised light is incident at polarising angle, then reflected light is completely i.e., 100% polarised perpendicular to the plane of incidence." },
    { q: "128. tan i_B = μ, where i_B is polarising or Brewster's angle", img: "", opts: ["i_B = tan⁻¹(μ) = tan⁻¹(√3) = 60°", "i_B = tan⁻¹(μ) = tan⁻¹(√2) = 45°", "i_B = tan⁻¹(μ) = tan⁻¹(√3) = 30°", "i_B = tan⁻¹(μ) = tan⁻¹(√3) = 90°"], ans: 0, exp: "tan i_B = μ, where i_B is polarising or Brewster's angle => i_B = tan⁻¹(μ) = tan⁻¹(√3) = 60°." },
    { q: "129. Here, Critical angle, i_c = sin⁻¹(4/5). Therefore, sin i_c = 4/5. As μ = 1/sin i_c = 5/4. According to Brewster's law, tan i_p = μ. where, i_p is the polarising angle. Therefore, tan i_p = 5/4 => i_p = tan⁻¹(5/4).", img: "", opts: ["i_p = tan⁻¹(5/4)", "i_p = tan⁻¹(4/5)", "i_p = tan⁻¹(3/4)", "i_p = tan⁻¹(1/4)"], ans: 0, exp: "Here, Critical angle, i_c = sin⁻¹(4/5). Therefore, sin i_c = 4/5. As μ = 1/sin i_c = 5/4. According to Brewster's law, tan i_p = μ. where, i_p is the polarising angle. Therefore, tan i_p = 5/4 => i_p = tan⁻¹(5/4)." },
    { q: "130. As reflected light is completely polarised, therefore i_p = 45°. μ = tan i_p = tan 45° = 1. As μ = c/v => v = c/μ = (3 × 10⁸)/1 => v = 3 × 10⁸ ms⁻¹.", img: "", opts: ["3 × 10⁸ ms⁻¹", "2 × 10⁸ ms⁻¹", "1.5 × 10⁸ ms⁻¹", "4 × 10⁸ ms⁻¹"], ans: 0, exp: "As reflected light is completely polarised, therefore i_p = 45°. μ = tan i_p = tan 45° = 1. As μ = c/v => v = c/μ = (3 × 10⁸)/1 => v = 3 × 10⁸ ms⁻¹." },
    { q: "131. Using tan i_p = μ, tan i_p = 1, i_p = tan⁻¹(1) = 45°. As r = 90° - i_p = 90° - 45° => r = 45°.", img: "", opts: ["45°", "30°", "60°", "90°"], ans: 0, exp: "Using tan i_p = μ, tan i_p = 1, i_p = tan⁻¹(1) = 45°. As r = 90° - i_p = 90° - 45° => r = 45°." },
    { q: "132. Using, tan i_p = μ = 1.5 => i_p = tan⁻¹(1.5) = 56.3°.", img: "", opts: ["56.3°", "45°", "60°", "30°"], ans: 0, exp: "Using, tan i_p = μ = 1.5 => i_p = tan⁻¹(1.5) = 56.3°." },
    { q: "133. The branch of optics in which one completely neglects the finiteness of the wavelength is called geometrical optics. The wavelength of light is very small as compared to the dimensions of objects (such as mirror, lenses etc) and hence, it can be neglected and assumed to travel in a straight line.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "The branch of optics in which one completely neglects the finiteness of the wavelength is called geometrical optics. The wavelength of light is very small as compared to the dimensions of objects (such as mirror, lenses etc) and hence, it can be neglected and assumed to travel in a straight line." },
    { q: "134. Reflection and refraction arise through interaction of incident light with constituents of matter. Atoms may be viewed as oscillators, which take up the frequency of the external agency (light) causing forced oscillations. The frequency of light emitted by a charged oscillator equals its frequency of oscillation. Thus, the frequency of scattered light equals the frequency of incident light.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Reflection and refraction arise through interaction of incident light with constituents of matter. Atoms may be viewed as oscillators, which take up the frequency of the external agency (light) causing forced oscillations. The frequency of light emitted by a charged oscillator equals its frequency of oscillation. Thus, the frequency of scattered light equals the frequency of incident light." },
    { q: "135. Since, the speed of light waves is less in glass, the lower portion of the incoming wavefront (which travels through the greatest thickness of glass) will get delayed resulting in a tilt in the emerging wavefront.", img: "images/phy25-q135.png", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Since, the speed of light waves is less in glass, the lower portion of the incoming wavefront (which travels through the greatest thickness of glass) will get delayed resulting in a tilt in the emerging wavefront." },
    { q: "136. According to Huygens' principle each point of the wavefront is the source of a secondary disturbance and the wavelets emanating from these point spread out in all directions with the space of wave. These wavelets emanating from the wavefront are usually referred to as secondary wavelets and if we draw a common tangent to all these spheres, we obtain the new position of the wavefront at a later time.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "According to Huygens' principle each point of the wavefront is the source of a secondary disturbance and the wavelets emanating from these point spread out in all directions with the space of wave. These wavelets emanating from the wavefront are usually referred to as secondary wavelets and if we draw a common tangent to all these spheres, we obtain the new position of the wavefront at a later time." },
    { q: "137. Increase in wavelength of light when the source move away from the observer due to Doppler's effect is called red shift. The visible regions shifts towards red end of electromagnetic spectrum and hence called red shifted.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Increase in wavelength of light when the source move away from the observer due to Doppler's effect is called red shift. The visible regions shifts towards red end of electromagnetic spectrum and hence called red shifted." },
    { q: "138. As, we know, fringe width β i.e., = λD/d. So, smaller the distance between the slits (d), then larger be fringe width (β). Hence, single fringe will cover whole screen and pattern will not be visible.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "As, we know, fringe width β i.e., = λD/d. So, smaller the distance between the slits (d), then larger be fringe width (β). Hence, single fringe will cover whole screen and pattern will not be visible." },
    { q: "139. Given, initial phase difference = φ_S₁ - φ_S₂ = π. At central maximum, Δx = 0 (path difference = Δx). => Total phase difference = φ_S₁ - φ_S₂ + 2π/λ Δx. At central maximum, Δφ = π + 2π/λ × Δx = π + 0. or Δφ = π = odd multiple of π. Hence, at central maximum dark band is obtained.", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "Given, initial phase difference = φ_S₁ - φ_S₂ = π. At central maximum, Δx = 0 (path difference = Δx). => Total phase difference = φ_S₁ - φ_S₂ + 2π/λ Δx. At central maximum, Δφ = π + 2π/λ × Δx = π + 0. or Δφ = π = odd multiple of π. Hence, at central maximum dark band is obtained." },
    { q: "140. I_max/I_min = (√I₁ + √I₂)²/(√I₁ - √I₂)²", img: "", opts: ["True", "False", "Cannot say", "None of these"], ans: 0, exp: "I_max/I_min = (√I₁ + √I₂)²/(√I₁ - √I₂)²" },
