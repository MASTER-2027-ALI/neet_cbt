<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - NEET 2027 CBT</title>
<link rel="stylesheet" href="style.css">
<style>
  .class-heading {
    font-size: 20px;
    color: #2b6cb0;
    margin: 30px 0 15px 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .class-heading span {
    background: #ebf8ff;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 14px;
    color: #2c5282;
  }
</style>
</head>
<body>
<div class="dashboard-container">
  <div class="dash-header">
    <h1>🧬 NEET 2027 CBT</h1>
    <div class="user-info">
      <span class="user-badge" id="userBadge">👤 User</span>
      <a href="admin.html" class="btn-logout" id="adminBtn" style="display:none; background:rgba(168,85,247,0.15); border-color:rgba(168,85,247,0.4); color:#c4b5fd; text-decoration:none;">👑 Admin Panel</a>
      <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <div class="num">32</div>
      <div class="label">Total Chapters</div>
    </div>
    <div class="stat-card">
      <div class="num" id="attemptedCount">0</div>
      <div class="label">Attempted</div>
    </div>
    <div class="stat-card">
      <div class="num" id="avgScore">0%</div>
      <div class="label">Average Score</div>
    </div>
  </div>

  <h2 class="class-heading">📚 Class 11 Biology <span>19 Chapters</span></h2>
  <div class="chapters-grid" id="class11Grid"></div>

  <h2 class="class-heading">📚 Class 12 Biology <span>13 Chapters</span></h2>
  <div class="chapters-grid" id="class12Grid"></div>
</div>

<script src="keys.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Check login
const userData = localStorage.getItem('cbt_user');
if (!userData) {
  window.location.href = 'index.html';
}
const user = JSON.parse(userData);
document.getElementById('userBadge').textContent = '👤 ' + user.name;

if (user.role === 'master') {
  document.getElementById('adminBtn').style.display = 'inline-block';
}

// ========================================
// SESSION LISTENER (Auto Logout)
// ========================================
async function listenForSession() {
  if (!user.uid) return;
  const sessionRef = doc(db, "sessions", user.uid);
  
  onSnapshot(sessionRef, (docSnap) => {
    if (docSnap.exists()) {
      const remoteSessionId = docSnap.data().sessionId;
      // If remote session is different from mine
      if (remoteSessionId !== user.sessionId) {
        alert('⚠️ आपकी पासकी से किसी और ने लॉगिन कर लिया है।\n\nआपको लॉगआउट किया जा रहा है।');
        localStorage.removeItem('cbt_user');
        localStorage.removeItem('cbt_login_time');
        window.location.href = 'index.html';
      }
    }
  });
}
listenForSession();

// ========================================
// CHAPTER LISTS
// ========================================
const class11Chapters = [
  { num: 1, name: "The Living World", file: "chapter1.html" },
  { num: 2, name: "Biological Classification", file: "chapter2.html" },
  { num: 3, name: "Plant Kingdom", file: "chapter3.html" },
  { num: 4, name: "Animal Kingdom", file: "chapter4.html" },
  { num: 5, name: "Morphology of Flowering Plants", file: "chapter5.html" },
  { num: 6, name: "Anatomy of Flowering Plants", file: "chapter6.html" },
  { num: 7, name: "Structural Organisation in Animals", file: "chapter7.html" },
  { num: 8, name: "Cell: The Unit of Life", file: "chapter8.html" },
  { num: 9, name: "Biomolecules", file: "chapter9.html" },
  { num: 10, name: "Cell Cycle and Cell Division", file: "chapter10.html" },
  { num: 11, name: "Photosynthesis in Higher Plants", file: "chapter11.html" },
  { num: 12, name: "Respiration in Plants", file: "chapter12.html" },
  { num: 13, name: "Plant Growth and Development", file: "chapter13.html" },
  { num: 14, name: "Breathing and Exchange of Gases", file: "chapter14.html" },
  { num: 15, name: "Body Fluids and Circulation", file: "chapter15.html" },
  { num: 16, name: "Excretory Products and their Elimination", file: "chapter16.html" },
  { num: 17, name: "Locomotion and Movement", file: "chapter17.html" },
  { num: 18, name: "Neural Control and Coordination", file: "chapter18.html" },
  { num: 19, name: "Chemical Coordination and Integration", file: "chapter19.html" }
];

const class12Chapters = [
  { num: 20, name: "Sexual Reproduction in Flowering Plants", file: "chapter20.html" },
  { num: 21, name: "Human Reproduction", file: "chapter21.html" },
  { num: 22, name: "Reproductive Health", file: "chapter22.html" },
  { num: 23, name: "Principles of Inheritance and Variation", file: "chapter23.html" },
  { num: 24, name: "Molecular Basis of Inheritance", file: "chapter24.html" },
  { num: 25, name: "Evolution", file: "chapter25.html" },
  { num: 26, name: "Human Health and Disease", file: "chapter26.html" },
  { num: 27, name: "Microbes in Human Welfare", file: "chapter27.html" },
  { num: 28, name: "Biotechnology: Principles and Processes", file: "chapter28.html" },
  { num: 29, name: "Biotechnology and its Applications", file: "chapter29.html" },
  { num: 30, name: "Organisms and Populations", file: "chapter30.html" },
  { num: 31, name: "Ecosystem", file: "chapter31.html" },
  { num: 32, name: "Biodiversity and Conservation", file: "chapter32.html" }
];

// ========================================
// LOAD RESULTS FROM FIREBASE
// ========================================
async function loadResults() {
  try {
    const q = query(collection(db, "results"), where("userName", "==", user.name));
    const snapshot = await getDocs(q);
    
    const userResults = {};
    snapshot.forEach(doc => {
      const data = doc.data();
      const chNum = data.chapterNum;
      if (!userResults[chNum]) {
        userResults[chNum] = { attempts: [], best: null };
      }
      userResults[chNum].attempts.push(data);
    });
    
    for (const chNum in userResults) {
      userResults[chNum].attempts.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const attempts = userResults[chNum].attempts;
      const bestPercent = Math.max(...attempts.map(a => a.percent));
      userResults[chNum].best = attempts.find(a => a.percent === bestPercent);
    }
    
    renderChapters(userResults);
    
  } catch (e) {
    console.error('Firebase load error:', e);
    document.getElementById('class11Grid').innerHTML = '<div style="padding:20px;color:#f87171;">⚠️ Firebase se data load nahi hua. Internet check karein.</div>';
    document.getElementById('class12Grid').innerHTML = '';
  }
}

function renderChapters(userResults) {
  renderGrid(class11Chapters, 'class11Grid', userResults);
  renderGrid(class12Chapters, 'class12Grid', userResults);
  
  let totalAttempted = 0;
  let totalPercent = 0;
  const allChapters = [...class11Chapters, ...class12Chapters];
  
  allChapters.forEach(ch => {
    const result = userResults[ch.num];
    if (result && result.attempts.length > 0) {
      totalAttempted++;
      totalPercent += parseFloat(result.best.percent);
    }
  });
  
  document.getElementById('attemptedCount').textContent = totalAttempted;
  document.getElementById('avgScore').textContent = totalAttempted > 0 
    ? (totalPercent / totalAttempted).toFixed(1) + '%' 
    : '0%';
}

function renderGrid(chapters, gridId, userResults) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  
  chapters.forEach(ch => {
    const card = document.createElement('a');
    card.className = 'chapter-card';
    card.href = ch.file;
    
    const result = userResults[ch.num];
    let statusHTML = '';
    
    if (result && result.attempts.length > 0) {
      const attemptsCount = result.attempts.length;
      const lastAttempt = result.attempts[attemptsCount - 1];
      const bestAttempt = result.best || lastAttempt;
      
      const bestClass = bestAttempt.percent >= 50 ? 'done' : '';
      const displayBestPercent = Math.max(0, bestAttempt.percent);
      const displayLastPercent = Math.max(0, lastAttempt.percent);
      
      statusHTML = `
        <div class="chapter-status ${bestClass}">🏆 Best: <strong>${displayBestPercent}%</strong> (${bestAttempt.correct}/${bestAttempt.total})</div>
        <div class="chapter-status" style="color:#94a3b8; font-size:12px; margin-top:4px;">
          📊 Last: ${displayLastPercent}% &nbsp;|&nbsp; 🔁 Attempts: <strong>${attemptsCount}</strong>
        </div>
      `;
    } else {
      statusHTML = `<div class="chapter-status">📝 Not attempted yet</div>`;
    }
    
    card.innerHTML = `
      <div class="chapter-num">CHAPTER ${ch.num}</div>
      <div class="chapter-name">${ch.name}</div>
      ${statusHTML}
    `;
    grid.appendChild(card);
  });
}

window.logout = function() {
  localStorage.removeItem('cbt_user');
  localStorage.removeItem('cbt_login_time');
  window.location.href = 'index.html';
};

loadResults();
</script>
</body>
</html>
