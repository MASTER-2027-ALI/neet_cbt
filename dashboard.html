<html lang="en">
<head>

<title>Dashboard - NEET 2027 CBT</title>
<link rel="stylesheet" href="style.css">
<style>
  /* नए टैब्स के लिए स्टाइल */
  .subject-tabs {
    display: flex;
    gap: 15px;

    justify-content: center;
  }
  .subject-btn {
    padding: 15px 40px;
    font-size: 18px;
    font-weight: 700;
    border: 2px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    background: rgba(30, 41, 59, 0.85);
    color: #94a3b8;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .subject-btn:hover {
    border-color: #60a5fa;
    color: #e2e8f0;
  }
  .subject-btn.active {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
    border-color: #3b82f6;
    color: #fff;
    box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
  }

  .class-heading {
    font-size: 20px;
    color: #2b6cb0;
    margin: 30px 0 15px 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .class-heading span {
    background: #ebf8ff;

    border-radius: 20px;
    font-size: 14px;
    color: #2c5282;
  }

  /* सेक्शन छिपाने/दिखाने के लिए */
  .subject-section {
    display: none;
  }
  .subject-section.active {
    display: block;
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

    <div class="chapters-grid" id="phy11Grid"></div>

    <h2 class="class-heading">📚 Class 12 Physics <span>14 Chapters</span></h2>
    <div class="chapters-grid" id="phy12Grid"></div>
  </div>

</div>

<script src="keys.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Check login
const userData = localStorage.getItem('cbt_user');
if (!userData) {
  window.location.href = 'index.html';
}
const user = JSON.parse(userData);
document.getElementById('userBadge').textContent = '👤 ' + user.name;

if (user.role === 'master') {
  document.getElementById('adminBtn').style.display = 'inline-block';
}

// ========================================
// SESSION LISTENER (Auto Logout)
// ========================================
function listenForSession() {
  if (!user.uid) return;
  const sessionRef = doc(db, "sessions", user.uid);
  
  onSnapshot(sessionRef, (docSnap) => {
    if (docSnap.exists()) {
      const remoteSessionId = docSnap.data().sessionId;
      if (remoteSessionId !== user.sessionId) {
        alert('⚠️ आपकी पासकी से किसी और ने लॉगिन कर लिया है।\n\nआपको लॉगआउट किया जा रहा है।');
        localStorage.removeItem('cbt_user');
        localStorage.removeItem('cbt_login_time');
        window.location.href = 'index.html';
      }
    } else {
      localStorage.removeItem('cbt_user');
      localStorage.removeItem('cbt_login_time');
      window.location.href = 'index.html';
    }
  });
}
listenForSession();

// ========================================
// SUBJECT SWITCH LOGIC
// ========================================
window.switchSubject = function(sub) {
  document.getElementById('btnBio').classList.remove('active');
  document.getElementById('btnPhy').classList.remove('active');
  document.getElementById('section-bio').classList.remove('active');
  document.getElementById('section-phy').classList.remove('active');

  if (sub === 'bio') {
    document.getElementById('btnBio').classList.add('active');
    document.getElementById('section-bio').classList.add('active');
  } else {
    document.getElementById('btnPhy').classList.add('active');
    document.getElementById('section-phy').classList.add('active');
  }
};

// ========================================
// CHAPTER LISTS
// ========================================

  { num: 9, name: "Biomolecules", file: "chapter9.html" },
  { num: 10, name: "Cell Cycle and Cell Division", file: "chapter10.html" },

// ========================================
// LOAD RESULTS FROM FIREBASE
// ========================================
async function loadResults() {
  try {
    const q = query(collection(db, "results"), where("userName", "==", user.name));
    const snapshot = await getDocs(q);
    
    const userResults = {};
    snapshot.forEach(doc => {
      const data = doc.data();
      const chNum = data.chapterNum;
      if (!userResults[chNum]) {
        userResults[chNum] = { attempts: [], best: null };
      }
      userResults[chNum].attempts.push(data);
    });
    
    for (const chNum in userResults) {
      userResults[chNum].attempts.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      const attempts = userResults[chNum].attempts;
      const bestPercent = Math.max(...attempts.map(a => a.percent));
      userResults[chNum].best = attempts.find(a => a.percent === bestPercent);
    }
    
    renderAll(userResults);
    
  } catch (e) {
    console.error('Firebase load error:', e);
    document.getElementById('bio11Grid').innerHTML = '<div style="padding:20px;color:#f87171;">⚠️ Data load nahi hua.</div>';
  }
}

function renderAll(userResults) {
  renderGrid(bio11Chapters, 'bio11Grid', userResults);
  renderGrid(bio12Chapters, 'bio12Grid', userResults);
  renderGrid(phy11Chapters, 'phy11Grid', userResults);
  renderGrid(phy12Chapters, 'phy12Grid', userResults);
  
  let totalAttempted = 0;
  let totalPercent = 0;
  const allChapters = [...bio11Chapters, ...bio12Chapters, ...phy11Chapters, ...phy12Chapters];
  
  allChapters.forEach(ch => {
    const result = userResults[ch.num];
    if (result && result.attempts.length > 0) {
      totalAttempted++;
      totalPercent += parseFloat(result.best.percent);
    }
  });
  
  document.getElementById('attemptedCount').textContent = totalAttempted;
  document.getElementById('avgScore').textContent = totalAttempted > 0 
    ? (totalPercent / totalAttempted).toFixed(1) + '%' 
    : '0%';
}

function renderGrid(chapters, gridId, userResults) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = '';
  
  chapters.forEach(ch => {
    const card = document.createElement('a');
    card.className = 'chapter-card';
    card.href = ch.file;
    
    const result = userResults[ch.num];
    let statusHTML = '';
    
    if (result && result.attempts.length > 0) {
      const attemptsCount = result.attempts.length;
      const lastAttempt = result.attempts[attemptsCount - 1];
      const bestAttempt = result.best || lastAttempt;
      
      const bestClass = bestAttempt.percent >= 50 ? 'done' : '';
      const displayBestPercent = Math.max(0, bestAttempt.percent);
      const displayLastPercent = Math.max(0, lastAttempt.percent);
      
      statusHTML = `
        <div class="chapter-status ${bestClass}">🏆 Best: <strong>${displayBestPercent}%</strong> (${bestAttempt.correct}/${bestAttempt.total})</div>
        <div class="chapter-status" style="color:#94a3b8; font-size:12px; margin-top:4px;">
          📊 Last: ${displayLastPercent}% &nbsp;|&nbsp; 🔁 Attempts: <strong>${attemptsCount}</strong>
        </div>
      `;
    } else {
      statusHTML = `<div class="chapter-status">📝 Not attempted yet</div>`;
    }
    
    card.innerHTML = `
      <div class="chapter-num">CHAPTER ${ch.num}</div>
      <div class="chapter-name">${ch.name}</div>
      ${statusHTML}
    `;
    grid.appendChild(card);
  });
}

window.logout = async function() {
  try {
    const { deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    await deleteDoc(doc(db, "sessions", user.uid));
  } catch(e) { console.log(e); }
  
  localStorage.removeItem('cbt_user');
  localStorage.removeItem('cbt_login_time');
  window.location.href = 'index.html';
};

loadResults();
</script>
