<script>
const questions = [
    { q: "1. The gas that is removed from the atmosphere by plants and algae is", opts: ["nitrogen.", "oxygen.", "carbon dioxide.", "methane."], ans: 2, exp: "Carbon dioxide is removed by photosynthesis." },
    { q: "2. Carbon cycles relatively rapidly except when it is", opts: ["dissolved in freshwater ecosystems.", "released by respiration.", "converted into sugars.", "stored in petroleum, coal, or wood."], ans: 3, exp: "Stored in petroleum, coal, or wood." },
    { q: "3. In the past 150 years there has been a major new input to the carbon cycle. What is it?", opts: ["There are more humans releasing large quantities of carbon dioxide as respiration.", "Increased animal farming has resulted in greater carbon dioxide releases.", "Industrialization has resulted in the burning of fossil fuels such as oil and coal, which releases carbon dioxide into the atmosphere.", "Changes in ocean currents have lead to the release of large quantities of carbon dioxide"], ans: 2, exp: "Industrialization and burning of fossil fuels." },
    { q: "4. In succession,_________is a crucial factor.", opts: ["Time", "Direction", "Height", "Space"], ans: 0, exp: "Time is crucial." },
    { q: "5. A rat feeding on potato tuber is-", opts: ["Carnivore", "Decomposer", "Producer", "Primary consumer"], ans: 3, exp: "Primary consumer." },
    { q: "6. What do primary producers have available to convert into biomass?", opts: ["10% of secondary productivity", "energy used for respiration", "gross primary productivity", "net primary productivity"], ans: 3, exp: "Net primary productivity." },
    { q: "7. Productivity in terrestrial ecosystems is affected by", opts: ["temperature.", "light intensity,", "availability of nutrients and water.", "all of the above."], ans: 3, exp: "All of the above." },
    { q: "8. Which of the following organisms and trophic levels is mismatched?", opts: ["algae—producer", "phytoplankton—primary consumer", "fungi—detritivore", "bobcat—secondary consumer"], ans: 1, exp: "Phytoplankton are producers, not primary consumers." },
    { q: "9. The open ocean and tropical rain forest are the two largest contributors to Earth's net primary productivity because", opts: ["both have high rates of net primary productivity.", "both cover huge surface areas of the Earth.", "nutrients cycle fastest in these two ecosystems.", "the ocean covers a huge surface area and the tropical rain forest has a high rate of productivity."], ans: 3, exp: "The ocean covers a huge surface area and the tropical rain forest has a high rate of productivity." },
    { q: "10. Which of the following is not true of a pyramid of productivity?", opts: ["Only about 10% of the energy in one trophic level is passed into the next level.", "Because of the loss of energy at each trophic level, most food chains are limited to three to five steps.", "The pyramid of productivity of some aquatic ecosystems is inverted because of the large zooplankton primary-consumer level", "Eating grain-fed beef is an inefficient means of obtaining the energy trapped by photosynthesis"], ans: 2, exp: "The pyramid of productivity is usually upright, not inverted." },
    { q: "11. Nitrogen is often in short supply in terrestrial ecosystems. Why?", opts: ["There is very little free nitrogen in the air.", "Atmospheric nitrogen is primarily in the stratosphere and does not come into contact with terrestrial ecosystems.", "Atmospheric nitrogen cannot be used by most organisms. It needs to be converted to useful forms by bacteria and cyanobacteria.", "Nitrogen solubility in water is very low and therefore atmospheric nitrogen enters cells very slowly."], ans: 2, exp: "Atmospheric nitrogen needs to be fixed by bacteria/cyanobacteria." },
    { q: "12. Primary productivity", opts: ["is equal to the standing crop of an ecosystem.", "is greatest in freshwater ecosystems.", "is the rate of conversion of light to chemical energy in an ecosystem.", "is inverted in some aquatic ecosystems."], ans: 2, exp: "Rate of conversion of light to chemical energy." },
    { q: "13. Which of the following trophic levels would have the largest numbers of individuals?", opts: ["primary producers", "omnivores", "primary consumers", "opportunistic feeders"], ans: 0, exp: "Primary producers." },
    { q: "14. In an ecosystem, bacteria are considered as-", opts: ["Microconsumers", "Macroconsumers", "Primary consumers", "Secondary consumers"], ans: 0, exp: "Microconsumers (decomposers)." },
    { q: "15. Frog that feeds on an insect is-", opts: ["Primary consumer", "Secondary consumer", "Tertiary consumer", "Decomposer"], ans: 1, exp: "Secondary consumer." },
    { q: "16. The nature's cleaners are-", opts: ["Producers", "Consumers", "Decomposer and scavenger", "Symbionts"], ans: 2, exp: "Decomposers and scavengers." },
    { q: "17. Density and distribution of the plant and animal species vary along-", opts: ["Stratification", "Succession", "Gradation", "Zonation"], ans: 3, exp: "Zonation." },
    { q: "18. In an ecosystem,", opts: ["energy is recycled through the trophic structure.", "energy is usually captured from sunlight by primary producers, passed to secondary producers in the form of organic compounds, and lost to detritivores in the form of heat.", "chemicals are recycled between the biotic and abiotic sectors, whereas energy makes a one-way trip through the food web.", "there is a continuous process by which energy is lost as heat, and chemical elements leave the ecosystem through runoff"], ans: 2, exp: "Chemicals are recycled, energy flows one way." },
    { q: "19. Chemosynthetic bacteria found around deep-sea vents are examples of", opts: ["producers.", "decomposers.", "chemical cycling.", "secondary productivity"], ans: 0, exp: "Producers." },
    { q: "20. Photosynthesis and respiration are central to which cycle?", opts: ["The nitrogen cycle", "The carbon cycle", "The phosphorus cycle", "The sulfur cycle"], ans: 1, exp: "The carbon cycle." },
    { q: "21. Most of Earth's nitrogen is in", opts: ["the atmosphere.", "the oceans.", "fresh water.", "soil."], ans: 0, exp: "The atmosphere." },
    { q: "22. Most of the world's carbon is found", opts: ["as carbon dioxide in the atmosphere.", "in living organisms.", "as bicarbonate and carbonate ions dissolved in the oceans.", "as carbonate minerals in sedimentary rock."], ans: 3, exp: "As carbonate minerals in sedimentary rock." },
    { q: "23. Which of these processes is incorrectly paired with its description?", opts: ["nitrification—oxidation of ammonium in the soil to nitrite and nitrate", "nitrogen fixation—reduction of atmospheric nitrogen into ammonia", "denitrification—removal of nitrogen from organic compounds", "ammonification—decomposition of organic compounds into ammonia"], ans: 2, exp: "Denitrification is the conversion of nitrates back to nitrogen gas." },
    { q: "24. Secondary productivity", opts: ["is measured by the standing crop.", "is the rate of biomass production in consumers,", "is greater than primary productivity.", "is 10% less than primary productivity."], ans: 1, exp: "Rate of biomass production in consumers." },
    { q: "25. Biogeochemical cycles are global for elements", opts: ["that are found in the atmosphere.", "that are found mainly in the soil,", "such as carbon, nitrogen, and phosphorus.", "that are dissolved in water."], ans: 0, exp: "That are found in the atmosphere." },
    { q: "26. Stratification is more common in-", opts: ["Deciduous forest", "Tropical rain forest", "Temperature forest", "Tropical savannah"], ans: 1, exp: "Tropical rain forest." },
    { q: "27. Deer in a forest ecosystem acts as-", opts: ["Primary consumer", "Secondary consumer", "Decomposer", "None"], ans: 0, exp: "Primary consumer." },
    { q: "28. Which of the following biogeochemical cycles has a major reservoir in sedimentary rock?", opts: ["Carbon cycle", "Nitrogen cycle", "Phosphorus cycle", "More than one cycle"], ans: 2, exp: "Phosphorus cycle." },
    { q: "29. In biogeochemical cycles, elements that cycle fastest", opts: ["are found in organisms.", "are scarce.", "have a gaseous phase.", "do not become fixed into sediment."], ans: 2, exp: "Have a gaseous phase." },
    { q: "30. Black soil is due to the presence in it of-", opts: ["Air", "Minerals", "More Moisture", "Organic matter"], ans: 3, exp: "Organic matter." },
    { q: "31. Which of the following statements regarding the hydrological cycle is false?", opts: ["Most input to the oceans occurs via runoff from rivers.", "More water evaporates from the surface of the oceans than falls as rain over the oceans.", "Less water evaporates from the surface of the land than falls as rain over the land.", "Water found in sedimentary rock is constantly exchanged with the ocean."], ans: 3, exp: "Water in sedimentary rock is not constantly exchanged." },
    { q: "32. Which of the following always has a 'pyramidal' shape, that is, decreasing values at higher trophic levels?", opts: ["Pyramids of numbers only", "Pyramids of biomass only", "Pyramids of energy only", "Both pyramids of biomass and pyramids of energy"], ans: 2, exp: "Pyramids of energy only." },
    { q: "33. Which of the following could not be considered an ecosystem?", opts: ["A small pond", "All the fish in a coral reef", "Earth", "A pile of dung in a pasture"], ans: 1, exp: "All the fish in a coral reef (only a community, not ecosystem)." },
    { q: "34. Which of the following is not an objective of integrated pest management?", opts: ["To eliminate the use of chemicals in agriculture", "To develop pest-resistant strains", "To use natural biological control methods", "To reduce agriculturally-caused pollution"], ans: 0, exp: "To eliminate the use of chemicals in agriculture." },
    { q: "35. Water logging occurs in-", opts: ["Sandy soil", "Gravel soil", "Loamy soil", "Clay soil"], ans: 3, exp: "Clay soil." },
    { q: "36. Green plants constitute-", opts: ["1st Trophic level", "2nd trophic level", "3rd trophic level", "4th trophic level"], ans: 0, exp: "1st Trophic level." },
    { q: "37. Grasslands can support greater grazing rates by herbivores than forests because", opts: ["grasslands receive more sunlight.", "the net production of grasslands is greater.", "grasslands produce less woody plant tissue.", "more of the grassland production is above ground."], ans: 2, exp: "Grasslands produce less woody plant tissue." },
    { q: "38. Which of the following statements about food chains and energy flow through ecosystems is false?", opts: ["A single organism can feed at several trophic levels.", "The lower the trophic level at which an organism feeds, the more energy is available.", "Detritivores feed at all trophic levels except the producer level.", "Food webs include two or more food chains."], ans: 2, exp: "Detritivores feed at all trophic levels including the producer level." },
    { q: "39. What is true about photolithotrophs?", opts: ["Obtain energy from radiations and hydrogen from organic compounds", "Obtain energy from radiations and hydrogen from inorganic compounds", "Obtain energy from organic compounds", "Obtain energy from inorganic compounds"], ans: 1, exp: "Obtain energy from radiations and hydrogen from inorganic compounds." },
    { q: "40. Which of the following biogeochemical cycles is characterized by a major reservoir that is gaseous, and a major inorganic form that can only be utilized by a small group of bacteria and cyanobacteria?", opts: ["Carbon cycle", "Nitrogen cycle", "Phosphorus cycle", "Sulfur cycle"], ans: 1, exp: "Nitrogen cycle." },
    { q: "41. On average, how much of the energy assimilated at one trophic level is converted to production at the next trophic level (excluding the conversion of sunlight into chemical energy by plants)?", opts: ["5 - 20%", "Less than 1 %", "20 - 30%", "30 - 50%"], ans: 0, exp: "5 - 20%." },
    { q: "42. A plant in the dark uses 0.02 ml of O2 per minute. The same plant in sunlight releases 0.14 ml of O2 per minute. A correct estimate of its rate of gross primary production is", opts: ["0.02 ml of O2 per minute,", "0.12 ml of O2 per minute.", "0.14 ml of O2 per minute.", "0.16 ml of O2 per minute."], ans: 3, exp: "0.16 ml (0.14 + 0.02)." },
    { q: "43. Which of the following biogeochemical cycles has a gaseous phase released by volcanoes and fumaroles?", opts: ["Carbon cycle", "Nitrogen cycle", "Phosphorus cycle", "Sulfur cycle"], ans: 3, exp: "Sulfur cycle." },
    { q: "44. An inverted pyramid of _______ may occasionally be observed in ________ communities.", opts: ["energy, grassland", "energy, forest", "biomass, marine", "biomass, grassland"], ans: 2, exp: "Biomass, marine." },
    { q: "45. In light, a plant fixes 0.12ml of CO2 per hour, however, in the dark the same plant releases 0.04 ml of CO2 per hour. What is the estimated net primary production of this plant?", opts: ["0.04 ml/hour", "0.08 ml/hour", "0.12 ml/hour", "0.16 ml/hour"], ans: 1, exp: "0.08 ml/hour." },
    { q: "46. Which of the environment is richest in free oxygen?", opts: ["Salt water", "Atmosphere", "Warm fresh water", "Cold Fresh water"], ans: 1, exp: "Atmosphere." },
    { q: "47. The large carnivores such as lion, tiger, which cannot be preyed upon further are called-", opts: ["Predator", "Organolithotroph", "Top Carnivore", "Omnivore"], ans: 2, exp: "Top Carnivore." },
    { q: "48. The phosphorus cycle differs from the carbon cycle in that", opts: ["phosphorus does not enter living organisms, whereas carbon does.", "the phosphorus cycle does not include a gaseous phase, whereas the carbon cycle does.", "the phosphorus cycle includes a solid phase, whereas the carbon cycle does not.", "the primary reservoir of the phosphorus cycle is the atmosphere, whereas the primary reservoir for the carbon cycle is in rock."], ans: 1, exp: "Phosphorus cycle does not include a gaseous phase." },
    { q: "49. Which of the following changes would not result in an increase in net primary production?", opts: ["Increased precipitation in an arid area", "Increased soil fertility", "Increased latitude (moving from the equator toward the poles)", "Moving down a mountain to warmer temperatures"], ans: 2, exp: "Increased latitude." },
    { q: "50. Which of the following biogeochemical cycles is characterized by a form which is a major greenhouse gas?", opts: ["Carbon cycle", "Nitrogen cycle", "Phosphorus cycle", "Sulfur cycle"], ans: 0, exp: "Carbon cycle." },
    { q: "51. Which of the following biogeochemical cycles lacks a gaseous phase?", opts: ["Carbon cycle", "Nitrogen cycle", "Phosphorus cycle", "Sulfur cycle"], ans: 2, exp: "Phosphorus cycle." },

const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
    palette.innerHTML = '';
    for (let i = 0; i < totalQ; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = i + 1;
        btn.id = 'pal-' + i;
        btn.onclick = () => goToQuestion(i);
        palette.appendChild(btn);
    }
}

function updatePalette() {
    for (let i = 0; i < totalQ; i++) {
        const btn = document.getElementById('pal-' + i);
        if (!btn) continue;
        btn.className = 'palette-btn';
        if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
        else if (marked[i]) btn.classList.add('marked');
        else if (userAnswers[i] !== null) btn.classList.add('attempted');
        else if (visited[i]) btn.classList.add('not-answered');
        else btn.classList.add('not-visited');
        if (i === currentQ) btn.classList.add('current');
    }
}

function updateStats() {
    let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
    for (let i = 0; i < totalQ; i++) {
        if (userAnswers[i] !== null) attempted++;
        else if (visited[i]) notAnswered++;
        else notVisited++;
        if (marked[i]) markedCount++;
    }
    document.getElementById('sbTotal').textContent = totalQ;
    document.getElementById('sbAttempted').textContent = attempted;
    document.getElementById('sbNotAnswered').textContent = notAnswered;
    document.getElementById('sbNotVisited').textContent = notVisited;
    document.getElementById('sbMarked').textContent = markedCount;
    document.getElementById('sbCorrect').textContent = correctCount;
    document.getElementById('sbWrong').textContent = wrongCount;
    const marks = correctCount * 1 - wrongCount * 0.25;
    document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
    visited[currentQ] = true;
    const q = questions[currentQ];
    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
        let cls = 'option';
        if (userAnswers[currentQ] !== null) {
            cls += ' disabled';
            if (oi === q.ans) cls += ' correct-ans';
            else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
        }
        optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
    });

    let fbHTML = '';
    if (userAnswers[currentQ] !== null) {
        const isCorrect = userAnswers[currentQ] === q.ans;
        fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
            ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
            ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
        </div>`;
    }

    questionBox.innerHTML = `
        <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
        <div>${optsHTML}</div>
        ${fbHTML}
    `;

    document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
    document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
    document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

    updatePalette();
    updateStats();
}

function selectAnswer(optIdx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = optIdx;
    if (optIdx === questions[currentQ].ans) correctCount++;
    else wrongCount++;
    renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
    const marks = correctCount * 1 - wrongCount * 0.25;
    const percent = ((marks / totalQ) * 100).toFixed(2);
    document.getElementById('rTotal').textContent = totalQ;
    document.getElementById('rCorrect').textContent = correctCount;
    document.getElementById('rWrong').textContent = wrongCount;
    document.getElementById('rMarks').textContent = marks.toFixed(2);
    document.getElementById('rPercent').textContent = percent + '%';
    document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
    if (!confirm('Are you sure you want to reset the quiz?')) return;
    for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
    correctCount = 0; wrongCount = 0; currentQ = 0;
    document.getElementById('resultModal').classList.remove('show');
    renderQuestion();
}

renderPalette();
renderQuestion();

const CHAPTER_NUM = 31; // ⚠️ 12th Class Chapter 12 is Chapter 31 in Dashboard

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
<script src="results-save.js"></script>
</body>
