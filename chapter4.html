<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 4: Animal Kingdom - CBT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a202c; line-height: 1.6; padding: 10px; }
  .main-container { display: flex; max-width: 1400px; margin: 0 auto; gap: 15px; height: calc(100vh - 20px); }
  .sidebar { width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 15px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  .sidebar h3 { color: #2b6cb0; font-size: 16px; margin-bottom: 10px; text-align: center; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
  .stat-box { background: #ebf8ff; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; }
  .stat-box .num { font-size: 18px; font-weight: 700; color: #2c5282; }
  .stat-box .lbl { font-size: 11px; color: #4a5568; }
  .stat-box.green { background: #f0fff4; } .stat-box.green .num { color: #22543d; }
  .stat-box.red { background: #fff5f5; } .stat-box.red .num { color: #742a2a; }
  .stat-box.orange { background: #fffaf0; } .stat-box.orange .num { color: #7b341e; }
  .stat-box.purple { background: #faf5ff; } .stat-box.purple .num { color: #44337a; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; font-size: 11px; justify-content: center; }
  .legend span { display: flex; align-items: center; gap: 3px; }
  .legend .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .dot.not-visited { background: #e2e8f0; border: 1px solid #a0aec0; }
  .dot.attempted { background: #38a169; }
  .dot.not-answered { background: #e53e3e; }
  .dot.marked { background: #805ad5; }
  .dot.answered-marked { background: #805ad5; border: 2px solid #38a169; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .palette-btn { width: 100%; aspect-ratio: 1; border: 1px solid #cbd5e0; border-radius: 6px; background: #f7fafc; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .palette-btn:hover { transform: scale(1.05); }
  .palette-btn.not-visited { background: #edf2f7; color: #4a5568; }
  .palette-btn.attempted { background: #38a169; color: #fff; border-color: #2f855a; }
  .palette-btn.not-answered { background: #e53e3e; color: #fff; border-color: #c53030; }
  .palette-btn.marked { background: #805ad5; color: #fff; border-color: #6b46c1; }
  .palette-btn.answered-marked { background: #805ad5; color: #fff; border: 3px solid #38a169; }
  .palette-btn.current { outline: 3px solid #4299e1; outline-offset: 1px; }
  .quiz-area { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
  .quiz-header h2 { color: #2b6cb0; font-size: 18px; }
  .q-counter { background: #4299e1; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }
  .question-box { flex: 1; margin-bottom: 15px; }
  .q-text { font-weight: 600; margin-bottom: 15px; font-size: 16px; line-height: 1.7; }
  .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
  .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }
  .option:hover { border-color: #90cdf4; background: #ebf8ff; }
  .option.correct-ans { border-color: #38a169; background: #c6f6d5; font-weight: 600; }
  .option.wrong-ans { border-color: #e53e3e; background: #fed7d7; }
  .option.disabled { pointer-events: none; opacity: 0.8; }
  .feedback { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
  .feedback.wrong-fb { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }
  .feedback .exp { margin-top: 6px; font-style: italic; color: #4a5568; }
  .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
  .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
  .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
  .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
  .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
  .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
  .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
  .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
  .result-item .label { font-size: 12px; color: #4a5568; }
  .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
  .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
  .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
  .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
  .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
  .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  @media (max-width: 850px) {
    .main-container { flex-direction: column; height: auto; }
    .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
    .sidebar.open { transform: translateY(0); }
    .mobile-palette-toggle { display: block; }
    .quiz-area { min-height: 500px; }
  }
</style>
</head>
<body>

<button class="mobile-palette-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<div class="main-container">
  <div class="sidebar">
    <h3>📋 Question Palette</h3>
    <div class="stats-grid">
      <div class="stat-box"><div class="num" id="sbTotal">0</div><div class="lbl">Total</div></div>
      <div class="stat-box green"><div class="num" id="sbAttempted">0</div><div class="lbl">Attempted</div></div>
      <div class="stat-box red"><div class="num" id="sbNotAnswered">0</div><div class="lbl">Not Answered</div></div>
      <div class="stat-box orange"><div class="num" id="sbNotVisited">0</div><div class="lbl">Not Visited</div></div>
      <div class="stat-box purple"><div class="num" id="sbMarked">0</div><div class="lbl">Marked</div></div>
      <div class="stat-box green"><div class="num" id="sbCorrect">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box red"><div class="num" id="sbWrong">0</div><div class="lbl">Wrong</div></div>
      <div class="stat-box"><div class="num" id="sbMarks">0</div><div class="lbl">Marks</div></div>
    </div>
    <div class="legend">
      <span><span class="dot not-visited"></span> Not Visited</span>
      <span><span class="dot attempted"></span> Attempted</span>
      <span><span class="dot not-answered"></span> Not Answered</span>
      <span><span class="dot marked"></span> Marked</span>
      <span><span class="dot answered-marked"></span> Ans & Marked</span>
    </div>
    <div class="palette" id="palette"></div>
  </div>
  <div class="quiz-area">
    <div class="quiz-header">
      <h2>📚 Animal Kingdom</h2>
      <div class="q-counter" id="qCounter">Q 1 / 0</div>
    </div>
    <div class="question-box" id="questionBox"></div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()">⬅ Previous</button>
      <button class="btn btn-warning" id="btnMark" onclick="toggleMark()">🔖 Mark for Review</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">Next ➡</button>
      <button class="btn btn-success" onclick="showResult()">📊 Submit & Result</button>
      <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <h2>📋 Final Result</h2>
    <div class="result-grid">
      <div class="result-item"><div class="label">Total</div><div class="value" id="rTotal">0</div></div>
      <div class="result-item green"><div class="label">Correct</div><div class="value" id="rCorrect">0</div></div>
      <div class="result-item red"><div class="label">Wrong</div><div class="value" id="rWrong">0</div></div>
      <div class="result-item orange"><div class="label">Marks</div><div class="value" id="rMarks">0</div></div>
      <div class="result-item purple"><div class="label">Percentage</div><div class="value" id="rPercent">0%</div></div>
    </div>
    <p style="font-size:13px; color:#718096;">Marking: +1 Correct | -0.25 Wrong</p>
    <br>
    <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">Close</button>
    <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset Quiz</button>
  </div>
</div>
<script src="keys.js"></script>
<script src="autosave.js"></script>
<script src="shuffle.js"></script>
<script>
const questions = [
  { q: "Which one is correct? I. Sponges : Cellular level of organization. II. Cnidaria: Tissue level of organization. III. Platyhelminthes: Organ level of organization. IV. Annelids, Arthropods, Molluscs, Echinoderms and Chordates : Organ system level of organization.", opts: ["All are correct", "II and IV are correct", "II and III are correct", "I and II are correct"], ans: 0, exp: "All are correct." },
  { q: "Choose the false option —", opts: ["Sponges: Mostly asymmetrical", "Cnidaria, Ctenophora and Adult Echinoderms : Radial symmetry", "Annelids, Arthropods, Molluscs and Chordates : Bilateral symmetry", "None of the above"], ans: 3, exp: "None of the above is false." },
  { q: "Diploblastic and Triploblastic are terms that describe —", opts: ["The number of invagination during development", "The number of heads during development", "The number of tissue layers during embryonic developments", "The number of cell types during development"], ans: 2, exp: "Number of tissue layers during embryonic development." },
  { q: "An undifferentiated layer present between ectoderm and endoderm is called —", opts: ["Mesoglea", "Mesoderm", "Mesentery", "Parenchyma"], ans: 0, exp: "Mesoglea." },
  { q: "Which one is correct? I. Diploblastic: Porifera, Coelenterates. II. Triploblastic: Platyhelminthes to chordates. III. Acoelomata : Porifers, Coelenterates, Platyhelminthes. IV. Pseudocoelomata : Aschelminthes / Round worms. V. Eucoelomata: Annelids to chordates.", opts: ["All are false", "All are correct", "I, II and V are correct", "Only V is correct"], ans: 1, exp: "All are correct." },
  { q: "Metamerism is the characteristic of —", opts: ["Platyhelminthes", "Mollusca", "Porifera", "Annelida (e.g. earthworm)"], ans: 3, exp: "Annelida." },
  { q: "Metamerism refers to —", opts: ["Mesoblastic development", "Occurrence of mesoderm", "Segmentation where external divisions correspond to internal divisions", "Metastasis"], ans: 2, exp: "Segmentation where external divisions correspond to internal divisions." },
  { q: "Which one is correct?", opts: ["Notochord is ectodermal in origin present in some animal", "Notochord is a mesodermally derived rod like structure formed on the dorsal side in embryonic development some animals", "Porifera to Echinodermata are non-chordates", "b and c"], ans: 3, exp: "b and c are correct." },
  { q: "Water exits from sponges through the —", opts: ["Osculum", "Ostia", "Spicules", "Choanocytes"], ans: 0, exp: "Osculum." },
  { q: "Sponges are —", opts: ["Mostly asymmetrical and usually marine", "Primitive multicellular with cellular grade of organization", "Members of porifera", "All"], ans: 3, exp: "All." },
  { q: "I. Tissue absent. II. Internal fertilization. III. Development is indirect (larval stage is present). IV. Spongocoelate with ostia (many) and single osculum and canal system. V. Sexes are hermaphrodite. The above characteristics belong to which of following —", opts: ["Cnidaria", "Porifera (sponges)", "Platyhelminthes", "Ctenophora"], ans: 1, exp: "Porifera." },
  { q: "Spongocoel and canal are lined by —", opts: ["Porocytes", "Choanocytes / Collar cells", "Spicules", "Amoebocytes"], ans: 1, exp: "Choanocytes." },
  { q: "Water → Ostia → Spongocoel → Osculum. The above pathway of water helps in —", opts: ["Food gathering", "Respiratory exchange", "Removal of waste", "All"], ans: 3, exp: "All." },
  { q: "Fresh water sponge is —", opts: ["Sycon (Scypha)", "Spongilla", "Euspongia (Bath sponges)", "All"], ans: 1, exp: "Spongilla." },
  { q: "Sponges show —", opts: ["Intracellular digestion", "A skeleton made up of spicules or spongia fibres", "Asexual reproduction by fragmentation", "All"], ans: 3, exp: "All." },
  { q: "Which of the following characteristics is not associated with members of Cnidaria / Coelenterate?", opts: ["Alternation of generation (metagenesis between polyp and Medusa)", "Nematocysts, Gastrovascular cavity, extracellular + intracellular digestion", "Nematocyst / Cnidoblast", "Triploblastic forms"], ans: 3, exp: "Cnidarians are diploblastic." },
  { q: "Which of the following is not a characteristic of the cnidarians?", opts: ["A central gastrovascular cavity with a single opening, hypostome", "Mostly marine, sessile or free swimming, radially symmetrical", "Show cellular level of organization", "Show tissue level of organization"], ans: 2, exp: "Cnidarians show tissue level, not cellular level." },
  { q: "Which of the following is true about the cnidoblasts / cnidocytes?", opts: ["They are present on tentacles and the body", "They are used for anchorage, defence and for capture the prey", "They contain stinging capsule or nematocysts", "All"], ans: 3, exp: "All." },
  { q: "Some cnidarian like coral e.g. Meandrina (Brain Coral) exoskeleton is composed of —", opts: ["Silicious", "CaCO₃", "Chitinous", "Proteinaceous"], ans: 1, exp: "CaCO₃." },
  { q: "Polyp is cylindrical and sessile. It is seen in —", opts: ["Hydra", "Adamsia", "Both a and b", "Aurelia (Jelly fish)"], ans: 2, exp: "Both a and b." },
  { q: "Medusa is umbrella shaped and free swimming. Which one has no medusa?", opts: ["Hydra", "Adamsia", "Both a and b", "Aurelia"], ans: 2, exp: "Both a and b." },
  { q: "The metagenesis is seen in —", opts: ["Hydra", "Adamsia (sea anemone)", "Aurelia", "Obelia"], ans: 3, exp: "Obelia." },
  { q: "The incorrect match —", opts: ["Portuguese man of war - Physalia", "Pennatula - Sea pen", "Gorgonia - Sea Fan", "Hydra - Sea Cucumber"], ans: 3, exp: "Hydra is not sea cucumber." },
  { q: "Comb jellies or sea walnuts are placed under —", opts: ["Cnidaria", "Ctenophora", "Echinodermata", "Annelida"], ans: 1, exp: "Ctenophora." },
  { q: "Select the correct one(s) for ctenophora —", opts: ["They have similarities with cnidaria", "They have 8 external rows of ciliated comb plates for locomotion", "Bioluminescence", "All"], ans: 3, exp: "All." },
  { q: "I. Extracellular and intracellular digestion. II. Exclusively marine, radially symmetrical, diploblastic, tissue level of organization. III. Bisexual, external fertilization and indirect development. IV. No asexual reproduction. V. Presence of 8 comb plates. The above characters are shown by —", opts: ["Cnidaria", "Porifera", "Ctenophora", "Rotifers"], ans: 2, exp: "Ctenophora." },
  { q: "Pleurobrachia and Ctenoplana are —", opts: ["Sponges", "Ctenophores", "Flatworms", "Roundworms"], ans: 1, exp: "Ctenophores." },
  { q: "Platyhelminthes are —", opts: ["Roundworms", "Flatworms", "Blindworms", "Pinworms"], ans: 1, exp: "Flatworms." },
  { q: "Which of the following is not characteristic to platyhelminthes?", opts: ["Triploblastic", "Acoelomate", "Bilateral symmetry", "Parasitism exclusively"], ans: 3, exp: "Not all are parasites." },
  { q: "What is common among tapeworms (Taenia), Fasciola (liver fluke) and Planaria?", opts: ["All are coelomate", "All are found in gut", "All have flattened bodies", "All are free living"], ans: 2, exp: "All have flattened bodies." },
  { q: "Choose the correct option for flatworms —", opts: ["Flame cells are excretory organ and osmoregulatory", "Mostly endoparasites", "Bisexual, internal fertilization, many larval stage", "All"], ans: 3, exp: "All." },
  { q: "Parasitic adaptations of flatworms is —", opts: ["Hooks and suckers are present", "Absorption of food through body surface", "Both a and b", "Complex digestive system"], ans: 2, exp: "Both a and b." },
  { q: "Which one is not a Aschelminthes?", opts: ["Ascaris (Roundworm)", "Wuchereria (Filarial worm)", "Ancylostoma (Hookworm)", "Flatworm"], ans: 3, exp: "Flatworm." },
  { q: "Common character between flatworms, roundworms and earthworms is —", opts: ["Parasitism", "Acoelomate nature", "Triploblastic", "Pseudocoelomate"], ans: 2, exp: "Triploblastic." },
  { q: "Aschelminthes are —", opts: ["Free-living, aquatic, terrestrial or parasites in animals and plants", "With complete alimentary canal with muscular pharynx; Excretory tube with pore", "Are dioecious; showing sexual dimorphism, internal fertilization, direct or indirect development", "All"], ans: 3, exp: "All." },
  { q: "All Aschelminthes are called roundworms because —", opts: ["Their larvae are round in shape", "Their body is round like disc", "Their stomach is round shaped", "Their thread like body is circular in cross section"], ans: 3, exp: "Their thread like body is circular in cross section." },
  { q: "The phylum name Annelida is based on —", opts: ["Nephridia", "Metameres / segments", "Parapodia", "Antenna"], ans: 1, exp: "Metameres / segments." },
  { q: "True coelom appeared first in the course of evolution of —", opts: ["Aschelminthes", "Chordata", "Echinodermata", "Annelida"], ans: 3, exp: "Annelida." },
  { q: "Which one is blood sucker —", opts: ["Nereis", "Pheretima (Earthworm)", "Hirudinaria (Leech)", "All"], ans: 2, exp: "Hirudinaria (Leech)." },
  { q: "Choose the correct option —", opts: ["A closed circular system - Annelida", "Nereis - Aquatic, Dioecious", "Pheretima and Leech - Monoecious", "All"], ans: 3, exp: "All." },
  { q: "A feature absent in annelids is —", opts: ["Nephridia (Osmoregulatory + excretory organ)", "Lateral swimming appendages in aquatic forms like Nereis", "Longitudinal and circular muscles helping in locomotion", "Pseudocoelom"], ans: 3, exp: "Pseudocoelom." },
  { q: "Annelids —", opts: ["Are aquatic (marine, freshwater), terrestrial, freeliving and sometimes parasite", "Have neural system which consists of paired ganglia connected by lateral nerves to double ventral nerve cord", "Non-segmented", "a and b"], ans: 3, exp: "a and b." },
  { q: "Which one is the largest phylum of animalia?", opts: ["Annelida", "Arthropoda", "Chordata", "Mollusca"], ans: 1, exp: "Arthropoda." },
  { q: "Over 2/3 of all named species on earth belong to —", opts: ["Arthropoda", "Annelida", "Chordata", "Flatworms"], ans: 0, exp: "Arthropoda." },
  { q: "Economically important insects are —", opts: ["Apis (Honey bee)", "Bombyx (Silkworm)", "Laccifer (Lac insect)", "All"], ans: 3, exp: "All." },
  { q: "Which mosquito acts as vector?", opts: ["Anopheles", "Culex", "Aedes", "All"], ans: 3, exp: "All." },
  { q: "Which one is living fossil?", opts: ["Limulus (King crab)", "Locusta (Locust) - a gregarious pest", "Both", "None"], ans: 0, exp: "Limulus." },
  { q: "Arthropods have sense organs like —", opts: ["Antennae", "Simple and compound eyes", "Statocysts for balance", "All"], ans: 3, exp: "All." },
  { q: "In Arthropods respiratory organs are —", opts: ["Gills", "Book Gills", "Book lungs or Trachea", "All"], ans: 3, exp: "All." },
  { q: "You have discovered an animal having following characters like Triploblastic, bilateral symmetry coelomate, chitinous exoskeleton, head + Thorax and abdomen as body parts, jointed appendages. You would like to place the animal under —", opts: ["Tetrapoda", "Arthropoda", "Annelida", "Hemichordata"], ans: 1, exp: "Arthropoda." },
  { q: "In Arthropods excretion takes place through —", opts: ["General body surface", "Flame cells", "Malpighian tubules", "Nephridia"], ans: 2, exp: "Malpighian tubules." },
  { q: "Arthropods —", opts: ["Are mostly dioecious", "Are mostly oviparous", "Show usually internal fertilization and direct or indirect development", "All"], ans: 3, exp: "All." },
  { q: "Which one is the second largest animal phylum?", opts: ["Mollusca", "Arthopoda", "Chordata", "Cnidaria"], ans: 0, exp: "Mollusca." },
  { q: "In Molluscs mouth contains a file like rasping organ for feeding called —", opts: ["Operculum", "Mantle", "Hump", "Radula"], ans: 3, exp: "Radula." },
  { q: "Molluscs are —", opts: ["Unsegmented", "Soft bodied", "Shelled", "All of the above"], ans: 3, exp: "All of the above." },
  { q: "The main body parts common to all molluscs are the —", opts: ["Foot, Radula and the Mantle", "Foot, Visceral mass (hump) and mantle", "Visceral mass, Mantle, shell", "Foot, Radula, Visceral mass"], ans: 1, exp: "Foot, Visceral mass (hump) and mantle." },
  { q: "The space between the visceral hump and dorsal spongy skin is called _____ in which ____ are present in case of molluscs", opts: ["Mantle cavity, gill", "Body cavity and shell", "Viscera and shell", "Shell and Viscera"], ans: 0, exp: "Mantle cavity, gill." },

}

function updatePalette() {
  for (let i = 0; i < totalQ; i++) {
    const btn = document.getElementById('pal-' + i);
    if (!btn) continue;
    btn.className = 'palette-btn';
    if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
    else if (marked[i]) btn.classList.add('marked');
    else if (userAnswers[i] !== null) btn.classList.add('attempted');
    else if (visited[i]) btn.classList.add('not-answered');
    else btn.classList.add('not-visited');
    if (i === currentQ) btn.classList.add('current');
  }
}

function updateStats() {
  let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
  for (let i = 0; i < totalQ; i++) {
    if (userAnswers[i] !== null) attempted++;
    else if (visited[i]) notAnswered++;
    else notVisited++;
    if (marked[i]) markedCount++;
  }
  document.getElementById('sbTotal').textContent = totalQ;
  document.getElementById('sbAttempted').textContent = attempted;
  document.getElementById('sbNotAnswered').textContent = notAnswered;
  document.getElementById('sbNotVisited').textContent = notVisited;
  document.getElementById('sbMarked').textContent = markedCount;
  document.getElementById('sbCorrect').textContent = correctCount;
  document.getElementById('sbWrong').textContent = wrongCount;
  const marks = correctCount * 1 - wrongCount * 0.25;
  document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
  visited[currentQ] = true;
  const q = questions[currentQ];
  let optsHTML = '';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (oi === q.ans) cls += ' correct-ans';
      else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
    }
    optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
  });

  let fbHTML = '';
  if (userAnswers[currentQ] !== null) {
    const isCorrect = userAnswers[currentQ] === q.ans;
    fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
      ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
    </div>`;
  }

  questionBox.innerHTML = `
    <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
    <div>${optsHTML}</div>
    ${fbHTML}
  `;

  document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
  document.getElementById('btnPrev').disabled = currentQ === 0;
  document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
  document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
  document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

  updatePalette();
  updateStats();
}

function selectAnswer(optIdx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = optIdx;
  if (optIdx === questions[currentQ].ans) correctCount++;
  else wrongCount++;
  renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
  const marks = correctCount * 1 - wrongCount * 0.25;
  const percent = ((marks / totalQ) * 100).toFixed(2);
  document.getElementById('rTotal').textContent = totalQ;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rMarks').textContent = marks.toFixed(2);
  document.getElementById('rPercent').textContent = percent + '%';
  document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
  if (!confirm('Are you sure you want to reset the quiz?')) return;
  for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
  correctCount = 0; wrongCount = 0; currentQ = 0;
  document.getElementById('resultModal').classList.remove('show');
  renderQuestion();
}

renderPalette();
renderQuestion();

// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 4; // ⚠️ Chapter number (Yahan 4 hai)

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
