<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 1: The Living World - CBT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a202c; line-height: 1.6; padding: 10px; }
        .main-container { display: flex; max-width: 1400px; margin: 0 auto; gap: 15px; height: calc(100vh - 20px); }
        .sidebar { width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 15px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar h3 { color: #2b6cb0; font-size: 16px; margin-bottom: 10px; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-box { background: #ebf8ff; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; }
        .stat-box .num { font-size: 18px; font-weight: 700; color: #2c5282; }
        .stat-box .lbl { font-size: 11px; color: #4a5568; }
        .stat-box.green { background: #f0fff4; } .stat-box.green .num { color: #22543d; }
        .stat-box.red { background: #fff5f5; } .stat-box.red .num { color: #742a2a; }
        .stat-box.orange { background: #fffaf0; } .stat-box.orange .num { color: #7b341e; }
        .stat-box.purple { background: #faf5ff; } .stat-box.purple .num { color: #44337a; }
        .legend { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; font-size: 11px; justify-content: center; }
        .legend span { display: flex; align-items: center; gap: 3px; }
        .legend .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        .dot.not-visited { background: #e2e8f0; border: 1px solid #a0aec0; }
        .dot.attempted { background: #38a169; }
        .dot.not-answered { background: #e53e3e; }
        .dot.marked { background: #805ad5; }
        .dot.answered-marked { background: #805ad5; border: 2px solid #38a169; }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .palette-btn { width: 100%; aspect-ratio: 1; border: 1px solid #cbd5e0; border-radius: 6px; background: #f7fafc; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
        .palette-btn:hover { transform: scale(1.05); }
        .palette-btn.not-visited { background: #edf2f7; color: #4a5568; }
        .palette-btn.attempted { background: #38a169; color: #fff; border-color: #2f855a; }
        .palette-btn.not-answered { background: #e53e3e; color: #fff; border-color: #c53030; }
        .palette-btn.marked { background: #805ad5; color: #fff; border-color: #6b46c1; }
        .palette-btn.answered-marked { background: #805ad5; color: #fff; border: 3px solid #38a169; }
        .palette-btn.current { outline: 3px solid #4299e1; outline-offset: 1px; }
        .quiz-area { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .quiz-header h2 { color: #2b6cb0; font-size: 18px; }
        .q-counter { background: #4299e1; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        .question-box { flex: 1; margin-bottom: 15px; }
        .q-text { font-weight: 600; margin-bottom: 15px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
        .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
        .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }
        .option:hover { border-color: #90cdf4; background: #ebf8ff; }
        .option.correct-ans { border-color: #38a169; background: #c6f6d5; font-weight: 600; }
        .option.wrong-ans { border-color: #e53e3e; background: #fed7d7; }
        .option.disabled { pointer-events: none; opacity: 0.8; }
        .feedback { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct-fb { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
        .feedback.wrong-fb { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }
        .feedback .exp { margin-top: 6px; font-style: italic; color: #4a5568; }
        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
        .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
        .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
        .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
        .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
        .result-item .label { font-size: 12px; color: #4a5568; }
        .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
        .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
        .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
        .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
        .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
        .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        @media (max-width: 850px) {
            .main-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
            .sidebar.open { transform: translateY(0); }
            .mobile-palette-toggle { display: block; }
            .quiz-area { min-height: 500px; }
        }
    </style>
</head>
<body>

<button class="mobile-palette-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<div class="main-container">
    <div class="sidebar">
        <h3>📋 Question Palette</h3>
        <div class="stats-grid">
            <div class="stat-box"><div class="num" id="sbTotal">0</div><div class="lbl">Total</div></div>
            <div class="stat-box green"><div class="num" id="sbAttempted">0</div><div class="lbl">Attempted</div></div>
            <div class="stat-box red"><div class="num" id="sbNotAnswered">0</div><div class="lbl">Not Answered</div></div>
            <div class="stat-box orange"><div class="num" id="sbNotVisited">0</div><div class="lbl">Not Visited</div></div>
            <div class="stat-box purple"><div class="num" id="sbMarked">0</div><div class="lbl">Marked</div></div>
            <div class="stat-box green"><div class="num" id="sbCorrect">0</div><div class="lbl">Correct</div></div>
            <div class="stat-box red"><div class="num" id="sbWrong">0</div><div class="lbl">Wrong</div></div>
            <div class="stat-box"><div class="num" id="sbMarks">0</div><div class="lbl">Marks</div></div>
        </div>
        <div class="legend">
            <span><span class="dot not-visited"></span> Not Visited</span>
            <span><span class="dot attempted"></span> Attempted</span>
            <span><span class="dot not-answered"></span> Not Answered</span>
            <span><span class="dot marked"></span> Marked</span>
            <span><span class="dot answered-marked"></span> Ans & Marked</span>
        </div>
        <div class="palette" id="palette"></div>
    </div>
    <div class="quiz-area">
        <div class="quiz-header">
            <h2>📚 Chapter 1: The Living World</h2>
            <div class="q-counter" id="qCounter">Q 1 / 0</div>
        </div>
        <div class="question-box" id="questionBox"></div>
        <div class="nav-buttons">
            <button class="btn btn-secondary" id="btnPrev" onclick="prevQuestion()">⬅ Previous</button>
            <button class="btn btn-warning" id="btnMark" onclick="toggleMark()">🔖 Mark for Review</button>
            <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">Next ➡</button>
            <button class="btn btn-success" onclick="showResult()">📊 Submit & Result</button>
            <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="resultModal">
    <div class="modal-box">
        <h2>📋 Final Result</h2>
        <div class="result-grid">
            <div class="result-item"><div class="label">Total</div><div class="value" id="rTotal">0</div></div>
            <div class="result-item green"><div class="label">Correct</div><div class="value" id="rCorrect">0</div></div>
            <div class="result-item red"><div class="label">Wrong</div><div class="value" id="rWrong">0</div></div>
            <div class="result-item orange"><div class="label">Marks</div><div class="value" id="rMarks">0</div></div>
            <div class="result-item purple"><div class="label">Percentage</div><div class="value" id="rPercent">0%</div></div>
        </div>
        <p style="font-size:13px; color:#718096;">Marking: +1 Correct | -0.25 Wrong</p>
        <br>
        <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">Close</button>
        <button class="btn btn-danger" onclick="resetQuiz()">🔄 Reset Quiz</button>
    </div>
</div>
<script src="keys.js"></script>
<script>
const questions = [
  { q: "I. Increase in mass, II. Differentiation, III. Increase in number of individuals, IV. Response to stimuli. Which two points are known as the twin characteristics of growth?", opts: ["I and II", "I and IV", "II and III", "I and III"], ans: 3, exp: "Growth and reproduction are twin characteristics; increase in mass and increase in number are twin characteristics of growth." },
  { q: "Cell division occurs in plants and in animals —", opts: ["Continuously, only upto a certain age", "Only upto a certain age, continuously", "Continuously, never", "Once, twice"], ans: 0, exp: "Plants show continuous growth throughout life; animals grow only up to a certain age." },
  { q: "Generally growth and reproduction are —", opts: ["Mutually inclusive events", "Mutually exclusive events", "Either a or b", "None"], ans: 1, exp: "Growth and reproduction are mutually exclusive in higher plants and animals." },
  { q: "Which set of organisms multiply by fragmentation?", opts: ["Earthworm, Amoeba, fungi", "Earthworm, fungi, bacteria", "Fungi, filamentous algae, protonema of mosses", "Amoeba, Hydra, bacteria"], ans: 2, exp: "Fungi, filamentous algae and protonema of mosses multiply by fragmentation." },
  { q: "Which of the following organisms do not reproduce?", opts: ["Mules", "Sterile worker bees", "both a and b", "None"], ans: 2, exp: "Mules and sterile worker bees do not reproduce." },
  { q: "Metabolic reactions take place —", opts: ["In isolated cell-free systems", "In living systems", "Both a and b", "Either a or b"], ans: 2, exp: "Metabolic reactions occur both in isolated cell-free systems and in living systems." },
  { q: "Organisms that can respond to stimuli are —", opts: ["Eukaryotes only", "Prokaryotes only", "Both Prokaryotes and eukaryotes", "Those with a well developed nervous system"], ans: 2, exp: "Both prokaryotes and eukaryotes respond to stimuli." },
  { q: "I. Growth, II. Reproduction, III. Response to stimuli, IV. Metabolism, V. Cellular organisation. Which of the above features are generally characteristic of life?", opts: ["I, II, IV, V", "All", "II, III, IV", "I, II, III, V"], ans: 1, exp: "All the listed features are characteristic of life." },
  { q: "Growth, development and functioning of living body is due to —", opts: ["Order", "Homeostasis", "Metabolism", "Adaptations"], ans: 2, exp: "Metabolism is responsible for growth, development and functioning." },
  { q: "Which type of organisation is found in only living beings?", opts: ["Atomic", "Molecular", "Mixture", "Subcellular"], ans: 3, exp: "Subcellular organisation is found only in living beings." },
  { q: "Organisation levels in living beings are —", opts: ["Subcellular → cellular → individual → community → population", "Atomic → molecular → subcellular → cellular → tissue → organ → individual", "Cellular → subcellular → individual → population → community", "Molecular → atomic → cellular → tissue → organ → individual"], ans: 1, exp: "Correct order: Atomic → molecular → subcellular → cellular → tissue → organ → individual." },
  { q: "Given below are assertion and reason. Point out if both are true and the reason is correct explanation (I), both are true but reason is not correct explanation (II), assertion is true but reason is wrong (III) and both are wrong (IV). Assertion: Reproduction is not an all-inclusive defining characteristic of living organisms. Reason: It avoids over-crowding caused by continuous reproduction.", opts: ["I", "II", "III", "IV"], ans: 0, exp: "Both assertion and reason are true and reason correctly explains assertion." },
  { q: "Biological organisation begins at —", opts: ["Cellular level", "Atomic level", "Organismic level", "Submicroscopic molecular level"], ans: 3, exp: "Biological organisation begins at submicroscopic molecular level." },
  { q: "A living organism can be exceptionally differentiated from a nonliving thing on the basis of its ability for —", opts: ["reproduction", "Growth and movement", "Responsiveness to touch", "Interaction with environment and progressive evolution"], ans: 0, exp: "Reproduction is the most defining characteristic." },
  { q: "Linnaeus evolved a system of nomenclature called —", opts: ["Mononomial", "Vernacular", "Binomial", "Polynomial"], ans: 2, exp: "Linnaeus gave binomial nomenclature." },
  { q: "Which one is the species?", opts: ["Carnivora", "Canis", "familiaris", "Canis familiaris"], ans: 3, exp: "Canis familiaris is the species name." },
  { q: "Binomial nomenclature seems to be difficult because a scientific name is derived from —", opts: ["English", "Sanskrit", "Latin", "French"], ans: 2, exp: "Scientific names are in Latin." },
  { q: "Two plants are taxonomically related if —", opts: ["They store carbohydrate in the same type of molecule", "Both obtain energy from hydrolysis of ATP into ADP and inorganic phosphate", "Both have similarly lobed palmate leaves", "Both have pinnately veined leaves"], ans: 0, exp: "Taxonomic relationship is based on biochemical similarities." },
  { q: "A group of plants or animals with similar traits of any rank is —", opts: ["Species", "Genus", "Order", "Taxon"], ans: 3, exp: "Taxon is a group of any rank." },
  { q: "Binomial nomenclature means —", opts: ["One name given by two scientists", "One scientific name consisting of a generic and specific epithet", "Two names, one latinised, other of a person", "Two names, one scientific, other local"], ans: 1, exp: "Binomial nomenclature = generic name + specific epithet." },
  { q: "Basic unit or smallest taxon of taxonomy/classification is —", opts: ["Species", "Kingdom", "Family", "Variety"], ans: 0, exp: "Species is the basic unit." },
  { q: "Father of taxonomy is —", opts: ["De Candolle", "Hooker", "Linnaeus", "Aristotle"], ans: 2, exp: "Linnaeus is father of taxonomy." },
  { q: "A scientist connected with the study of variations, evolution and origin along with classification is known as —", opts: ["Classical taxonomist", "Herbal taxonomist", "Modern taxonomist", "New taxonomist"], ans: 2, exp: "Modern taxonomist." },
  { q: "Linnaeus system of classification was based on —", opts: ["Morphology", "Ecology", "Embryology", "Cytology"], ans: 0, exp: "Based on morphology." },
  { q: "First act in taxonomy is —", opts: ["Description", "Identification", "Naming", "Classification"], ans: 1, exp: "Identification is the first act." },
  { q: "Taxonomy based on determination of genetic relationships is —", opts: ["Cytotaxonomy", "Numerical taxonomy", "Biochemical taxonomy", "Experimental taxonomy"], ans: 3, exp: "Experimental taxonomy." },
  { q: "A group of interbreeding organisms is —", opts: ["Genus", "Family", "Order", "Species"], ans: 3, exp: "Species is a group of interbreeding organisms." },
  { q: "A taxon is —", opts: ["A group of related families", "A group of related species", "A type of living organisms", "A taxonomic group of any ranking"], ans: 3, exp: "Taxon is a taxonomic group of any ranking." },
  { q: "Branch connected with nomenclature, identification and classification is —", opts: ["Ecology", "Taxonomy", "Morphology", "Physiology"], ans: 1, exp: "Taxonomy." },
  { q: "Sequence of taxonomic categories is —", opts: ["Class - Phylum - Tribe - Order - Family - Genus - Species", "Division - Class - Family - Tribe - Order - Genus - Species", "Division - Class - Order - Family - Tribe - Genus - Species", "Phylum - Order - Class - Tribe - Family - Genus - Species"], ans: 2, exp: "Division - Class - Order - Family - Tribe - Genus - Species." },
  { q: "The third name in trinomial nomenclature is —", opts: ["Species", "Subgenus", "Subspecies", "Ecotype"], ans: 2, exp: "Subspecies." },
  { q: "In nomenclature —", opts: ["Both genus and species are printed in italics", "Genus and species may be of same name", "Both in genus & species, the first letter is capital", "Genus is written after the species"], ans: 0, exp: "Both genus and species are italicized." },
  { q: "In fish, Catla catla the specific name is identical with the generic name, thus it is an example of —", opts: ["antonym", "tautonym", "synonym", "homonym"], ans: 1, exp: "Tautonym." },
  { q: "Species A and species B are in the same phylum. Species A and species C, but not species B, are in the same order. From this information you can conclude that —", opts: ["species C could be in the same class as species A and B", "all three species are members of the same genus", "all three species are not members of the same phylum", "species A and species B are in the same family"], ans: 0, exp: "Species C could be in same class." },
  { q: "Which one of the following is not a correct statement?", opts: ["Herbarium houses dried, pressed and preserved plant specimens", "Botanical gardens have collection of living plants for reference", "A museum has collection of photographs of plants and animals", "Key is a taxonomic aid for identification of specimens"], ans: 2, exp: "Museum has preserved specimens, not photographs." },
  { q: "Mayer's biological concepts of species is mainly based on —", opts: ["Morphological traits", "Reproductive isolation", "Modes of reproduction", "Morphology and reproduction"], ans: 1, exp: "Reproductive isolation." },
  { q: "Which of the following statements best describes 'emergent properties'?", opts: ["The properties of individual molecules which perform a specific chemical function", "The function of a group of molecules is more than the abilities of a single molecule in the group", "The magical interaction of molecules in water", "All of these statements are examples of 'emergent properties'"], ans: 1, exp: "Emergent properties." },
  { q: "'Properties of cellular organelles are not present in the molecular constituents of the organelle but arise as a result of interactions among the molecular components comprising the organelle. These interactions result in emergent properties at a higher level of organisation'. The above statement best describes the —", opts: ["emergent properties", "Individual properties", "synergistic properties", "None"], ans: 0, exp: "Emergent properties." },
  { q: "A taxonomic key used to identify organisms is labeled:", opts: ["phylogenetic key", "evergreen key", "dichotomous key", "none of the above"], ans: 2, exp: "Dichotomous key." },
  { q: "Which one of the following has least similar characters?", opts: ["Family", "Class", "Genus", "Species"], ans: 1, exp: "Class has least similar characters." },
  { q: "On which of the following, five kingdom classification is based?", opts: ["Cell wall", "Genetic material", "Types of organelles", "Mode of nutrition"], ans: 3, exp: "Mode of nutrition." },
  { q: "Number of criteria used in classifying organisms in five-kingdom classification is —", opts: ["5", "4", "3", "2"], ans: 0, exp: "5 criteria." },
  { q: "Which of the following is less general in characters as compared to genus?", opts: ["Species", "Family", "Class", "Division"], ans: 0, exp: "Species." },
  { q: "What is correct?", opts: ["APIS INDICA", "Trypansoma gambiense", "Ficus Bengalensis", "Mangifera indica"], ans: 3, exp: "Mangifera indica is correctly written." },
  { q: "Descending arrangement of categories is called —", opts: ["Classification", "Taxonomy", "Hierarchy", "Key"], ans: 2, exp: "Hierarchy." },
  { q: "Nicotiana is —", opts: ["Variety", "Subspecies", "Species", "Genus"], ans: 3, exp: "Genus." },
  { q: "Which one is odd/not a category?", opts: ["Species", "Class", "Phylum", "Glumaceae / Malvaceae"], ans: 3, exp: "Glumaceae/Malvaceae are families, not categories." },
  { q: "In hierarchical classification, class is interpolated between —", opts: ["Family and genus", "Phylum and order", "Order and family", "Kingdom and phylum"], ans: 1, exp: "Phylum and order." },
  { q: "The disadvantage of using common names for species is that:", opts: ["the names may change", "one name does not apply universally", "one species may have several common names and one common name may be applied to two species", "all of the above"], ans: 3, exp: "All of the above." },
  { q: "Place of keeping and studying dry plants is —", opts: ["Arboretum", "Museum", "Vasculum", "Herbarium"], ans: 3, exp: "Herbarium." },
  { q: "Hierarchy of categories of Carolus Linnaeus had categories except —", opts: ["Genus and species", "Order and class", "Kingdom and class", "Phylum and family"], ans: 3, exp: "Phylum and family were not in Linnaeus's hierarchy." },
  { q: "An important function of botanical garden is —", opts: ["Providing beautiful area for recreation", "One can observe tropical plants over there", "They allow ex-situ conservation of germ plasm", "They provide natural habitat to wildlife"], ans: 2, exp: "Ex-situ conservation." },
  { q: "Two plants belong to same species if they —", opts: ["Have more than 90% similar genes", "Look similar and possess identical secondary metabolites", "Have similar number of chromosomes", "Can reproduce freely with each other and form seeds"], ans: 3, exp: "Reproduce freely and form seeds." },
  { q: "In Oryza sativa, sativa stands for —", opts: ["Name of species", "Genus", "Specific epithet", "Family"], ans: 2, exp: "Specific epithet." },
  { q: "An organism is in the same class but not in the same family. It may belong to same —", opts: ["Genus", "Species", "Variety", "Order"], ans: 3, exp: "Order." },
  { q: "Largest herbarium in India is at —", opts: ["National Botanical Garden, Lucknow", "Lloyd Botanical garden, Darjeeling", "Forest Research Institute, Dehradun", "Indian Botanical Garden, Sibpur"], ans: 3, exp: "Indian Botanical Garden, Sibpur." },
  { q: "The famous botanical garden of Kew is located in —", opts: ["India", "England", "Germany", "France"], ans: 1, exp: "England." },
  { q: "Related genera belong to same —", opts: ["Variety", "Family", "Species", "None of these"], ans: 1, exp: "Family." },
  { q: "Which is not applicable to biological species concept?", opts: ["Hybridisation", "Reproductive isolation", "Natural selection", "Gene pool"], ans: 0, exp: "Hybridisation." },
  { q: "Which taxonomic aid gives comprehensive account of complete compiled information of a genus or family at a particular time?", opts: ["Taxonomic key", "Herbarium", "Monograph", "Flora"], ans: 2, exp: "Monograph." },
  { q: "ICBN is —", opts: ["International Code of Biological Naming", "International Code of Botanical Nomenclature", "Internal Class of Biological Nomenclature", "International Classification of Biological Nomenclature"], ans: 1, exp: "International Code of Botanical Nomenclature." },

const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const currentUser = JSON.parse(localStorage.getItem('cbt_user') || '{}').name || 'Guest';
const saveId = currentUser + '_autosave_ch' + CHAPTER_NUM;
let saveTimeout = null;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
  palette.innerHTML = '';
  for (let i = 0; i < totalQ; i++) {
    const btn = document.createElement('button');
    btn.className = 'palette-btn';
    btn.textContent = i + 1;
    btn.id = 'pal-' + i;
    btn.onclick = () => goToQuestion(i);
    palette.appendChild(btn);
  }
}

function updatePalette() {
  for (let i = 0; i < totalQ; i++) {
    const btn = document.getElementById('pal-' + i);
    if (!btn) continue;
    btn.className = 'palette-btn';
    if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
    else if (marked[i]) btn.classList.add('marked');
    else if (userAnswers[i] !== null) btn.classList.add('attempted');
    else if (visited[i]) btn.classList.add('not-answered');
    else btn.classList.add('not-visited');
    if (i === currentQ) btn.classList.add('current');
  }
}

function updateStats() {
  let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
  for (let i = 0; i < totalQ; i++) {
    if (userAnswers[i] !== null) attempted++;
    else if (visited[i]) notAnswered++;
    else notVisited++;
    if (marked[i]) markedCount++;
  }
  document.getElementById('sbTotal').textContent = totalQ;
  document.getElementById('sbAttempted').textContent = attempted;
  document.getElementById('sbNotAnswered').textContent = notAnswered;
  document.getElementById('sbNotVisited').textContent = notVisited;
  document.getElementById('sbMarked').textContent = markedCount;
  document.getElementById('sbCorrect').textContent = correctCount;
  document.getElementById('sbWrong').textContent = wrongCount;
  const marks = correctCount * 1 - wrongCount * 0.25;
  document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
  visited[currentQ] = true;
  const q = questions[currentQ];
  let optsHTML = '';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (oi === q.ans) cls += ' correct-ans';
      else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
    }
    optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
  });

  let fbHTML = '';
  if (userAnswers[currentQ] !== null) {
    const isCorrect = userAnswers[currentQ] === q.ans;
    fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
      ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
    </div>`;
  }

  questionBox.innerHTML = `
    <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
    <div>${optsHTML}</div>
    ${fbHTML}
  `;

  document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
  document.getElementById('btnPrev').disabled = currentQ === 0;
  document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
  document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
  document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

  updatePalette();
  updateStats();
}

function selectAnswer(optIdx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = optIdx;
  if (optIdx === questions[currentQ].ans) correctCount++;
  else wrongCount++;
  triggerAutoSave();
  renderQuestion();
}

function goToQuestion(idx) { 
  currentQ = idx; 
  triggerAutoSave();
  renderQuestion(); 
  document.querySelector('.sidebar').classList.remove('open'); 
}
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; triggerAutoSave(); renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; triggerAutoSave(); renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; triggerAutoSave(); renderQuestion(); }

async function showResult() {
  const marks = correctCount * 1 - wrongCount * 0.25;
  const percent = ((marks / totalQ) * 100).toFixed(2);
  document.getElementById('rTotal').textContent = totalQ;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rMarks').textContent = marks.toFixed(2);
  document.getElementById('rPercent').textContent = percent + '%';
  document.getElementById('resultModal').classList.add('show');
  
  // Delete autosave data
  try {
    await window.fb.deleteDoc(window.fb.doc(window.fb.db, "autosave", saveId));
  } catch(e) { console.log(e); }

  // Save final result to Firebase
  try {
    const _currentUser = JSON.parse(localStorage.getItem('cbt_user') || '{}');
    await window.fb.addDoc(window.fb.collection(window.fb.db, "results"), {
      userName: _currentUser.name,
      userRole: _currentUser.role,
      chapterNum: CHAPTER_NUM,
      correct: correctCount,
      wrong: wrongCount,
      total: totalQ,
      marks: parseFloat(marks.toFixed(2)),
      percent: parseFloat(percent),
      timestamp: new Date().toISOString()
    });
    console.log("✅ Result saved to Firebase!");
  } catch(e) {
    console.error("Result save error:", e);
  }
}

function resetQuiz() {
  if (!confirm('Are you sure you want to reset the quiz?')) return;
  for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
  correctCount = 0; wrongCount = 0; currentQ = 0;
  document.getElementById('resultModal').classList.remove('show');
  triggerAutoSave();
  renderQuestion();
}

async function loadAutoSave() {
  try {
    const docRef = window.fb.doc(window.fb.db, "autosave", saveId);
    const docSnap = await window.fb.getDoc(docRef);
    
    if (docSnap.exists()) {
      const savedData = docSnap.data();
      if (savedData.answers) {
        for (let i = 0; i < totalQ; i++) {
          if (savedData.answers[i] !== undefined) {
            userAnswers[i] = savedData.answers[i];
            marked[i] = savedData.marked[i];
            visited[i] = savedData.visited[i];
            if (userAnswers[i] !== null) {
              if (userAnswers[i] === questions[i].ans) correctCount++;
              else wrongCount++;
            }
          }
        }
        if (savedData.currentQ !== undefined) {
          currentQ = savedData.currentQ;
        }
        renderQuestion();
        updateStats();
        console.log("✅ Pichla data wapas mil gaya!");
      }
    }
  } catch (e) {
    console.error("Load error:", e);
  }
}

function triggerAutoSave() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try {
      const docRef = window.fb.doc(window.fb.db, "autosave", saveId);
      await window.fb.setDoc(docRef, {
        answers: userAnswers,
        marked: marked,
        visited: visited,
        currentQ: currentQ,
        timestamp: new Date().toISOString()
      });
      console.log("💾 Data Firebase me save ho gaya");
    } catch(e) {
      console.error("Save error:", e);
    }
  }, 1000);
}
