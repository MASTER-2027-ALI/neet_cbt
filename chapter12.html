<script>
const questions = [
    { q: "1. Which of the following represents a correct ordering of the events that occur in the catabolism of glucose in absence of O2?", opts: ["Glycolysis; TCA cycle; oxidative phosphorylation", "Glycolysis; oxidative phosphorylation; TCA cycle", "Oxidative phosphorylation; TCA cycle; glycolysis", "Glycolysis; fermentation"], ans: 3, exp: "In the absence of O2, glucose is catabolised via glycolysis followed by fermentation." },
    { q: "2. Glycolytic pathway from glucose to pyruvic acid involves 10 reactions. Each individual reaction needs -", opts: ["One molecule of ATP", "One molecule of ADP", "One molecule of NAD", "One molecule of specific enzyme"], ans: 3, exp: "Each reaction of glycolysis requires a specific enzyme." },
    { q: "3. Glycolysis occurs in the _____ and produces _____ , which in the presence of O2 enters the ___ _", opts: ["Cytosol; pyruvate; mitochondrion", "Cytosol; glucose; mitochondrion", "Mitochondrion; pyruvate; chloroplast", "Chloroplast; glucose; cytosol"], ans: 0, exp: "Glycolysis occurs in cytosol, produces pyruvate which enters mitochondria." },
    { q: "4. Which metabolic pathway is a common pathway to both anaerobic and aerobic metabolism?", opts: ["TCA cycle", "ETS", "EMP pathway", "Kreb's cycle"], ans: 2, exp: "EMP pathway (glycolysis) is common to both." },
    { q: "5. ATP is-", opts: ["An energy currency", "a nucleotide", "formed in both respiration and photosynthesis", "All"], ans: 3, exp: "All are correct." },
    { q: "6. The end product of glycolysis is -", opts: ["pyruvate", "The starting point for TCA cycle", "The starting point for fermentation", "All"], ans: 3, exp: "All are correct." },
    { q: "7. 1st step (reaction) of glycolysis is -", opts: ["Oxidative step", "Reductive step", "Endergonic", "Exergonic"], ans: 2, exp: "The first step of glycolysis is endergonic (requires ATP)." },
    { q: "8. Glycolysis was discovered by -", opts: ["Embden", "Meyerhof", "Parnas", "All"], ans: 3, exp: "Glycolysis was discovered by Embden, Meyerhof and Parnas." },
    { q: "9. Glycolysis -", opts: ["Takes place in all living cells", "Causes partial oxidation of glucose (one molecule) to form 2 molecules of pyruvic acid and 2 ATP as net gain", "Uses 2 ATP at two steps", "All"], ans: 3, exp: "All are correct." },
    { q: "10. Respiration is -", opts: ["Anabolic + Exergonic", "Catabolic + Exergonic", "Catabolic + Endergonic", "Anabolic + Endergonic"], ans: 1, exp: "Respiration is catabolic and exergonic." },
    { q: "11. Usable energy of respiration is -", opts: ["used in charging biomolecules into activity", "Stored as heat", "Immediately consumed in cellular activities", "Trapped in ATP molecules"], ans: 3, exp: "Usable energy is trapped in ATP molecules." },
    { q: "12. Function of respiration is to -", opts: ["make ATP", "Make NADH", "Get rid of glucose", "Get rid of CO2"], ans: 0, exp: "The main function of respiration is to make ATP." },
    { q: "13. In Respiration-", opts: ["Dry wt decreases", "C-C bonds of complex compounds break through oxidation in cells", "Energy contained in the respiratory materials is released in a series of slow stepwise reactions controlled by enzymes", "All"], ans: 3, exp: "All are correct." },
    { q: "14. Which one performs both respiration and photosynthesis?", opts: ["Root cells", "Mesophyll", "Ovum of angiosperm", "Xylem parenchyma"], ans: 1, exp: "Mesophyll cells perform both respiration and photosynthesis." },
    { q: "15. For gaseous exchange plants have -", opts: ["Stomata", "Lenticels", "Perin", "All"], ans: 3, exp: "All are correct." },
    { q: "16. The reasons why plants can get along without respiratory organs are -", opts: ["Almost all living cells in a plant have their surfaces exposed to air", "Plants have little demand for gas exchange", "Taking care of its own gas exchange need by every part, very little transport of gases from one part to another", "All"], ans: 3, exp: "All are correct." },
    { q: "17. Why is a different enzyme involved in each step of glycolysis?", opts: ["Each step occurs in a different subcellular location", "Each step occurs in a different cell", "Each step involves a different change in potential energy", "Each step involves a different chemical reaction."], ans: 3, exp: "Each step involves a different chemical reaction." },
    { q: "18. Nearly every living organism uses glucose as a nutrient source of energy. Why?", opts: ["Glucose is the only molecule capable of providing the energy to produce ATP", "The structure of glucose is very similar to ATP", "Glucose has more potential energy than any other respiratory substrate", "The ability to harvest energy from glucose appeared very early in biological evolution"], ans: 3, exp: "The ability to harvest energy from glucose appeared very early in biological evolution." },
    { q: "19. Glycolysis is found in -", opts: ["Eukaryotic cells", "Anaerobic cells", "Virtually all cells", "Most muscle cells"], ans: 2, exp: "Glycolysis is found in virtually all cells." },
    { q: "20. How many molecules of O2 are used and how many CO2 comes out during the glycolytic breakdown of one glucose molecule?", opts: ["1; 2", "2; 1", "0; 0", "36; 6"], ans: 2, exp: "No O2 is used and no CO2 is released during glycolysis." },
    { q: "21. 3PGAld is oxidised during glycolysis. What happens to the hydrogen atoms and the e- that are removed during oxidation?", opts: ["They reduce NAD+", "They oxidise NAD+", "They are transferred to C3H4O3 (Pyruvic acid)", "They come out immediately in the form of H2O"], ans: 0, exp: "They reduce NAD+." },
    { q: "22. Which one is false for glycolysis?", opts: ["Substrate level phosphorylation occurs", "The end products are CO2 and H2O", "ATP is formed", "ATP is used"], ans: 1, exp: "The end products of glycolysis are pyruvate, not CO2 and H2O." },
    { q: "23. If glucose is labelled with 14C, what molecule will become radioactive as glycolysis and TCA cycle are completed.", opts: ["Water", "NADH", "ATP", "CO2"], ans: 3, exp: "CO2 will become radioactive." },
    { q: "24. Glycolysis occurs in ____ ; the TCA cycle occurs in _____ ; and ETC occurs in ____ _", opts: ["Mitochondrial matrix, cytosol; mitochondrial inner membrane", "Cytosol; mitochondrial matrix; mitochondrial inner membrane", "Mitochondrial outer membrane; cytosol; mitochondrial inner membrane", "Cytosol; outer chamber of mitochondria; inner chamber of mitochondria"], ans: 1, exp: "Glycolysis in cytosol, TCA in mitochondrial matrix, ETC in inner mitochondrial membrane." },
    { q: "25. What will happen to glycolytic pathway if a cell runs completely out of ATP -", opts: ["Glycolysis will speed up", "Glycolysis will be slow down", "Glycolysis will stop as first and third steps need ATP input", "Glycolysis will increase as energy will be supplied by NADH2"], ans: 2, exp: "Glycolysis will stop as first and third steps need ATP input." },
    { q: "26. During glycolysis, for each mole of glucose oxidised to pyruvate -", opts: ["6 moles of ATP are produced", "2 moles of NAD+ are produced", "2 moles of ATP are used, and 4 moles of ATP are produced", "No ATP is produced"], ans: 2, exp: "2 moles of ATP are used, and 4 moles of ATP are produced." },
    { q: "27. During glycolysis, the conversion of one mole of 3PGAld to C3H4O3 yield 2 moles of ATP. But the oxidation of glucose to C3H4O3 produces a total of 4 moles of ATP. Where do the remaining 2 moles of ATP come from?", opts: ["One mole of glucose gives 2 moles of 3PGAld", "Glycolysis produces 2NADH", "Fermentation of C3H4O3 produces 2ATP more", "2ATP are used in the conversion of glucose to 3PGAld"], ans: 0, exp: "One mole of glucose gives 2 moles of 3PGAld." },
    { q: "28. For glycolysis to continue, all cells require -", opts: ["O2", "Mitochondria", "ETS", "NAD+"], ans: 3, exp: "Cells require NAD+ for glycolysis to continue." },
    { q: "29. The oxidation of pyruvic acid to CO2 is called -", opts: ["Fermentation", "TCA/Citric acid cycle", "Glycolysis", "Oxidative phosphorylation"], ans: 1, exp: "TCA/Citric acid cycle." },
    { q: "30. During the energy-priming portion of glycolysis, the phosphates from ATP molecules are-", opts: ["Added to first and 6th carbon", "Added to 1st and 4th carbon", "Wasted, as an energy investment", "Used to make lactate"], ans: 0, exp: "Added to first and 6th carbon." },
    { q: "31. In the absence of O2 cells capable of fermentation -", opts: ["Accumulate glucose", "No longer produce ATP", "Accumulate pyruvate", "Oxidise NADH to produce NAD+"], ans: 3, exp: "Oxidise NADH to produce NAD+." },
    { q: "32. For bacteria to continue growing rapidly when they are shifted from an environment containing O2 to an anaerobic environment, they must-", opts: ["Produce more ATP per mole of glucose during glycolysis", "Produce ATP during oxidation of NADH", "Increase the rate of glycolysis", "Increase the rate of TCA cycle"], ans: 2, exp: "Increase the rate of glycolysis." },
    { q: "33. In alcoholic fermentation, NAD+ is produced during the-", opts: ["Reduction of acetyldehyde to ethanol", "Oxidation of glucose", "Oxidation of pyruvate to acetyl CoA", "Hydrolysis of ATP to ADP"], ans: 0, exp: "Reduction of acetyldehyde to ethanol." },
    { q: "34. The free energy released during oxidation of 3 PGAld to 1, 3 di PGA, is -", opts: ["Used to oxidise NADH", "Lost as heat", "Used to form ATP", "Used to reduce NAD+"], ans: 3, exp: "Used to reduce NAD+." },
    { q: "35. The results of first five reactions of the glycolytic pathway are -", opts: ["Adding phosphates, modifying sugars, and forming 3PGAld", "Removal of e- and H+ from glucose", "Oxidation of pyruvate and formation of acetyl CoA", "Oxidative step"], ans: 0, exp: "Adding phosphates, modifying sugars, and forming 3PGAld." },
    { q: "36. Fermentation always produces -", opts: ["AMP", "NAD+", "Pi", "DNA"], ans: 1, exp: "Fermentation produces NAD+." },
    { q: "37. Choose the correct combination between respiratory substrates and their respective RQs.\nCarbohydrate | Fat | Protein", opts: ["2 | 1 | 1", "0 | 1 | 1", "1 | 0.7 | 0.9", "0.5 | 0.5 | 0.5"], ans: 2, exp: "Carbohydrate RQ=1, Fat RQ=0.7, Protein RQ=0.9." },
    { q: "38. Fermentation takes place :", opts: ["Under anaerobic conditions in many prokaryotes and unicellular eukaryotes", "Under aerobic conditions in many prokaryotes and unicellular eukaryotes", "Under anaerobic conditions in all prokaryotes and unicellular eukaryotes", "Under aerobic conditions in all prokaryotes and unicellular eukaryotes"], ans: 0, exp: "Under anaerobic conditions in many prokaryotes and unicellular eukaryotes." },
    { q: "39. In order for glucose to be used as an energy source, it is necessary that -", opts: ["Glucose be formed from fructose", "Glucose be degraded to CO2", "2 molecules of ATP be Invested in the system", "None"], ans: 2, exp: "2 molecules of ATP be invested in the system." },
    { q: "40. Many species derives their energy from fermentation. The function of fermentation is to -", opts: ["Reduce NAD+", "Oxidise CO2", "Oxidise NADH + H+, ensuring a continued supply of ATP.", "Production of acetyl CoA"], ans: 2, exp: "Oxidise NADH + H+, ensuring a continued supply of ATP." },
    { q: "41. Which of the following cellular metabolic processes can occur in the presence or absence of O2?", opts: ["Glycolysis", "Fermentation", "TCA cycle", "Electron transport coupled with chemiosmosis"], ans: 0, exp: "Glycolysis can occur in both presence and absence of O2." },
    { q: "42. The main purpose of cellular respiration is to -", opts: ["Convert potential to kinetic energy", "Convert kinetic to potential energy", "Create energy in the cell", "Convert energy stored in the chemical bonds of glucose to an energy that the cell can use."], ans: 3, exp: "Convert energy stored in the chemical bonds of glucose to an energy that the cell can use." },
    { q: "43. If O2 is not present, yeast cells break down glucose to -", opts: ["CO2 + H2O", "CO2 + Lactic acid", "CO2 + Pyruvic acid", "C2H5OH and CO2"], ans: 3, exp: "C2H5OH and CO2." },
    { q: "44. NAD+ is-", opts: ["a protein", "an oxidising agent", "a reducing agent", "formed under only aerobic conditions"], ans: 1, exp: "NAD+ is an oxidising agent." },
    { q: "45. In terms of efficiency at converting the energy of glucose in ATP -", opts: ["aerobic glycolysis is better than TCA cycle", "eukaryotic cells are more efficient than prokaryotic cells", "Electron transport chain is not necessary for high efficiency", "Anaerobic conditions are much less efficient than aerobic"], ans: 3, exp: "Anaerobic conditions are much less efficient than aerobic." },
    { q: "46. Which of the following statements about cellular energy-harvesting pathway is false?", opts: ["Autotrophs can produce their own food but must obtain energy from it by glycolysis and cellular respiration", "Fermentation usually occurs under anaerobic conditions", "Pyruvate oxidation can only occur under aerobic conditions", "None"], ans: 3, exp: "All the given statements are true." },
    { q: "47. Which of the following statements regarding metabolic pathways is false?", opts: ["Many of the steps of glycolysis can run in reverse", "Starch, sucrose or glycogen must be hydrolysed before it can enter the glycolysis", "After fats are digested glycerol enters glycolysis by forming DHAP", "After fats digestion, fatty acids can no longer participate in cellular respiration"], ans: 3, exp: "After fats digestion, fatty acids can participate in cellular respiration." },
    { q: "49. In animal cells, like muscle, during exercise, when O2 is inadequate for cellular respiration, pyruvic acids is reduced into lactic acid by -", opts: ["O2", "Carboxylation", "lactate dehydrogenase", "All"], ans: 2, exp: "lactate dehydrogenase." },
    { q: "50. Pyruvate -> C2H5OH + CO2. The above reaction needs 2 enzymes named as -", opts: ["Pyruvate decarboxylase and alcohol dehydrogenase", "Pyruvate decarboxylase and enolase", "Pyruvate decarboxylase and pyruvate kinase", "Pyruvate carboxylase + Aldolase"], ans: 0, exp: "Pyruvate decarboxylase and alcohol dehydrogenase." },
    { q: "51. Which one is true?", opts: ["In absence of O2, fermentation regenerates the NAD+ needed for glycolysis", "Fermentation does not liberate all the energy available in each sugar molecule", "When alcohol cone. reaches 13%, the yeast cells become poisoned and die", "All"], ans: 3, exp: "All are correct." },

// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
    palette.innerHTML = '';
    for (let i = 0; i < totalQ; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = i + 1;
        btn.id = 'pal-' + i;
        btn.onclick = () => goToQuestion(i);
        palette.appendChild(btn);
    }
}

function updatePalette() {
    for (let i = 0; i < totalQ; i++) {
        const btn = document.getElementById('pal-' + i);
        if (!btn) continue;
        btn.className = 'palette-btn';
        if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
        else if (marked[i]) btn.classList.add('marked');
        else if (userAnswers[i] !== null) btn.classList.add('attempted');
        else if (visited[i]) btn.classList.add('not-answered');
        else btn.classList.add('not-visited');
        if (i === currentQ) btn.classList.add('current');
    }
}

function updateStats() {
    let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
    for (let i = 0; i < totalQ; i++) {
        if (userAnswers[i] !== null) attempted++;
        else if (visited[i]) notAnswered++;
        else notVisited++;
        if (marked[i]) markedCount++;
    }
    document.getElementById('sbTotal').textContent = totalQ;
    document.getElementById('sbAttempted').textContent = attempted;
    document.getElementById('sbNotAnswered').textContent = notAnswered;
    document.getElementById('sbNotVisited').textContent = notVisited;
    document.getElementById('sbMarked').textContent = markedCount;
    document.getElementById('sbCorrect').textContent = correctCount;
    document.getElementById('sbWrong').textContent = wrongCount;
    const marks = correctCount * 1 - wrongCount * 0.25;
    document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
    visited[currentQ] = true;
    const q = questions[currentQ];
    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
        let cls = 'option';
        if (userAnswers[currentQ] !== null) {
            cls += ' disabled';
            if (oi === q.ans) cls += ' correct-ans';
            else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
        }
        optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
    });

    let fbHTML = '';
    if (userAnswers[currentQ] !== null) {
        const isCorrect = userAnswers[currentQ] === q.ans;
        fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
            ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
            ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
        </div>`;
    }

    questionBox.innerHTML = `
        <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
        <div>${optsHTML}</div>
        ${fbHTML}
    `;

    document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
    document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
    document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

    updatePalette();
    updateStats();
}

function selectAnswer(optIdx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = optIdx;
    if (optIdx === questions[currentQ].ans) correctCount++;
    else wrongCount++;
    renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
    const marks = correctCount * 1 - wrongCount * 0.25;
    const percent = ((marks / totalQ) * 100).toFixed(2);
    document.getElementById('rTotal').textContent = totalQ;
    document.getElementById('rCorrect').textContent = correctCount;
    document.getElementById('rWrong').textContent = wrongCount;
    document.getElementById('rMarks').textContent = marks.toFixed(2);
    document.getElementById('rPercent').textContent = percent + '%';
    document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
    if (!confirm('Are you sure you want to reset the quiz?')) return;
    for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
    correctCount = 0; wrongCount = 0; currentQ = 0;
    document.getElementById('resultModal').classList.remove('show');
    renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 12; // ⚠️ Chapter number (Yahan 14 hai)

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
<script src="results-save.js"></script>
