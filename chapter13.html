    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a202c; line-height: 1.6; padding: 10px; }
        .main-container { display: flex; max-width: 1400px; margin: 0 auto; gap: 15px; height: calc(100vh - 20px); }
        .sidebar { width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 15px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
        .sidebar h3 { color: #2b6cb0; font-size: 16px; margin-bottom: 10px; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-box { background: #ebf8ff; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; }
        .stat-box .num { font-size: 18px; font-weight: 700; color: #2c5282; }
        .stat-box .lbl { font-size: 11px; color: #4a5568; }
        .stat-box.green { background: #f0fff4; } .stat-box.green .num { color: #22543d; }
        .stat-box.red { background: #fff5f5; } .stat-box.red .num { color: #742a2a; }
        .stat-box.orange { background: #fffaf0; } .stat-box.orange .num { color: #7b341e; }
        .stat-box.purple { background: #faf5ff; } .stat-box.purple .num { color: #44337a; }
        .legend { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; font-size: 11px; justify-content: center; }
        .legend span { display: flex; align-items: center; gap: 3px; }
        .legend .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
        .dot.not-visited { background: #e2e8f0; border: 1px solid #a0aec0; }
        .dot.attempted { background: #38a169; }
        .dot.not-answered { background: #e53e3e; }
        .dot.marked { background: #805ad5; }
        .dot.answered-marked { background: #805ad5; border: 2px solid #38a169; }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .palette-btn { width: 100%; aspect-ratio: 1; border: 1px solid #cbd5e0; border-radius: 6px; background: #f7fafc; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
        .palette-btn:hover { transform: scale(1.05); }
        .palette-btn.not-visited { background: #edf2f7; color: #4a5568; }
        .palette-btn.attempted { background: #38a169; color: #fff; border-color: #2f855a; }
        .palette-btn.not-answered { background: #e53e3e; color: #fff; border-color: #c53030; }
        .palette-btn.marked { background: #805ad5; color: #fff; border-color: #6b46c1; }
        .palette-btn.answered-marked { background: #805ad5; color: #fff; border: 3px solid #38a169; }
        .palette-btn.current { outline: 3px solid #4299e1; outline-offset: 1px; }
        .quiz-area { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .quiz-header h2 { color: #2b6cb0; font-size: 18px; }
        .q-counter { background: #4299e1; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }
        .question-box { flex: 1; margin-bottom: 15px; }
        .q-text { font-weight: 600; margin-bottom: 15px; font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
        .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
        .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }
        .option:hover { border-color: #90cdf4; background: #ebf8ff; }
        .option.correct-ans { border-color: #38a169; background: #c6f6d5; font-weight: 600; }
        .option.wrong-ans { border-color: #e53e3e; background: #fed7d7; }
        .option.disabled { pointer-events: none; opacity: 0.8; }
        .feedback { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
        .feedback.show { display: block; }
        .feedback.correct-fb { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
        .feedback.wrong-fb { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }
        .feedback .exp { margin-top: 6px; font-style: italic; color: #4a5568; }
        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
        .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
        .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
        .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
        .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
        .result-item .label { font-size: 12px; color: #4a5568; }
        .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
        .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
        .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
        .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
        .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
        .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        @media (max-width: 850px) {
            .main-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
            .sidebar.open { transform: translateY(0); }
            .mobile-palette-toggle { display: block; }
            .quiz-area { min-height: 500px; }
        }
    </style>
</head>

<script src="keys.js"></script>
<script>
const questions = [
    { q: "1. Which of the following is not the characteristic of growth of an organism?", opts: ["It is an irreversible permanent increase in size of a cell/its part/an individual cell", "It is accompanied by metabolic processes", "It is quantitative and intrinsic", "None of the above"], ans: 3, exp: "All the given statements are characteristics of growth." },
    { q: "2. Characteristic of plant growth includes which of the following -", opts: ["It is localised and generally determinate", "It is localized and generally indeterminate", "It is non-measurable", "It is diffused, determinate and non measurable"], ans: 1, exp: "Plant growth is localised and generally indeterminate." },
    { q: "3. The form of growth wherein new cells are always being added to the plant body by the activity of meristem is called -", opts: ["Open form of growth", "Close form of growth", "Diffused form of growth", "Discontinuous form of growth"], ans: 0, exp: "It is called open form of growth." },
    { q: "4. Select the incorrect option -", opts: ["Primary growth is the increase in girth of axis due to activity of Apical meristem", "Secondary growth is the increase in girth due to activity of lateral meristem (vascular cambium & cork cambium)", "Elongation of plant is the primary growth", "b and c"], ans: 0, exp: "Primary growth is the increase in length due to apical meristem, not girth." },
    { q: "5. Growth at cellular level, is principally a consequence in the amount of-", opts: ["Protoplasm", "Apoplast", "Cell wall", "Apoplasm"], ans: 0, exp: "Growth is principally a consequence of increase in the amount of protoplasm." },
    { q: "6. Which one(s) is more or less proportional to increase in protoplasm?", opts: ["Increase in fresh/dry weight", "Increase in length, area, volume", "Increase in cell number", "All"], ans: 3, exp: "All are correct." },
    { q: "7. I. One maize root cell can give rise to more than 17,500 cells.\nII. A cell in water melon can increase in size upto 350000 times\nIII. The growth of pollen tube is measured in length\nIV. The growth of the leaf is measured in term of volume", opts: ["I, II are correct", "III and IV are correct", "I and III are correct", "I, II and III are correct"], ans: 3, exp: "I, II and III are correct." },
    { q: "8. Real growth is -", opts: ["Protoplasmic growth", "Cell wall growth", "Growth in size", "Growth in volume"], ans: 0, exp: "Real growth is protoplasmic growth." },
    { q: "9. The period of growth is generally divided into -", opts: ["3 phases", "2 phases", "4 phases", "6 phases"], ans: 0, exp: "The period of growth is divided into 3 phases." },
    { q: "10. Which of the following points is shown by cell at the root or shoot apex -", opts: ["Rich in protoplasm, possesses large conspicuous triploid nucleus", "Cell wall is cellulosic, primary in nature and with abundant plasmodesmata", "Rich in protoplasm with large conspicuous nucleus", "b and c"], ans: 3, exp: "b and c are correct." },
    { q: "11. Maximal size in terms of wall thickening and protoplasmic modification are achieved by-", opts: ["Cells of divisional phase", "Cells of maturation phase", "Cells of elongation phase", "Cells of meristematic tissue"], ans: 1, exp: "Cells of maturation phase." },
    { q: "12. Increased vacuolation, cell enlargement and new cell wall deposition are the characteristics of cell in -", opts: ["divisional phase", "enlongation phase", "maturation phase", "differentiation phase"], ans: 1, exp: "Elongation phase." },
    { q: "13. Most of the tissues and cell types represent -", opts: ["Division phase", "Elongation phase", "Enlargement phase", "maturation phase"], ans: 3, exp: "Maturation phase." },
    { q: "14. Increase in growth per unit time is called -", opts: ["Exponential growth", "Intrinsic growth", "growth rate", "cell elongation"], ans: 2, exp: "Growth rate." },
    { q: "15. Exponential phase in growth is characterised by -", opts: ["enlargment of cells", "Constant increase in growth rate", "Maturation of cells", "a and b"], ans: 1, exp: "Constant increase in growth rate." },
    { q: "16. Arithmetic growth includes all except-", opts: ["constant growth rate", "It is found in root and shoot cells", "It is expressed as Lt = L0 + rt", "Its characteristic graph is sigmoid"], ans: 3, exp: "Arithmetic growth graph is linear, not sigmoid." },
    { q: "18. Why a linear curve is obtained in arithmetic growth?", opts: ["Because it has lag, log and stationary phase", "Because one daughter cell remains meristematic while the other daughter cell differentiates and matures", "Because of the effect of environment on mitosis", "None"], ans: 1, exp: "Because one daughter cell remains meristematic while the other differentiates and matures." },
    { q: "19. Go through the following points-\nI. Slow growth, thereafter exponential growth and then stationary phase\nII. Geometric and arithmetic phases\nIII. Characteristic of all living organisms growing in natural environment\nIV. W1 = W0 ert\nSigmoid curve | Exponential growth | Embryo development", opts: ["I, III | II | IV", "I | IV | II, III", "I, II | III, IV | -", "II, III | IV | I"], ans: 0, exp: "I, III | II | IV." },
    { q: "20. Exponential growth cannot sustain for long. The possible cause is -", opts: ["Limited nutrient available", "Limited space", "Accumulation of toxic materials", "All"], ans: 3, exp: "All are correct." },
    { q: "21. The rate of growth is highest in -", opts: ["Lag phase", "Log phase", "Steady phase", "None"], ans: 1, exp: "Log phase." },
    { q: "22. Plant growth is regulated by -", opts: ["Climatic factor", "Growth hormones", "Both", "Minerals"], ans: 2, exp: "Both." },
    { q: "23. A sigmoid growth curve is characteristic of -", opts: ["Bacteria growing in culture medium", "Organisms growing in natural habitat", "All cells, tissue and organs", "All"], ans: 3, exp: "All are correct." },
    { q: "24. The exponential growth can be expressed as W1 = W0 ert. \"r\" is-", opts: ["Relative growth rate and depends on final size", "It is initial size", "Relative growth and also referred to as efficiency index", "None of the above"], ans: 2, exp: "Relative growth and also referred to as efficiency index." },
    { q: "25. In exponential growth the final size depends upon -", opts: ["Initial size", "Growth rate", "Both", "None"], ans: 2, exp: "Both." },
    { q: "27. For growth which one(s) is essential -", opts: ["Nutrients", "H2O", "Both", "All"], ans: 3, exp: "All are correct." },
    { q: "28. Water is needed for-", opts: ["Cell-enlargement", "Providing aqueous medium for enzymatic reactions", "Both", "All"], ans: 3, exp: "All are correct." },
    { q: "29. I. O2 helps in releasing metabolic energy essential for growth activities.\nII. Nutrients (Micro and Macromolecules) are required by plants for the synthesis of protoplasm as well as act as source of energy\nIII. Optimum temperature for plant growth is needed\nIV. Environmental signal like light and gravity affect certain phases of growth", opts: ["All are correct", "All are incorrect", "I, II and IV are correct", "I and IV are correct"], ans: 0, exp: "All are correct." },
    { q: "30. During differentiation cell undergoes structural changes in their-", opts: ["Cell wall only", "Protoplasm only", "Apoplast only", "Cell wall and protoplast"], ans: 3, exp: "Cell wall and protoplast." },
    { q: "31. Under certain conditions regaining the lost capacity of division by living cells is called -", opts: ["Dedifferentiation", "Redifferentiation", "Differentiation", "Efficiency index"], ans: 0, exp: "Dedifferentiation." },
    { q: "32. Which one is the example of dedifferentiated cells?", opts: ["Procambium + Vascular cambium", "Vascular cambium + Interfascicular cambium", "Phellogen + Procambium", "Cork cambium + Interfascicular cambium"], ans: 1, exp: "Vascular cambium + Interfascicular cambium." },
    { q: "33. Which one(s) is/are redifferentiated cell(s)?", opts: ["Cork", "Secondary cortex", "Both", "None"], ans: 2, exp: "Both." },
    { q: "34. Growth in plants is -", opts: ["Only determinate", "Only indeterminate", "Mostly determinate", "Open (both determinate and indeterminate)"], ans: 3, exp: "Open (both determinate and indeterminate)." },
    { q: "35. Differentiation in plant is open because cells/tissues arising out of the same meristem -", opts: ["have same structure at maturity", "Have different structures at maturity", "Have capacity to disappear their cell walls", "Have same fate"], ans: 1, exp: "Have different structures at maturity." },
    { q: "36. Which of the following includes all three process -", opts: ["Differentiation", "Cell enlargement", "Seed germination, senescence", "Development"], ans: 3, exp: "Development." },
    { q: "37. The ability of plant to follow different pathways and produce different structures in response to environment and phases of life is termed as -", opts: ["Elasticity", "Growth efficiency", "Plasticity", "Heterophylly"], ans: 2, exp: "Plasticity." },
    { q: "38. The example of plasticity in plant Ranunculus is -", opts: ["Homophylly", "Isophylly", "Megaphylly", "Heterophylly"], ans: 3, exp: "Heterophylly." },
    { q: "39. Environmental heterophylly is seen in -", opts: ["Ranunculus (Buttercup)", "Cotton", "Coriander", "Larkspur"], ans: 0, exp: "Ranunculus (Buttercup)." },
    { q: "40. Intrinsic heterophylly is seen in all except -", opts: ["Cotton", "Coriander", "Buttercup", "Larkspur"], ans: 2, exp: "Buttercup." },
    { q: "41. Intrinsic factors affecting development include -", opts: ["Intracellular (genetic) factors", "Intercellular factors like light", "Intercellular factors like PGRs", "a and c"], ans: 3, exp: "a and c." },
    { q: "42. Extrinsic factors affecting the development include all except -", opts: ["O2, light, temperature", "CO2 and nutrients", "Water", "PGRs and genetic factors"], ans: 3, exp: "PGRs and genetic factors." },
    { q: "43. Match Column I with Column II - Column I: I. IAA, II. GA, III. ASA, IV. C2H4, V. Kinetin (N6-furfuryl amino purine). Column II: A. Terpenes, B. Indole compounds, C. Adenine derivatives, D. Gases, E. Carotenoid derivatives. The correct match is -", opts: ["I - B, II - A, III - E, IV - D, V - C", "I - A, II - B, III - C, IV - D, V - E", "I - E, II - D, III - A, IV - B, V - C", "None"], ans: 0, exp: "I - B, II - A, III - E, IV - D, V - C." },
    { q: "44. Which one includes growth promoters?", opts: ["Auxin, Cytokinin, ABA", "GA, Cytokinin, C2H4", "C2H4, ABA", "Auxin, Cytokinin, GA"], ans: 3, exp: "Auxin, Cytokinin, GA." },
    { q: "45. Which one include growth inhibitors?", opts: ["ABA, Cytokinin", "GA, IAA", "Both", "None"], ans: 2, exp: "Both." },
    { q: "46. PGRs include -", opts: ["Only growth promoters", "Only growth inhibitors", "Both growth promoters and growth inhibitors", "Only solid hormones, not gaseous hormones"], ans: 2, exp: "Both growth promoters and growth inhibitors." },
    { q: "47. Which of the following growth regulators can fit either of the groups (promoter and inhibitor)-", opts: ["C2H4", "ABA", "GA", "IAA"], ans: 0, exp: "C2H4." },
    { q: "48. I. Cell division\nII. Cell enlargement\nIII. Pattern formation\nIV. Tropic growth\nV. Flowering\nVI. Fruiting\nVII. Seed germination\nVIII. Response to wound\nIX. Response to stresses of biotic and abiotic origin\nWhich one is correct?\nFunctions of growth promoters | Functions of growth inhibitor", opts: ["I, II, VII, IX | III, IV, V, VI, VIII", "VIII, IX | I, II, III, IV, V, VI, VII", "I, II, III, IV, V, VI, VII | VIII, IX", "I, II, III, IV, V, VI, VII, IX | VIII"], ans: 2, exp: "I, II, III, IV, V, VI, VII | VIII, IX." },
    { q: "49. Column I: I. C. Darwin and F. Darwin, II. Miller and Skoog, III. F. W. Went, IV. Kurosawa. Column II: A. Cytokinin, B. ABA, C. C2H4, D. Auxin, E. GA. Correct Match is -", opts: ["I - D, II - A, III - D, IV - E", "I - D, II - A, III - D, IV - B", "I - C, II - A, III - B, IV - D", "I - E, II - D, III - B, IV - A"], ans: 0, exp: "I - D, II - A, III - D, IV - E." },
    { q: "50. Statement 1- Confirmation of the release of volatile substances from ripened oranges that hastened the ripening of stored unripe bananas.\nStatement II - Callus formation from the internodal segments of tobacco stem with the Auxin and extracts of vascular tissues/yeast/coconut milk/DNA. Later, Cytokinesis promoting substance was identified, crystallized and named as KINETIN.\nStatement III - Reporting of appearance of symptoms of bakane/foolish seedling disease caused by fungus Gibberella fujikuroi, in uninfected seedling when they were treated with sterile filtrates of the fungus. The active substances were later identified as GA.\nChoose the correct option -", opts: ["I - Miller + Skoog, II - Kurosawa, III - Cousins", "I - Kurosawa, II - Cousins, III - Miller + Skoog", "I - Cousins, II - Miller + Skoog, III - Kurosawa", "I - Cousins, II - Kurosawa, III - Miller + Skoog"], ans: 2, exp: "I - Cousins, II - Miller + Skoog, III - Kurosawa." },
    { q: "51. ABA was discovered during-", opts: ["Mid 1960s", "Mid 1906", "Mid 1966", "Mid 1967"], ans: 0, exp: "Mid 1960s." },
    { q: "52. The historical experiment on canary grasses coleoptile as a first step in the discovery of auxin was conducted by-", opts: ["Darwin", "Went", "Kogl", "Kurosawa"], ans: 0, exp: "Darwin." },
    { q: "53. Who isolated auxin from coleoptile seedling for the first time -", opts: ["Darwin", "Miller", "Skoog", "F. W. Went"], ans: 3, exp: "F. W. Went." },

    { q: "163. Which of the following statement is wrong about Abscisic acid :", opts: ["It helps in general plant metabolism", "It is antagonistic to GA3", "It helps in seed maturation & dormancy", "Morphogenesis"], ans: 0, exp: "It helps in general plant metabolism." },
    { q: "164. Vernalization", opts: ["Help in shortening the period between germination and flowering", "Is useless for monocots", "Is high temperature treatment to some annual crops", "More than one option is correct."], ans: 0, exp: "Help in shortening the period between germination and flowering." },
    { q: "165. A flash of red light followed by a flash of far red light given during the middle of the light to a short day plant will :", opts: ["Cause increased flower production", "Have no effect upon flowering", "Inhibit flowering", "Stimulate flowering"], ans: 1, exp: "Have no effect upon flowering." },
    { q: "166. Removal of shoot tips is a very useful technique to boost the production of tealeaves. This is because :", opts: ["Gibberellins delay senescence of leaves.", "Gibberellins prevent bolting and are inactivated.", "Auxins prevent leaf drop at early stages.", "Effect of auxins is removed and growth of lateral buds is enhanced."], ans: 3, exp: "Effect of auxins is removed and growth of lateral buds is enhanced." },
    { q: "167. In order to increase the yield of sugarcane crop, which of the following plant growth regulators should be sprayed?", opts: ["Cytokinins", "Ethylene", "Auxins", "Gibberellin"], ans: 3, exp: "Gibberellin." },
    { q: "168. It takes very long time for pineapple plants to produce flowers. Which combination of hormones can be applied to artificially induce flowering in pineapple plants throughout the year to increase yield?", opts: ["Auxin and Ethylene", "Gibberellin and Cytokinin", "Gibberellin and Abscisic acid", "Cytokinin and Abscisic acid"], ans: 0, exp: "Auxin and Ethylene." }
];

// ============================================================
// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
    palette.innerHTML = '';
    for (let i = 0; i < totalQ; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = i + 1;
        btn.id = 'pal-' + i;
        btn.onclick = () => goToQuestion(i);
        palette.appendChild(btn);
    }
}

function updatePalette() {
    for (let i = 0; i < totalQ; i++) {
        const btn = document.getElementById('pal-' + i);
        if (!btn) continue;
        btn.className = 'palette-btn';
        if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
        else if (marked[i]) btn.classList.add('marked');
        else if (userAnswers[i] !== null) btn.classList.add('attempted');
        else if (visited[i]) btn.classList.add('not-answered');
        else btn.classList.add('not-visited');
        if (i === currentQ) btn.classList.add('current');
    }
}

function updateStats() {
    let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
    for (let i = 0; i < totalQ; i++) {
        if (userAnswers[i] !== null) attempted++;
        else if (visited[i]) notAnswered++;
        else notVisited++;
        if (marked[i]) markedCount++;
    }
    document.getElementById('sbTotal').textContent = totalQ;
    document.getElementById('sbAttempted').textContent = attempted;
    document.getElementById('sbNotAnswered').textContent = notAnswered;
    document.getElementById('sbNotVisited').textContent = notVisited;
    document.getElementById('sbMarked').textContent = markedCount;
    document.getElementById('sbCorrect').textContent = correctCount;
    document.getElementById('sbWrong').textContent = wrongCount;
    const marks = correctCount * 1 - wrongCount * 0.25;
    document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
    visited[currentQ] = true;
    const q = questions[currentQ];
    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
        let cls = 'option';
        if (userAnswers[currentQ] !== null) {
            cls += ' disabled';
            if (oi === q.ans) cls += ' correct-ans';
            else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
        }
        optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
    });

    let fbHTML = '';
    if (userAnswers[currentQ] !== null) {
        const isCorrect = userAnswers[currentQ] === q.ans;
        fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
            ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
            ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
        </div>`;
    }

    questionBox.innerHTML = `
        <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
        <div>${optsHTML}</div>
        ${fbHTML}
    `;

    document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
    document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
    document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

    updatePalette();
    updateStats();
}

function selectAnswer(optIdx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = optIdx;
    if (optIdx === questions[currentQ].ans) correctCount++;
    else wrongCount++;
    renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
    const marks = correctCount * 1 - wrongCount * 0.25;
    const percent = ((marks / totalQ) * 100).toFixed(2);
    document.getElementById('rTotal').textContent = totalQ;
    document.getElementById('rCorrect').textContent = correctCount;
    document.getElementById('rWrong').textContent = wrongCount;
    document.getElementById('rMarks').textContent = marks.toFixed(2);
    document.getElementById('rPercent').textContent = percent + '%';
    document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
    if (!confirm('Are you sure you want to reset the quiz?')) return;
    for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
    correctCount = 0; wrongCount = 0; currentQ = 0;
    document.getElementById('resultModal').classList.remove('show');
    renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 13; // ⚠️ Chapter number (Yahan 15 hai)

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
