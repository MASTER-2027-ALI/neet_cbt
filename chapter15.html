<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        .quiz-header h2 { color: #2b6cb0; font-size: 18px; }

        .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
        .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }
        .option:hover { border-color: #90cdf4; background: #ebf8ff; }

        .feedback.wrong-fb { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }

        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
        .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
        .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
        .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
        .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
        .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
        .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
        .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
        .result-item .label { font-size: 12px; color: #4a5568; }
        .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
        .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
        .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
        .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
        .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
        .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        @media (max-width: 850px) {
            .main-container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
            .sidebar.open { transform: translateY(0); }
            .mobile-palette-toggle { display: block; }
            .quiz-area { min-height: 500px; }
        }
    </style>

<script>
const questions = [
    { q: "1. Which of the following use water from their environment as circulating fluid -", opts: ["Sponges", "Coelenterates", "a and b", "Fishes"], ans: 2, exp: "Sponges and coelenterates use water from their environment as circulating fluid." },
    { q: "2. Blood, a special type of connective tissue -", opts: ["Consists of a fluid matrix (Plasma)", "Has formed elements", "Is the most commonly used body fluid by most of the higher organisms", "All"], ans: 3, exp: "All are correct." },
    { q: "3. Plasma is a straw coloured, viscous fluid constituting nearly ____ % of blood -", opts: ["55", "45", "90", "10"], ans: 0, exp: "55%." },
    { q: "4. The amount of water present in blood plasma is -", opts: ["99%", "90-92%", "10%", "55%"], ans: 1, exp: "90-92%." },
    { q: "5. I. Proteins contribute 6 - 8% of the blood plasma\nII. Plasma contains very high amount of minerals\nIII. Plasma without the clotting factors is called serum\nIV Glucose, amino acids, lipids, etc., are also present in the plasma as they are always in transit in the body.\nOf the above statements -", opts: ["All are correct", "Only II is false", "Only I is correct", "All are false"], ans: 1, exp: "Only II is false." },
    { q: "6. Match List I with List II and select the correct option.\nList I: Plasma protein - I. Fibrinogen, II. Globulins, III. Albumins\nList II: Functions - A. Defence mechanism, B. Osmotic balance, C. Coagulation of blood", opts: ["I - C, II - A, III - B", "I - A, II - C, III - B", "I - C, II - B, III - A", "I - B, II - A, III - C"], ans: 0, exp: "I - C, II - A, III - B." },
    { q: "7. Formed elements of blood include -", opts: ["RBC, WBC and blood platelets", "Proteins present in blood", "All solutes present in blood", "All minerals (elements)"], ans: 0, exp: "RBC, WBC and blood platelets." },
    { q: "8. Which of the following statements is false?", opts: ["Erythrocytes/RBC are the least abundant of all the cells in blood", "The number of RBCs in adult man per mm3 of blood is 5 million to 5.5 million", "RBC are formed in the red bone marrow in the adults", "RBCs are enucleate in most of the mammals"], ans: 0, exp: "Erythrocytes/RBC are the most abundant of all the cells in blood." },
    { q: "9. Life span of human RBC is -", opts: ["120 hours", "120 month", "120 days", "102 days"], ans: 2, exp: "120 days." },
    { q: "10. What is the amount of haemoglobin present in 100 ml blood of human blood?", opts: ["45 g", "18-20 g", "12-16 g", "10-12 g"], ans: 2, exp: "12-16 g." },
    { q: "11. Mammalian RBCs are _____ in shape-", opts: ["Oval", "Biconvex", "biconcave", "Sickle like"], ans: 2, exp: "biconcave." },
    { q: "12. All of the following statement are correct about WBCs except -", opts: ["They are nucleate and least constancy in shape", "They are lesser in number (6000 - 8000 per mm3 blood)", "They are generally short lived", "They help in blood clotting"], ans: 3, exp: "They help in blood clotting." },
    { q: "13. All of the following are granulocytes except-", opts: ["Neutrophils", "Eosinophils", "Basophils only", "Lymphocytes and monocytes"], ans: 3, exp: "Lymphocytes and monocytes." },
    { q: "14. Match list I with list II correctly -\nList I: Types of leucocytes/WBCs - I. Neutrophils, II. Basophils, III. Monocytes, IV Eosinophils, V Lymphocytes\nList II: Their % (of total WBC) - A. 20 - 25, B. 2 - 3, C. 6 - 8, D. 0.5 - 1, E. 60 - 65", opts: ["I - E, II - D, III - C, IV - A, V - B", "I - A, II - B, III - C, IV - E, V - D", "I - E, II - D, III - C, IV - B, V - A", "I - B, II - D, III - A, IV - C, V - A"], ans: 0, exp: "I - E, II - D, III - C, IV - A, V - B." },
    { q: "15. Match the following -\nColumn I: I. Basophils, II. Neutrophils, III. Monocytes, IV Eosinophils, V Lymphocytes\nColumn II: A. Phagocytes, B. Secrete histamin, serotonin, heparin and involved in inflammatory response, C Resist infections and are also involved in allergic reaction, D. Immunity", opts: ["I - B, II and III - A, IV - C, V - D", "I - B, II and III - C, IV - A, V - D", "I - C, II and III - A, IV - B, V - D", "I - D, II and III - C, IV - A, V - B"], ans: 0, exp: "I - B, II and III - A, IV - C, V - D." },
    { q: "16. Megacaryotes produce-", opts: ["Leucocytes", "Lymphocytes", "Bone cells", "Blood platelets (thrombocytes)"], ans: 3, exp: "Blood platelets (thrombocytes)." },
    { q: "17. Which of the following is cell fragments?", opts: ["Leucocytes", "RBCs", "Blood platelets", "None"], ans: 2, exp: "Blood platelets." },
    { q: "18. 1 mm3 blood has how many blood platelets?", opts: ["150000 - 350000", "1.5 million to 3.5 million", "1500-3000", "10 to 15 lacs"], ans: 0, exp: "150000 - 350000." },
    { q: "19. During blood clotting - platelets release -", opts: ["Thrombin", "Fibrinogen", "Prothrombin", "Thrombokinase and other blood clotting factor"], ans: 3, exp: "Thrombokinase and other blood clotting factor." },
    { q: "20. ABO blood grouping is based on the presence or absence of _____ surface antigens", opts: ["2", "3", "6", "12"], ans: 0, exp: "2." },
    { q: "22. Which of the following blood groups is universal donor and universal acceptors respectively?", opts: ["AB, O", "O, AB", "AB, A", "A, AB"], ans: 1, exp: "O, AB." },
    { q: "24. Rh factor is concerned with blood grouping. It derives its name from-", opts: ["Man", "Chimpanzee", "Monkey", "Rat"], ans: 2, exp: "Monkey." },
    { q: "25. Rh factor is responsible for-", opts: ["Sickle cell anaemia", "erythroblastosis foetalis", "AIDS", "Turner syndrome"], ans: 1, exp: "erythroblastosis foetalis." },
    { q: "26. In developing foetus erythroblastosis foetalis is caused by-", opts: ["Haemolysis", "Clumping of RBCs", "Failure of blood clotting", "Phagocytosis by WBC"], ans: 0, exp: "Haemolysis." },
    { q: "27. In erythroblastosis foetalis, which of the following factors passes through placenta into foetus -", opts: ["Rh antigens", "Rh antibodies", "Agglutinins", "ABO antibodies"], ans: 1, exp: "Rh antibodies." },
    { q: "28. A doctor suggested to a couple not to have more than one child because of -", opts: ["Rh+ male and Rh- female", "Rh- male and Rh+ female", "Rh- male and Rh- female", "Rh+ male and Rh+ female"], ans: 0, exp: "Rh+ male and Rh- female." },
    { q: "29. Find the correct descending order of percentage proportion of leucocytes in human blood.", opts: ["Neutrophils -> Basophils -> Lymphocytes -> Acidophils (Eosinophils) -> Monocytes", "Neutrophils -> Monocytes -> Lymphocytes -> Acidophils -> Basophils", "Neutrophils -> Lymphocytes -> Monocytes -> Acidophils -> Basophils", "Neutrophils -> Acidophils -> Basophils -> Lymphocytes -> Monocytes"], ans: 2, exp: "Neutrophils -> Lymphocytes -> Monocytes -> Acidophils -> Basophils." },
    { q: "30. In case of emergency which blood group could be safely transfused?", opts: ["AB Rh-", "AB Rh+", "O Rh-", "O Rh+"], ans: 2, exp: "O Rh-." },
    { q: "31. Which of the following is expected if husband is Rh+ and wife is Rh-?", opts: ["No problem with 1st pregnancy", "Problem would be expected with future pregnancies", "Both", "No problem could be expected in any pregnancy"], ans: 2, exp: "Both." },
    { q: "32. Which of the following statements is correct?", opts: ["Rh compatibility must be tested before pregnancy establishment and blood transfusion", "Rh antibodies can cross placenta", "At the time of 1st delivery some of Rh+ RBCs from the baby (Rh+) mix the mother's blood (Rh-) due to tear in placenta mother's blood for Rh- antibodies", "All"], ans: 3, exp: "All are correct." },
    { q: "33. What is the correct order of these events?\n1. Conversion of fibrinogen to fibrin\n2. Clot retraction and leakage of serum\n3. Thromboplastin formation\n4. Conversion of prothrombin to thrombin", opts: ["3, 2, 1, 4", "3, 4, 1, 2", "3, 4, 2, 1", "4, 1, 3, 2"], ans: 1, exp: "3, 4, 1, 2." },
    { q: "34. Which of the following statement are correct?\nI. Ca+2 is necessary for blood coagulation\nII. Coagulation in blood vessel is prevented during normal condition by heparin\nIII. Clotting of blood involves changes of fibrinogen to fibrin by thrombin\nIV Blood clotting involves cascading process involving a number of factors present in the active form always", opts: ["I, III, IV", "II, IV", "I, II, III", "III, IV"], ans: 2, exp: "I, II, III." },
    { q: "35. Which of the following pathways is correct for blood clotting", opts: ["Thromboplastin or Thrombokinase -> Prothrombin -> Thrombin -> Fibrinogen -> Fibrin -> Clot", "Thromboplastin or Thrombokinase -> Fibrinogen -> Fibrin -> Thrombin -> Prothrombin -> Clot", "Thromboplastin or Thrombokinase -> Thrombin -> Prothrombin -> Fibrin -> Fibrinogen -> Clot", "Thromboplastin or Thrombokinase -> Prothrombin -> Thrombin -> Fibrinogen -> Fibrin -> Clot"], ans: 0, exp: "Thromboplastin or Thrombokinase -> Prothrombin -> Thrombin -> Fibrinogen -> Fibrin -> Clot." },
    { q: "36. Which of following statements is wrong about lymph.\nI. Lymph is colourful as it has haemoglobin but no RBC\nII. The fluid present in lymphatic system is called lymph\nIII. It contains specialized lymphocytes which are responsible for immunity of the body\nIV. Lymph is an important carrier for nutrients and hormones\nV. Fats are absorbed through lymph in the lacteals present in the intestinal villi", opts: ["Only I", "III and IV", "II and III", "Only IV"], ans: 0, exp: "Only I." },
    { q: "37. Which of the following statements is correct?\nI. Lymphatic system collects tissue fluid/interstitial fluid and drains it back to the major veins\nII. Interstitial fluid (tissue fluid) and lymph have almost similar composition\nIII. Lymph and interstitial fluid have no larger proteins and RBC\nIV. Exchange of nutrients and gases, etc. between the blood and cells always occurs through tissue fluid\nV. Interstitial fluid has the same mineral distribution as that in plasma\nVI. Lymph can be defined as blood minus RBC but has specialized lymphocytes", opts: ["All", "Only III and IV", "V and VI", "I, III, V"], ans: 0, exp: "All are correct." },
    { q: "38. Blood clotting pathways cause -", opts: ["Conversion of Vit. K to prothrombin", "Conversion of fibrin to fibrinogen", "Conversion of thrombin to prothrombin", "None of the above"], ans: 3, exp: "None of the above." },
    { q: "39. Open circulatory system is found in -", opts: ["Arthopods and molluscs", "Annelids and Chordates", "Annelids and arthopods", "Fishes and molluscs"], ans: 0, exp: "Arthopods and molluscs." },
    { q: "40. Closed circulatory system is found in -", opts: ["Arthopod and chordates", "Molluscs and chordates", "Amphibians and molluscs", "Annelids and chordates"], ans: 3, exp: "Annelids and chordates." },
    { q: "41. In an open circulatory system -", opts: ["There is no heart", "There is no need of blood vessels", "There is no distinction between blood and tissue fluid", "There are no open spaces or sinuses in the body"], ans: 2, exp: "There is no distinction between blood and tissue fluid." },
    { q: "42. Advantages of closed circulatory system over open circulatory system includes which of the following?", opts: ["Closed system can direct blood to specific tissues", "Exchange occurs more rapidly", "Close circulatory system can support higher levels of metabolic activity", "All"], ans: 3, exp: "All are correct." },
    { q: "43. Which of the following statements is wrong about the closed circulatory system?", opts: ["Blood remains within blood vessels and never comes in direct contact with the body cells", "In it flow of fluid can be more precisely regulated", "There is no blood capillary", "Blood flow is more rapid due to higher pressure"], ans: 2, exp: "There is no blood capillary." },
    { q: "45. In fishes the blood circulation is represented as - Body parts -> Impure blood -> Heart -> Gill -> Pure blood. The above flow of blood indicates it is a -", opts: ["Double circulation", "Single circulation", "Incomplete single circulation", "Incomplete double circulation"], ans: 1, exp: "Single circulation." },
    { q: "46. Incomplete double circulation is found in which of the following animals?", opts: ["Birds", "Mammals", "Birds and Mammals", "Amphibians and Reptiles"], ans: 3, exp: "Amphibians and Reptiles." },
    { q: "47. Which of the following statements is not true?", opts: ["Heart is ectodermal in origin", "In human beings heart is situated in the thoracic cavity, in between the two lungs slightly lifted to the left", "Human heart has the size of a clenched fist.", "Double wall membranous bag (pericardium) with pericardial fluid protects heart"], ans: 0, exp: "Heart is mesodermal in origin." },
    { q: "48. Which of the following is correct about human heart?", opts: ["The volume of both atria > the volume of both ventricles", "The volume of both ventricle > the volume of both atria", "The volume of both atria = the volume of both ventricles", "Ventricles are upper chambers and atria are lower chambers in our heart"], ans: 1, exp: "The volume of both ventricle > the volume of both atria." },

// ============================================================
// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
    palette.innerHTML = '';
    for (let i = 0; i < totalQ; i++) {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.textContent = i + 1;
        btn.id = 'pal-' + i;
        btn.onclick = () => goToQuestion(i);
        palette.appendChild(btn);
    }
}

function updatePalette() {
    for (let i = 0; i < totalQ; i++) {
        const btn = document.getElementById('pal-' + i);
        if (!btn) continue;
        btn.className = 'palette-btn';
        if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
        else if (marked[i]) btn.classList.add('marked');
        else if (userAnswers[i] !== null) btn.classList.add('attempted');
        else if (visited[i]) btn.classList.add('not-answered');
        else btn.classList.add('not-visited');
        if (i === currentQ) btn.classList.add('current');
    }
}

function updateStats() {
    let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
    for (let i = 0; i < totalQ; i++) {
        if (userAnswers[i] !== null) attempted++;
        else if (visited[i]) notAnswered++;
        else notVisited++;
        if (marked[i]) markedCount++;
    }
    document.getElementById('sbTotal').textContent = totalQ;
    document.getElementById('sbAttempted').textContent = attempted;
    document.getElementById('sbNotAnswered').textContent = notAnswered;
    document.getElementById('sbNotVisited').textContent = notVisited;
    document.getElementById('sbMarked').textContent = markedCount;
    document.getElementById('sbCorrect').textContent = correctCount;
    document.getElementById('sbWrong').textContent = wrongCount;
    const marks = correctCount * 1 - wrongCount * 0.25;
    document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
    visited[currentQ] = true;
    const q = questions[currentQ];
    let optsHTML = '';
    q.opts.forEach((opt, oi) => {
        let cls = 'option';
        if (userAnswers[currentQ] !== null) {
            cls += ' disabled';
            if (oi === q.ans) cls += ' correct-ans';
            else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
        }
        optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
    });

    let fbHTML = '';
    if (userAnswers[currentQ] !== null) {
        const isCorrect = userAnswers[currentQ] === q.ans;
        fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
            ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
            ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
        </div>`;
    }

    questionBox.innerHTML = `
        <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
        <div>${optsHTML}</div>
        ${fbHTML}
    `;

    document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
    document.getElementById('btnPrev').disabled = currentQ === 0;
    document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
    document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
    document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

    updatePalette();
    updateStats();
}

function selectAnswer(optIdx) {
    if (userAnswers[currentQ] !== null) return;
    userAnswers[currentQ] = optIdx;
    if (optIdx === questions[currentQ].ans) correctCount++;
    else wrongCount++;
    renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
    const marks = correctCount * 1 - wrongCount * 0.25;
    const percent = ((marks / totalQ) * 100).toFixed(2);
    document.getElementById('rTotal').textContent = totalQ;
    document.getElementById('rCorrect').textContent = correctCount;
    document.getElementById('rWrong').textContent = wrongCount;
    document.getElementById('rMarks').textContent = marks.toFixed(2);
    document.getElementById('rPercent').textContent = percent + '%';
    document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
    if (!confirm('Are you sure you want to reset the quiz?')) return;
    for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
    correctCount = 0; wrongCount = 0; currentQ = 0;
    document.getElementById('resultModal').classList.remove('show');
    renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Save Result + Back Button
// ========================================
const CHAPTER_NUM = 15; // ⚠️ यहाँ chapter number बदलें!

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to also save
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        try {
          const marks = correctCount * 1 - wrongCount * 0.25;
          const percent = ((marks / totalQ) * 100).toFixed(2);
          
          const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
          const userName = JSON.parse(localStorage.getItem('cbt_user') || '{}').name || 'Unknown';
const key = userName + '_chapter' + CHAPTER_NUM;
          
          const newAttempt = {
            correct: correctCount,
            wrong: wrongCount,
            total: totalQ,
            marks: parseFloat(marks.toFixed(2)),
            percent: parseFloat(percent),
            date: new Date().toISOString(),
            userName: JSON.parse(localStorage.getItem('cbt_user') || '{}').name || 'Unknown'
          };
          
          if (!results[key]) {
            results[key] = { attempts: [], totalAttempts: 0 };
          }
          
          results[key].attempts.push(newAttempt);
          results[key].totalAttempts = results[key].attempts.length;
          
          // Keep only last 10 attempts
          if (results[key].attempts.length > 10) {
            results[key].attempts = results[key].attempts.slice(-10);
          }
          
          // Calculate best
          const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
          results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
          
          localStorage.setItem('cbt_results', JSON.stringify(results));
          console.log('✅ Attempt #' + results[key].totalAttempts + ' saved for Chapter ' + CHAPTER_NUM);
        } catch(e) {
          console.log('Save error:', e);
        }
      };
    }
  }, 500);
});
window.addEventListener('load', function() {
  const container = document.querySelector('.container');
  if (container) {
    const backBtn = document.createElement('div');
    backBtn.style.cssText = 'text-align:center; margin-top:20px;';
    backBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:12px 30px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600;">← Back to Dashboard</a>';
    container.appendChild(backBtn);
  }
});
</script>
