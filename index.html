<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET 2027 CBT - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <div class="logo">🧬</div>
    <h1>NEET 2027 CBT</h1>
    <p class="subtitle">Class 11 & 12 Biology - Complete Test Series</p>
    <div class="input-group">
      <label>Enter Your Passkey</label>
      <input type="text" id="passkeyInput" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    </div>
    <button onclick="checkPasskey()" class="btn-login" id="loginBtn">🔓 Unlock Now</button>
    <div id="errorMsg" class="error-msg"></div>
    <p class="footer-text">© 2027 NEET CBT | All Rights Reserved</p>
  </div>
</div>

<script src="keys.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.checkPasskey = async function() {
  const input = document.getElementById('passkeyInput').value.trim().toUpperCase();
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  if (!input) {
    errorMsg.textContent = '⚠️ Please enter a passkey';
    errorMsg.style.display = 'block';
    return;
  }

  let user = null;

  // Check if Master Key exists
  if (typeof MASTER_KEY !== 'undefined' && input === MASTER_KEY) {
    user = { name: 'Admin', role: 'master', key: input };
  } else if (typeof FRIEND_KEYS !== 'undefined') {
    for (const key in FRIEND_KEYS) {
      if (FRIEND_KEYS[key].key === input) {
        user = { name: FRIEND_KEYS[key].name, role: 'friend', key: input };
        break;
      }
    }
  }

  if (user) {
    loginBtn.textContent = '⏳ Logging in...';
    loginBtn.disabled = true;
    errorMsg.style.display = 'none';
    loginWithFirebase(user);
  } else {
    errorMsg.textContent = '❌ Invalid Passkey. Please try again.';
    errorMsg.style.display = 'block';
    document.getElementById('passkeyInput').value = '';
    document.getElementById('passkeyInput').focus();
  }
};

async function loginWithFirebase(user) {
  try {
    const userCredential = await signInAnonymously(auth);
    const uid = userCredential.user.uid;
    const mySessionId = Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    
    // Passkey ko hi document ID banayenge taaki hamesha same rahe
    const sessionRef = doc(db, "sessions", user.key);
    const docSnap = await getDoc(sessionRef);
    let askConfirmation = false;
    
    if (docSnap.exists()) {
      // Agar pehle se koi session hai
      askConfirmation = true;
    }

    if (askConfirmation) {
      const confirmLogout = confirm("⚠️ आपकी इस पासकी से पहले से एक डिवाइस पर लॉगिन है।\n\nक्या आप उस पिछले डिवाइस को लॉगआउट करना चाहते हैं?\n\n(अगर आप 'Cancel' दबाते हैं, तो आप लॉगिन नहीं कर पाएंगे)");
      
      if (!confirmLogout) {
        alert("लॉगिन रद्द कर दिया गया है।");
        loginBtn.textContent = '🔓 Unlock Now';
        loginBtn.disabled = false;
        return;
      }
    }

    // Save new session to Firebase
    await setDoc(sessionRef, {
      sessionId: mySessionId,
      userName: user.name,
      userRole: user.role,
      loginTime: new Date().toISOString()
    });

    // Save to LocalStorage for the dashboard
    localStorage.setItem('cbt_user', JSON.stringify({
      name: user.name,
      role: user.role,
      uid: user.key, // UID ki jagah Passkey use kar rahe hain
      sessionId: mySessionId
    }));
    localStorage.setItem('cbt_login_time', new Date().toISOString());
    
    window.location.href = 'dashboard.html';
    
  } catch (error) {
    console.error('Login error:', error);
    document.getElementById('errorMsg').textContent = '❌ Login failed: ' + error.message;
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('loginBtn').textContent = '🔓 Unlock Now';
    document.getElementById('loginBtn').disabled = false;
  }
}

document.getElementById('passkeyInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') window.checkPasskey();
});

// Check if already logged in
window.addEventListener('load', function() {
  const userData = localStorage.getItem('cbt_user');
  if (userData) {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
