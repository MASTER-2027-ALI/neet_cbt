<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET 2027 CBT - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <div class="logo">🧬</div>
    <h1>NEET 2027 CBT</h1>
    <p class="subtitle">Class 11 Biology - Complete Test Series</p>
    <div class="input-group">
      <label>Enter Your Passkey</label>
      <input type="text" id="passkeyInput" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    </div>
    <button onclick="checkPasskey()" class="btn-login" id="loginBtn">🔓 Unlock Now</button>
    <div id="errorMsg" class="error-msg"></div>
    <p class="footer-text">© 2027 NEET CBT | All Rights Reserved</p>
  </div>
</div>

<script src="keys.js"></script>
<script>
function checkPasskey() {
  const input = document.getElementById('passkeyInput').value.trim().toUpperCase();
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');

  console.log('Login attempt:', input);
  console.log('MASTER_KEY:', typeof MASTER_KEY, MASTER_KEY);
  console.log('FRIEND_KEYS:', typeof FRIEND_KEYS, FRIEND_KEYS);

  if (!input) {
    errorMsg.textContent = '⚠️ Please enter a passkey';
    errorMsg.style.display = 'block';
    return;
  }

  let user = null;

  if (input === MASTER_KEY) {
    user = { name: 'Admin', role: 'master' };
    console.log('Master key matched');
  } else {
    for (const key in FRIEND_KEYS) {
      if (FRIEND_KEYS[key].key === input) {
        user = { name: FRIEND_KEYS[key].name, role: 'friend' };
        console.log('Friend key matched:', FRIEND_KEYS[key].name);
        break;
      }
    }
  }

  if (user) {
    loginBtn.textContent = '⏳ Logging in...';
    loginBtn.disabled = true;
    
    // Save user data
    localStorage.setItem('cbt_user', JSON.stringify({
      name: user.name,
      role: user.role,
      uid: 'user_' + Date.now()
    }));
    localStorage.setItem('cbt_login_time', new Date().toISOString());
    
    console.log('User saved, redirecting...');
    
    // Redirect
    setTimeout(function() {
      window.location.href = 'dashboard.html';
    }, 500);
  } else {
    errorMsg.textContent = '❌ Invalid Passkey. Please try again.';
    errorMsg.style.display = 'block';
    document.getElementById('passkeyInput').value = '';
    document.getElementById('passkeyInput').focus();
  }
}

// Enter key support
document.getElementById('passkeyInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') checkPasskey();
});

// Check if already logged in
window.addEventListener('load', function() {
  const userData = localStorage.getItem('cbt_user');
  if (userData) {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>
