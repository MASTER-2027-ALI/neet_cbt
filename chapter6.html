<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #1a202c; line-height: 1.6; padding: 10px; }
  .main-container { display: flex; max-width: 1400px; margin: 0 auto; gap: 15px; height: calc(100vh - 20px); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
  .stat-box { background: #ebf8ff; padding: 8px; border-radius: 6px; text-align: center; font-size: 12px; }
  .stat-box .num { font-size: 18px; font-weight: 700; color: #2c5282; }
  .stat-box .lbl { font-size: 11px; color: #4a5568; }
  .stat-box.green { background: #f0fff4; } .stat-box.green .num { color: #22543d; }
  .stat-box.red { background: #fff5f5; } .stat-box.red .num { color: #742a2a; }
  .stat-box.orange { background: #fffaf0; } .stat-box.orange .num { color: #7b341e; }
  .stat-box.purple { background: #faf5ff; } .stat-box.purple .num { color: #44337a; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; font-size: 11px; justify-content: center; }

  .legend .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .dot.not-visited { background: #e2e8f0; border: 1px solid #a0aec0; }
  .dot.attempted { background: #38a169; }
  .dot.not-answered { background: #e53e3e; }
  .dot.marked { background: #805ad5; }
  .dot.answered-marked { background: #805ad5; border: 2px solid #38a169; }
  .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .palette-btn { width: 100%; aspect-ratio: 1; border: 1px solid #cbd5e0; border-radius: 6px; background: #f7fafc; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .palette-btn:hover { transform: scale(1.05); }
  .palette-btn.not-visited { background: #edf2f7; color: #4a5568; }
  .palette-btn.attempted { background: #38a169; color: #fff; border-color: #2f855a; }
  .palette-btn.not-answered { background: #e53e3e; color: #fff; border-color: #c53030; }
  .palette-btn.marked { background: #805ad5; color: #fff; border-color: #6b46c1; }
  .palette-btn.answered-marked { background: #805ad5; color: #fff; border: 3px solid #38a169; }
  .palette-btn.current { outline: 3px solid #4299e1; outline-offset: 1px; }
  .quiz-area { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
  .quiz-header h2 { color: #2b6cb0; font-size: 18px; }
  .q-counter { background: #4299e1; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; }
  .question-box { flex: 1; margin-bottom: 15px; }
  .q-text { font-weight: 600; margin-bottom: 15px; font-size: 16px; line-height: 1.7; }
  .q-num-badge { display: inline-block; background: #4299e1; color: #fff; border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; font-size: 14px; margin-right: 10px; }
  .option { display: block; padding: 12px 16px; margin: 8px 0; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 15px; }
  .option:hover { border-color: #90cdf4; background: #ebf8ff; }
  .option.correct-ans { border-color: #38a169; background: #c6f6d5; font-weight: 600; }
  .option.wrong-ans { border-color: #e53e3e; background: #fed7d7; }
  .option.disabled { pointer-events: none; opacity: 0.8; }
  .feedback { margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #c6f6d5; color: #22543d; border-left: 4px solid #38a169; }
  .feedback.wrong-fb { background: #fed7d7; color: #742a2a; border-left: 4px solid #e53e3e; }
  .feedback .exp { margin-top: 6px; font-style: italic; color: #4a5568; }
  .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-top: 10px; border-top: 2px solid #e2e8f0; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: #4299e1; color: #fff; } .btn-primary:hover { background: #3182ce; }
  .btn-secondary { background: #a0aec0; color: #fff; } .btn-secondary:hover { background: #718096; }
  .btn-warning { background: #d69e2e; color: #fff; } .btn-warning:hover { background: #b7791f; }
  .btn-success { background: #38a169; color: #fff; } .btn-success:hover { background: #2f855a; }
  .btn-danger { background: #e53e3e; color: #fff; } .btn-danger:hover { background: #c53030; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-marked { background: #805ad5; color: #fff; } .btn-marked:hover { background: #6b46c1; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; }
  .modal-box h2 { color: #2b6cb0; margin-bottom: 20px; }
  .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 20px 0; }
  .result-item { background: #ebf8ff; padding: 15px; border-radius: 10px; }
  .result-item .label { font-size: 12px; color: #4a5568; }
  .result-item .value { font-size: 24px; font-weight: 700; color: #2c5282; margin-top: 4px; }
  .result-item.green { background: #f0fff4; } .result-item.green .value { color: #22543d; }
  .result-item.red { background: #fff5f5; } .result-item.red .value { color: #742a2a; }
  .result-item.purple { background: #faf5ff; } .result-item.purple .value { color: #44337a; }
  .result-item.orange { background: #fffaf0; } .result-item.orange .value { color: #7b341e; }
  .mobile-palette-toggle { display: none; position: fixed; bottom: 15px; right: 15px; z-index: 500; background: #4299e1; color: #fff; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 22px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
  @media (max-width: 850px) {
    .main-container { flex-direction: column; height: auto; }
    .sidebar { width: 100%; max-height: 300px; position: fixed; top: 0; left: 0; right: 0; z-index: 600; transform: translateY(-100%); transition: transform 0.3s; border-radius: 0 0 12px 12px; }
    .sidebar.open { transform: translateY(0); }
    .mobile-palette-toggle { display: block; }
    .quiz-area { min-height: 500px; }
  }
</style>
</head>

<script>
const questions = [
  { q: "Which one is correct?", opts: ["Anatomy - Internal morphology, study of internal structure", "Tissue - A group of cells having a common origin and usually performing a common function", "Permanent tissue has more power of mitosis", "a and b"], ans: 3, exp: "a and b." },
  { q: "Which one produces primary tissues?", opts: ["Apical meristem", "Root apical meristem", "Shoot apical meristem", "Lateral meristem"], ans: 0, exp: "Apical meristem." },
  { q: "Meristems are present in —", opts: ["Root apex and shoot apex", "Bases of leaves", "Axillary buds", "All"], ans: 3, exp: "All." },
  { q: "During formation of leaves and elongation of stem, some cells 'left behind' from the shoot apical meristem, constitute —", opts: ["Lateral meristem", "Axillary bud", "Cork cambium", "Fascicular cambium"], ans: 1, exp: "Axillary bud." },
  { q: "A branch or a flower is developed in the axil of leaves by —", opts: ["Apical bud", "Axillary bud", "Apical meristem", "Shoot apical meristem"], ans: 1, exp: "Axillary bud." },
  { q: "Which one is correct about intercalary meristem?", opts: ["It occurs between mature tissues", "It occurs in grasses and regenerate parts removed by grazing herbivores", "It is a primary meristem", "All"], ans: 3, exp: "All." },
  { q: "All are lateral meristems except —", opts: ["Fascicular / vascular cambium", "Interfascicular cambium", "Apical and intercalary meristem", "Phellogen"], ans: 2, exp: "Apical and intercalary meristem." },
  { q: "Secondary tissues are produced by all except —", opts: ["Fascicular cambium", "Interfascicular cambium", "Apical meristem", "Phellogen"], ans: 2, exp: "Apical meristem." },
  { q: "Permanent tissue consists of cells having no power of cell division. Such tissues are formed by —", opts: ["Primary meristem", "Cork cambium", "Fascicular and interfascicular cambium", "All"], ans: 3, exp: "All." },
  { q: "Primary tissues of a plant —", opts: ["Add to the length of roots and shoots", "Add to the diameter of existing roots and shoots", "Are found only in the embryo", "Are found only in the seedling"], ans: 0, exp: "Add to the length of roots and shoots." },
  { q: "Secondary tissues of a plant —", opts: ["Add to the length of roots and shoots", "Add to the diameter of existing roots and shoots", "Are found only in the embryo", "Are found only in the seedling"], ans: 1, exp: "Add to the diameter of existing roots and shoots." },
  { q: "Cells of permanent tissues are specialised —", opts: ["Functionally", "Only structurally", "Both structurally and functionally", "For mitosis"], ans: 2, exp: "Both structurally and functionally." },
  { q: "During the formation of the primary plant body, specific regions of the apical meristem produce —", opts: ["Dermal tissues", "Ground tissues", "Vascular tissues", "All"], ans: 3, exp: "All." },
  { q: "Apical meristems and intercalary meristem are primary meristem because they —", opts: ["Are disintegrated after primary growth of plant", "Are disintegrated after secondary growth of plant", "Appear early in life of a plant and contribute to the formation of the primary plant body", "None"], ans: 2, exp: "Appear early in life of a plant and contribute to the formation of the primary plant body." },
  { q: "Meristem helps in —", opts: ["Absorption of water", "Growth of plants", "Absorption of minerals", "Transpiration"], ans: 1, exp: "Growth of plants." },
  { q: "Grass stem elongates after initial growth due to —", opts: ["Lateral meristem", "Secondary meristem", "Intercalary meristem", "Apical meristem"], ans: 2, exp: "Intercalary meristem." },
  { q: "Meristematic activity occurs at —", opts: ["Vascular tissue", "Stem apex", "Leaf", "Root hair"], ans: 1, exp: "Stem apex." },
  { q: "Root apex is subterminal because it is —", opts: ["Covered with root hair", "Covered with root cap", "Covered with epidermis", "Under the soil"], ans: 1, exp: "Covered with root cap." },
  { q: "Axillary and terminal buds develop by activity of —", opts: ["Lateral meristem", "Intercalary meristem", "Apical meristem", "Parenchyma"], ans: 2, exp: "Apical meristem." },
  { q: "Which one is secondary lateral meristem?", opts: ["Intercalary", "Cork cambium", "Interfascicular cambium", "Both b and c"], ans: 3, exp: "Both b and c." },
  { q: "Which one is correct?", opts: ["Permanent tissues having all cells similar in structure and function are simple tissues", "Permanent tissues having different types of cell are complex tissue", "Parenchyma, collenchyma and sclerenchyma are simple tissue", "All"], ans: 3, exp: "All." },
  { q: "I. Forms major component within organs. II. Cell wall - thin, cellulosic. III. Shape of cells - generally isodiametric. IV. Intercellular space - Present / absent. V. Photosynthetic, storage or secretory in function. The above characters are attributed to —", opts: ["Collenchyma", "Parenchyma", "Sclerenchyma", "Vascular tissue"], ans: 1, exp: "Parenchyma." },
  { q: "I. Occur as layers or patches. II. Cell wall - Unevenly thickened due to pectocellulosic deposition. III. Cells - Spherical, oval or polygonal. IV. Often has chloroplast. V. Living mechanical tissue. VI. Occur in hypodermis of young dicot stem and petiole. The characters are shown by which of the following tissues —", opts: ["Parenchyma", "Collenchyma", "Sclerenchyma", "Vascular tissue"], ans: 1, exp: "Collenchyma." },
  { q: "Root hairs are present in —", opts: ["Zone of cell division", "Zone of cell elongation", "Zone of maturation", "Root cap"], ans: 2, exp: "Zone of maturation." },
  { q: "Dead cells with narrow lumen, lignified cell wall with a few or numerous pits and serving a mechanical function only are called —", opts: ["Collenchyma", "Xylem", "Aerenchyma", "Sclerenchyma"], ans: 3, exp: "Sclerenchyma." },
  { q: "Fibres and sclereids are the types of —", opts: ["Parenchyma", "Collenchyma", "Sclerenchyma", "Xylem"], ans: 2, exp: "Sclerenchyma." },
  { q: "The dead, elongated cells having lignified thick cell wall occurring in groups, with tapering ends and serving a mechanical function are called —", opts: ["Fibres", "Vessels", "Tracheids", "Collenchyma"], ans: 0, exp: "Fibres." },
  { q: "Which of the following statements is incorrect about sclereids (stone cells) —", opts: ["Variously shaped", "Highly thickened + lignified cell wall and lumen is narrow", "Commonly found in the fruits, wall of nuts, seed coats of legumes and leaves", "They are types of parenchyma"], ans: 3, exp: "They are types of sclerenchyma." },
  { q: "Xylem —", opts: ["Functions as conducting tissue for water and minerals from root to the stem and leaves", "Provides mechanical strength to plant parts", "Both", "Is absent in pteridophytes"], ans: 2, exp: "Both." },
  { q: "Xylem in angiosperms consists of how many types of elements?", opts: ["4", "3", "2", "1"], ans: 0, exp: "4." },
  { q: "Angiospermic xylem consists of —", opts: ["Vessels + Tracheids only", "Tracheids + Fibres only", "Vessel, tracheids, fibres and parenchyma", "Parenchyma and fibres only"], ans: 2, exp: "Vessel, tracheids, fibres and parenchyma." },
  { q: "In pteridophytes and gymnosperms, xylem consists of all except —", opts: ["Vessel", "Tracheid", "Fibre", "Parenchyma"], ans: 0, exp: "Vessel." },
  { q: "Tracheid, vessel and sclereids are similar in that they all —", opts: ["Lack secondary walls", "Conduct water and minerals", "Function when dead", "Have open ends"], ans: 2, exp: "Function when dead." },
  { q: "In each vascular bundle, the tissue nearest to the centre of the stem is —", opts: ["Phloem", "Fibres", "Vascular cambium", "Xylem"], ans: 3, exp: "Xylem." },
  { q: "Conducting cells called ___ elements are the part of xylem where water and minerals are transported —", opts: ["Tracheary", "Vascular", "Vessel", "Phloem"], ans: 0, exp: "Tracheary." },
  { q: "Unlike tracheids, vessel elements —", opts: ["Function when dead", "Are spindle shaped", "Are found primarily in gymnosperms", "Lose part or all of the end walls"], ans: 3, exp: "Lose part or all of the end walls." },
  { q: "The ___ is the centermost tissue in a dicot stem.", opts: ["Pith", "Xylem", "Phloem", "Pericycle"], ans: 0, exp: "Pith." },
  { q: "Tracheids and vessel elements —", opts: ["Die before they become functional", "Are important constituents of all plants", "Are found in the secondary plant body", "Are without lignified cell wall"], ans: 0, exp: "Die before they become functional." },
  { q: "How many tissues are present within dicot root having cortex, endodermis, pericycle, pith, xylem and phloem?", opts: ["5", "6", "3", "12"], ans: 1, exp: "6." },
  { q: "I. Multicellular with wide lumen. II. They consist of vertical rows of cells with cross wall dissolved. III. Discontinuous lumen due to presence of end walls. IV. They are dead. V. Cell walls are lignified. VI. Long, cylindrical tube-like structure. VII. Elongated cells with tapering ends. Match the above characters with A. Vessel, B. Tracheid.", opts: ["A-I, II, IV, V, VI; B-III, IV, V, VII", "A-III, IV, V, VII; B-I, II, IV, V, VI", "A-I, IV, V, VII; B-III, II, IV, V, VII", "A-I, II, III, IV; B-II, V, VI, VII"], ans: 0, exp: "A-I, II, IV, V, VI; B-III, IV, V, VII." },
  { q: "Which of the following is the living element of xylem —", opts: ["Fibre", "Parenchyma", "Tracheid", "Vessel"], ans: 1, exp: "Parenchyma." },
  { q: "Xylem parenchyma stores —", opts: ["Starch", "Fat", "Tannins", "All"], ans: 3, exp: "All." },
  { q: "Ray parenchymatous cells —", opts: ["Are living", "Are dead", "Perform radial conduction of water", "a and c"], ans: 3, exp: "a and c." },
  { q: "In angiosperm phloem —", opts: ["Both the sieve tube elements and companion cells have nuclei", "Sieve tube elements have nuclei but companion cells do not", "The companion cells have nuclei but the sieve tube elements do not", "Neither the companion cells nor sieve tube elements have nuclei"], ans: 2, exp: "The companion cells have nuclei but the sieve tube elements do not." },
  { q: "Sieve tube members have sieve plates where they join with other sieve tube members. Which of the following best describes the sieve plates?", opts: ["Sieve plates are necessary to allow conduction between sieve tube cells", "Sieve plates allow joining of cytoplasm between adjacent tube cells", "Sieve plates are the perforated end walls of sieve tubes", "All"], ans: 3, exp: "All." },
  { q: "The living and non-lignified component of vascular bundle is / are —", opts: ["Vessel and tracheids", "Vessel and phloem", "Wood fibre and phloem", "Wood parenchyma and sieve tube"], ans: 3, exp: "Wood parenchyma and sieve tube." },
  { q: "Match the Column I with Column II: I. Sieve tube, II. Companion cell, III. Albuminous cells, IV. Sieve cell, V. Parenchyma, VI. Fibre. A. Gymnospermic phloem, B. Angiospermic phloem.", opts: ["A = I, II, V, VI; B = III, IV, V, VI", "A = I, III, IV, V, VI; B = II, III, IV, V, VI", "A = III, IV, V, VI; B = I, II, V, VI", "A = I, V, VI; B = II, III, IV"], ans: 2, exp: "A = III, IV, V, VI; B = I, II, V, VI." },
  { q: "I. Sieve tube or sieve cell is living but enucleate. II. Xylem and phloem constitute the vascular bundle. III. First formed xylem element and phloem element are called metaxylem and metaphloem respectively. IV. Phloem fibres are generally absent in primary phloem. V. Phloem parenchyma is absent in most of the monocots. Which of the above statements is wrong?", opts: ["I, II, V", "III", "IV, V", "III, IV"], ans: 1, exp: "III." },
  { q: "Which of the following statements is incorrect about companion cell?", opts: ["It is a specialised parenchymatous cell", "Its nucleus controls the function of sieve tube", "It helps in maintaining the pressure gradient in sieve tube", "It is present in all vascular plants having phloem"], ans: 3, exp: "It is present in all vascular plants having phloem." },
  { q: "Heterogeneous tissues are —", opts: ["vascular and cork cambia", "Xylem and phloem elements", "Dermal layer and ground tissue", "Parenchyma and sclerenchyma"], ans: 1, exp: "Xylem and phloem elements." },
  { q: "At maturity, sieve tubes do not possess —", opts: ["Cell wall", "Nucleus", "Cytoplasm", "Vacuoles"], ans: 1, exp: "Nucleus." },
  { q: "Sieve tube is —", opts: ["Multicellular, vessel like structure", "Provided with porous septa", "The main conducting element for translocation of food", "All of the above"], ans: 3, exp: "All of the above." },
  { q: "Complex tissue comprises —", opts: ["Xylem and phloem", "Heterogeneous tissue", "Conductive tissue", "All of these"], ans: 3, exp: "All of these." },
  { q: "Albuminous cells of gymnosperms are equivalent to —", opts: ["Sieve tubes", "Sieve cells", "Companion cells", "Cork cambium"], ans: 2, exp: "Companion cells." },

// ============================================================
// QUIZ LOGIC
// ============================================================
const totalQ = questions.length;
let currentQ = 0;
const userAnswers = new Array(totalQ).fill(null);
const marked = new Array(totalQ).fill(false);
const visited = new Array(totalQ).fill(false);
let correctCount = 0;
let wrongCount = 0;

const questionBox = document.getElementById('questionBox');
const palette = document.getElementById('palette');

function renderPalette() {
  palette.innerHTML = '';
  for (let i = 0; i < totalQ; i++) {
    const btn = document.createElement('button');
    btn.className = 'palette-btn';
    btn.textContent = i + 1;
    btn.id = 'pal-' + i;
    btn.onclick = () => goToQuestion(i);
    palette.appendChild(btn);
  }
}

function updatePalette() {
  for (let i = 0; i < totalQ; i++) {
    const btn = document.getElementById('pal-' + i);
    if (!btn) continue;
    btn.className = 'palette-btn';
    if (userAnswers[i] !== null && marked[i]) btn.classList.add('answered-marked');
    else if (marked[i]) btn.classList.add('marked');
    else if (userAnswers[i] !== null) btn.classList.add('attempted');
    else if (visited[i]) btn.classList.add('not-answered');
    else btn.classList.add('not-visited');
    if (i === currentQ) btn.classList.add('current');
  }
}

function updateStats() {
  let attempted = 0, notAnswered = 0, notVisited = 0, markedCount = 0;
  for (let i = 0; i < totalQ; i++) {
    if (userAnswers[i] !== null) attempted++;
    else if (visited[i]) notAnswered++;
    else notVisited++;
    if (marked[i]) markedCount++;
  }
  document.getElementById('sbTotal').textContent = totalQ;
  document.getElementById('sbAttempted').textContent = attempted;
  document.getElementById('sbNotAnswered').textContent = notAnswered;
  document.getElementById('sbNotVisited').textContent = notVisited;
  document.getElementById('sbMarked').textContent = markedCount;
  document.getElementById('sbCorrect').textContent = correctCount;
  document.getElementById('sbWrong').textContent = wrongCount;
  const marks = correctCount * 1 - wrongCount * 0.25;
  document.getElementById('sbMarks').textContent = marks.toFixed(2);
}

function renderQuestion() {
  visited[currentQ] = true;
  const q = questions[currentQ];
  let optsHTML = '';
  q.opts.forEach((opt, oi) => {
    let cls = 'option';
    if (userAnswers[currentQ] !== null) {
      cls += ' disabled';
      if (oi === q.ans) cls += ' correct-ans';
      else if (oi === userAnswers[currentQ]) cls += ' wrong-ans';
    }
    optsHTML += `<div class="${cls}" id="opt-${currentQ}-${oi}" onclick="selectAnswer(${oi})"><strong>${String.fromCharCode(65 + oi)}.</strong> ${opt}</div>`;
  });

  let fbHTML = '';
  if (userAnswers[currentQ] !== null) {
    const isCorrect = userAnswers[currentQ] === q.ans;
    fbHTML = `<div class="feedback show ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✅ <strong>Sahi Jawab!</strong>' : '❌ <strong>Galat Jawab.</strong> Sahi jawab: <strong>' + String.fromCharCode(65 + q.ans) + '. ' + q.opts[q.ans] + '</strong>'}
      ${q.exp ? '<div class="exp">📖 ' + q.exp + '</div>' : ''}
    </div>`;
  }

  questionBox.innerHTML = `
    <div class="q-text"><span class="q-num-badge">${currentQ + 1}</span>${q.q}</div>
    <div>${optsHTML}</div>
    ${fbHTML}
  `;

  document.getElementById('qCounter').textContent = `Q ${currentQ + 1} / ${totalQ}`;
  document.getElementById('btnPrev').disabled = currentQ === 0;
  document.getElementById('btnNext').disabled = currentQ === totalQ - 1;
  document.getElementById('btnMark').textContent = marked[currentQ] ? '🔖 Unmark' : '🔖 Mark for Review';
  document.getElementById('btnMark').className = marked[currentQ] ? 'btn btn-marked' : 'btn btn-warning';

  updatePalette();
  updateStats();
}

function selectAnswer(optIdx) {
  if (userAnswers[currentQ] !== null) return;
  userAnswers[currentQ] = optIdx;
  if (optIdx === questions[currentQ].ans) correctCount++;
  else wrongCount++;
  renderQuestion();
}

function goToQuestion(idx) { currentQ = idx; renderQuestion(); document.querySelector('.sidebar').classList.remove('open'); }
function nextQuestion() { if (currentQ < totalQ - 1) { currentQ++; renderQuestion(); } }
function prevQuestion() { if (currentQ > 0) { currentQ--; renderQuestion(); } }
function toggleMark() { marked[currentQ] = !marked[currentQ]; renderQuestion(); }

function showResult() {
  const marks = correctCount * 1 - wrongCount * 0.25;
  const percent = ((marks / totalQ) * 100).toFixed(2);
  document.getElementById('rTotal').textContent = totalQ;
  document.getElementById('rCorrect').textContent = correctCount;
  document.getElementById('rWrong').textContent = wrongCount;
  document.getElementById('rMarks').textContent = marks.toFixed(2);
  document.getElementById('rPercent').textContent = percent + '%';
  document.getElementById('resultModal').classList.add('show');
}

function resetQuiz() {
  if (!confirm('Are you sure you want to reset the quiz?')) return;
  for (let i = 0; i < totalQ; i++) { userAnswers[i] = null; marked[i] = false; visited[i] = false; }
  correctCount = 0; wrongCount = 0; currentQ = 0;
  document.getElementById('resultModal').classList.remove('show');
  renderQuestion();
}

renderPalette();
renderQuestion();
// ========================================
// NEET CBT - Firebase Result Save + Back Button
// ========================================
const CHAPTER_NUM = 6; // ⚠️ Chapter number (Yahan 6 hai)

// Check login
const _userData = localStorage.getItem('cbt_user');
if (!_userData) {
  window.location.href = 'index.html';
}
const _currentUser = JSON.parse(_userData);

window.addEventListener('load', function() {
  setTimeout(function() {
    // Add Back button
    const container = document.querySelector('.main-container');
    if (container && !document.getElementById('topBackBtn')) {
      const topBtn = document.createElement('div');
      topBtn.id = 'topBackBtn';
      topBtn.style.cssText = 'position:fixed; top:15px; left:15px; z-index:999;';
      topBtn.innerHTML = '<a href="dashboard.html" style="display:inline-block; padding:10px 20px; background:#4299e1; color:#fff; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">← Back to Dashboard</a>';
      document.body.appendChild(topBtn);
    }

    // Override showResult to save to localStorage + Firebase
    if (typeof window.showResult === 'function') {
      const _originalShowResult = window.showResult;
      window.showResult = function() {
        _originalShowResult();
        
        const marks = correctCount * 1 - wrongCount * 0.25;
        const percent = parseFloat(((marks / totalQ) * 100).toFixed(2));
        
        const attemptData = {
          userName: _currentUser.name,
          userRole: _currentUser.role,
          chapterNum: CHAPTER_NUM,
          correct: correctCount,
          wrong: wrongCount,
          total: totalQ,
          marks: parseFloat(marks.toFixed(2)),
          percent: percent,
          timestamp: new Date().toISOString()
        };
        
        // 1. Save to localStorage
        const results = JSON.parse(localStorage.getItem('cbt_results') || '{}');
        const key = _currentUser.name + '_chapter' + CHAPTER_NUM;
        if (!results[key]) results[key] = { attempts: [], totalAttempts: 0 };
        results[key].attempts.push(attemptData);
        if (results[key].attempts.length > 10) {
          results[key].attempts = results[key].attempts.slice(-10);
        }
        const bestPercent = Math.max(...results[key].attempts.map(a => a.percent));
        results[key].best = results[key].attempts.find(a => a.percent === bestPercent);
        localStorage.setItem('cbt_results', JSON.stringify(results));
        console.log('✅ Saved to localStorage');
        
        // 2. Save to Firebase
        saveToFirebase(attemptData);
      };
    }
  }, 500);
});

// Firebase Save Function
async function saveToFirebase(data) {
  try {
    console.log('🔥 Firebase: Starting save...');
    if (typeof firebaseConfig === 'undefined') {
      console.error('❌ firebaseConfig is undefined! Check keys.js');
      return;
    }
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    
    const app = initializeApp(firebaseConfig, 'chapter' + CHAPTER_NUM);
    const db = getFirestore(app);
    
    await addDoc(collection(db, "results"), data);
    console.log('✅ Saved to Firebase!');
  } catch(e) {
    console.error('❌ Firebase save error:', e);
  }
}
</script>
